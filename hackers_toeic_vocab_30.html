  {
    num:23, story:"역지사지", category:"사원 복지",
    desc:"사원 복지 주제에서는 주로 새로운 사내 복지 제도 이용에 대한 공지, 기존 복지 제도 변경 안내 등이 출제되고 있다",
    words:[
  {n:1,en:"host",pron:"[미 houst / 영 həust]",pos:"v",kr:"(대회 등을) 주최하다",ex:"Wilmar Industries will <b>host</b> this year's convention.",exkr:"Wilmar Industries사가 금년도 컨벤션을 주최할 것이다.",stars:1,tip:"host + a display/a lecture/a celebration 전시/강의/축하 행사를 주최하다. host는 행사를 의미하는 명사들과 어울려 출제된다.",deriv:"n. 주최자; 사회자"},
  {n:2,en:"annual",pron:"[ǽnjuəl]",pos:"adj",kr:"매년의",ex:"This year's <b>annual</b> conference was held in Atlanta.",exkr:"올해의 연례 회의는 애틀랜타에서 열렸다.",stars:3,tip:"annual growth rate 연간 성장률 / annual conference 연례 회의 / annual safety inspection 연례 안전 검사. annual의 토익 출제 표현을 기억해 두자. // biannual 반년마다의 / biennial 2년마다의 — biannual은 토익 지문에 자주 출제되는 단어로 twice a year와 같은 의미이다. 철자가 비슷한 biennial과 혼동하지 않도록 유의하자.",deriv:"annually adv. 매년, 해마다"},
  {n:3,en:"purpose",pron:"[미 pɔ́:rpəs / 영 pɔ́:pəs]",pos:"n",kr:"목적, 의도",ex:"The <b>purpose</b> of the training is to familiarize the staff with the new networking system.",exkr:"그 교육의 목적은 직원들이 새 네트워크 시스템에 익숙해지도록 하는 것이다.",stars:2,deriv:"purposely adv. 고의로, 일부러 / aim 목적"},
  {n:4,en:"enroll",pron:"[미 inróul / 영 inrául]",pos:"v",kr:"등록하다",ex:"Employees must <b>enroll</b> in at least one program.",exkr:"직원들은 적어도 한 개의 프로그램에 등록해야 한다.",stars:2,tip:"enroll in ~에 등록하다. enroll과 함께 쓰이는 전치사 in을 묶어서 기억해 두자.",deriv:"enrollment n. 등록 / register, sign up 등록하다"},
  {n:5,en:"lecture",pron:"[미 léktʃər / 영 léktʃə]",pos:"n",kr:"강의, 강연",ex:"The course will offer weekly guest <b>lectures</b>.",exkr:"그 강좌는 매주 초청 강의를 제공할 것이다.",stars:2,deriv:"lecturer n. 강연자"},
  {n:6,en:"participant",pron:"[미 pa:rtísəpənt / 영 pa:tísipənt]",pos:"n",kr:"참가자",ex:"Many <b>participants</b> in the training program showed some improvement.",exkr:"교육 프로그램의 많은 참가자들이 약간의 발전을 보였다.",stars:3,deriv:"participate v. 참가하다 / participation n. 참가 / attendee 참가자"},
  {n:7,en:"attend",pron:"[əténd]",pos:"v",kr:"참석하다, 출석하다",ex:"Staff were urged to <b>attend</b> weekend software courses.",exkr:"직원들은 주말 소프트웨어 강좌에 참석하도록 권고받았다.",stars:3,tip:"attend : participate — '참석하다'를 뜻하는 단어들의 용례 차이를 구별하는 문제로 출제된다. attend ~에 참석하다(타동사이므로 뒤에 바로 목적어가 온다) / participate in ~에 참석하다(participate는 자동사이므로 전치사 in이 있어야 목적어가 올 수 있다). Employees <b>participated in</b> company-sponsored sporting events. 직원들은 회사가 후원한 스포츠 행사에 참석했다. // attend to ~을 처리하다, ~를 돌보다. 자동사 attend는 전치사 to와 함께 쓰이고, 이때 take care of와 같은 의미이다.",deriv:"attendance n. 참석, 출석 / attendee 참석자 / attendant n. 시중드는 사람, 안내원"},
  {n:8,en:"encourage",pron:"[미 inkɔ́:ridʒ / 영 inkʌ́ridʒ]",pos:"v",kr:"장려하다, 북돋아 주다",ex:"The CEO <b>encouraged</b> managers to allow flextime for workers.",exkr:"그 최고 경영자는 부장들에게 직원들의 탄력 근무 시간제를 허용하도록 장려했다.",stars:3,tip:"encourage A to do A에게 ~하도록 장려하다 / be encouraged to do ~하도록 장려되다. encourage는 주로 to부정사와 어울려 시험에 출제된다. to 뒤의 동사원형 자리에 명사를 쓰지 않도록 주의해야 한다.",deriv:"promote 증진하다, 촉진하다"},
  {n:9,en:"leave",pron:"[li:v]",pos:"n",kr:"휴가",ex:"Employees can take up to 10 days annually for emergency <b>leave</b>.",exkr:"직원들은 연간 최대 10일의 청원 휴가를 낼 수 있다.",stars:3,tip:"v. 떠나다; 남기다 — The sales manager <b>left</b> for Singapore to conduct the orientation for sales staff. 영업부장은 영업 사원 오리엔테이션을 진행하기 위해 싱가포르로 떠났다. // on leave 휴가로 / leave for + 목적지 ~을 향해 떠나다 / leave A for B B에게 A를 남기다. leave는 명사, 동사로 모두 사용된다. 함께 쓰이는 전치사와 묶어서 기억해 두자.",deriv:"absence 부재, (사람이) 없음"},
  {n:10,en:"recommendation",pron:"[rèkəmendéiʃən]",pos:"n",kr:"추천 사항, 추천",ex:"Staff were asked for <b>recommendations</b> on improving the break room.",exkr:"직원들은 휴게실 개선에 대한 추천 사항을 요청받았다.",stars:3},
  {n:11,en:"conference",pron:"[미 kánfərəns / 영 kɔ́nfərəns]",pos:"n",kr:"회의, 회담",ex:"This year's <b>conference</b> focuses on developments in the field of human resources.",exkr:"올해 회의는 인적 자원 분야의 개발에 중점을 두고 있다.",stars:3},
  {n:12,en:"schedule",pron:"[미 skédʒu:l / 영 ʃédju:l]",pos:"v",kr:"~을 예정하다",ex:"Orientation is <b>scheduled</b> for the morning.",exkr:"오리엔테이션은 오전으로 예정되어 있다.",stars:3,tip:"1. be scheduled for + 시점 (언제)로 예정되어 있다 / be scheduled to do ~할 예정이다. 동사 schedule은 보통 수동형으로 전치사 for나 to부정사와 어울려 출제된다. 2. ahead of/behind + schedule 예정보다 먼저/늦게. 명사 schedule과 함께 쓰이는 전치사 ahead of, behind를 묶어서 기억해 두자.",deriv:"n. 일정, 스케줄, (가격·요금 등을) 나열한 표"},
  {n:13,en:"include",pron:"[inklú:d]",pos:"v",kr:"포함하다",ex:"The workshop curriculum <b>includes</b> special digital media classes.",exkr:"워크숍 교육 과정은 디지털 미디어 특강을 포함한다.",stars:3,tip:"include : consist — '포함하다'와 관련된 단어들의 용례 차이를 구별해 두자. include ~을 포함하다(include는 어떤 것을 한 부분으로 '포함하다'라는 뜻이며, 뒤에 바로 목적어가 온다) / consist of ~으로 구성되다(consist는 여러 부분들로 '구성되다'라는 의미이며, 전치사 of와 함께 사용한다). The company benefits package <b>consists of</b> health, dental, and vision insurance. 그 회사의 복지 제도는 건강 보험, 치과 보험, 안과 보험으로 구성된다. // 정보나 물건 등이 함께 들어있다라는 의미일 때 include는 contain으로 바꾸어 쓸 수 있다.",deriv:"inclusion n. 포함, 함유 / inclusive adj. 포괄적인 / contain 포함하다 / exclude 제외하다"},
  {n:14,en:"result",pron:"[rizʌ́lt]",pos:"n",kr:"결과",ex:"As a <b>result</b> of increased sales, the marketing team was rewarded with a vacation.",exkr:"늘어난 매출의 결과로 마케팅팀은 포상 휴가를 받았다.",stars:3,tip:"v. (~의 결과로) 되다 — Positive responses to the prototype <b>resulted</b> in more funding for it. 시제품에 대한 긍정적인 반응은 그것을 위한 더 많은 자금 지원을 야기했다. // as a result of ~의 결과로 / as a result 결과적으로 / result in + 결과 ~을 야기하다, ~로 끝나다 / result from + 원인 ~에서 유래하다. result는 관용 표현으로 자주 출제되므로 묶어서 기억해 두자."},
  {n:15,en:"register",pron:"[미 rédʒistər / 영 rédʒistə]",pos:"v",kr:"등록하다",ex:"Employees must <b>register</b> for unemployment insurance with the state government.",exkr:"직원들은 주 정부 주관의 실업 보험에 등록해야 한다.",stars:3,tip:"register for ~에 등록하다. register와 함께 쓰이는 전치사 for를 묶어서 기억해 두자.",deriv:"registration n. 등록 (= enrollment) / enroll in ~에 등록하다"},
  {n:16,en:"require",pron:"[미 rikwáiər / 영 rikwáiə]",pos:"v",kr:"요구하다",ex:"Staff are <b>required</b> to attend the insurance provider's presentation on benefits.",exkr:"직원들은 보험금에 대한 보험 회사의 발표회에 참석하도록 요구된다.",stars:3,tip:"require A to do A에게 ~하라고 요구하다 / be required to do ~하도록 요구되다 / be required for ~을 위해 요구되다 / required documents 구비 서류. 동사 require는 to부정사 또는 전치사 for와 함께 주로 사용되므로 묶어서 기억해 두자. 형용사 required는 required documents 형태로 주로 출제된다.",deriv:"requirement n. 요구 / required adj. 필수의 / call for ~을 필요로 하다 / entail 수반하다"},
  {n:17,en:"grateful",pron:"[gréitfəl]",pos:"adj",kr:"고마워하는, 감사하는",ex:"Ms. Warren was <b>grateful</b> for her recent raise in salary.",exkr:"Ms. Warren은 최근의 급여 인상에 대해 고마워했다.",stars:3},
  {n:18,en:"overtime",pron:"[미 óuvərtaim / 영 áuvətaim]",pos:"n",kr:"초과 근무, 야근",ex:"Employees are paid $20 for every hour of <b>overtime</b>.",exkr:"직원들은 초과 근무에 대해 시간당 20달러를 받는다.",stars:3,tip:"adv. 규정 시간 외에"},
  {n:19,en:"responsibility",pron:"[미 rispànsəbíləti / 영 rispɔ̀nsibíliti]",pos:"n",kr:"부담, 책임, 의무",ex:"Conference fees will be paid by Direxco, but dining expenses are the participants' <b>responsibility</b>.",exkr:"총회 참가비는 Direxco사에서 지불할 것이지만 식비는 참가자 부담입니다.",stars:3,tip:"environmental and social responsibility 환경과 사회에 대한 책임. responsibility의 토익 출제 표현을 익혀 두자.",deriv:"responsible adj. 책임 있는"},
  {n:20,en:"assent",pron:"[əsént]",pos:"v",kr:"찬성하다",ex:"The managers <b>assented</b> to giving everyone a small raise.",exkr:"관리자들은 모두에게 약간의 봉급 인상을 해 주는 것에 찬성했다.",stars:3,tip:"n. 승인, 동의 — The company's president gave her <b>assent</b> for a planned construction project. 그 회사의 사장은 계획된 건설 프로젝트를 승인했다."},
  {n:21,en:"regard",pron:"[미 rigá:rd / 영 rigá:d]",pos:"v",kr:"~을 -으로 간주하다, 여기다",ex:"Workers <b>regard</b> prompt salary payment as a basic right.",exkr:"근로자들은 신속한 임금 지급을 기본 권리로 간주한다.",stars:2,tip:"n. 관심, 배려 — The company showed little <b>regard</b> for employee welfare. 그 회사는 직원 복지에 거의 관심을 보이지 않았다. // regard A as B A를 B로 간주하다 / show little regard for ~에 대해 거의 관심을 보이지 않다 / send one's regards 안부를 전하다. regard의 토익 출제 표현을 기억해 두자.",deriv:"regarding prep. ~에 관하여 (= concerning, about) / view ~라고 여기다"},
  {n:22,en:"tentative",pron:"[téntətiv]",pos:"adj",kr:"임시적인, 잠정적인",ex:"The plan to increase paternity leave is still <b>tentative</b>.",exkr:"남성 육아 휴직을 늘리겠다는 계획은 여전히 임시적일 뿐이다.",stars:2,tip:"be tentatively scheduled for + 시점 잠정적으로 (언제)로 예정되다. tentatively는 일정이나 계획의 수립이 잠정적인 경우에 사용된다.",deriv:"tentatively adv. 잠정적으로, 임시로 / temporary 임시의 / indefinite (시간·기한 등이) 정해지지 않은"},
  {n:23,en:"welcome",pron:"[wélkəm]",pos:"adj",kr:"반가운, 기꺼이 받아들여지는",ex:"The extra microwave was a <b>welcome</b> addition to the staff kitchen.",exkr:"추가 전자레인지는 직원용 주방에서 환영받는 물건이었다.",stars:2,tip:"v. 환영하다, 맞이하다 — Audrey was <b>welcomed</b> warmly by her new colleagues on her first day at work. Audrey는 첫 출근 날 새로운 동료들로부터 따뜻하게 환영받았다. // a welcome addition to ~에 환영받는 물건/사람 / be welcome to do ~을 자유로이 할 수 있다. welcome의 토익 출제 표현을 기억해 두자.",deriv:"welcoming adj. 반갑게 맞이하는, 안락해 보이는"},
  {n:24,en:"function",pron:"[fʌ́ŋkʃən]",pos:"n",kr:"행사, 연회",ex:"The dining hall seats 100 people for private and business <b>functions</b>.",exkr:"그 식당은 개인 및 비즈니스 행사용으로 100명의 인원을 수용할 수 있다.",stars:2,tip:"v. 작동하다",deriv:"functional adj. 기능적인, 편리한 / functionality n. (상품의) 목적, 기능성"},
  {n:25,en:"commence",pron:"[kəméns]",pos:"v",kr:"시작되다",ex:"The new shifts will <b>commence</b> next week.",exkr:"새 교대 근무가 다음 주에 시작될 것이다.",stars:2,deriv:"commencement n. 시작 / begin 시작되다"},
  {n:26,en:"objective",pron:"[əbdʒéktiv]",pos:"n",kr:"목표, 목적",ex:"The learning <b>objectives</b> of the program are outlined in the brochure.",exkr:"프로그램의 학습 목표가 소책자에 요약되어 있다.",stars:2,tip:"adj. 객관적인 // object to ~에 반대하다. 동사 object와 함께 쓰이는 전치사 to를 묶어서 외워두자. // objective 목적 / objection 반대 / objectivity 객관성 — 어근이 같지만 뜻이 다른 단어들의 의미 차이를 구별하는 문제로 출제된다.",deriv:"object v. 반대하다, n. 대상; 물건 / objection n. 이의, 반대 / objectivity n. 객관성 / purpose 목적"},
  {n:27,en:"excited",pron:"[iksáitid]",pos:"adj",kr:"신이 난, 들뜬",ex:"Fred was <b>excited</b> about the opportunities his promotion would give him.",exkr:"Fred는 자신의 승진으로 제공받을 기회들에 신이 났다.",stars:2,deriv:"excite v. 흥분시키다 / exciting adj. 신나는, 흥미진진한"},

  {n:6,en:"exceptional",pron:"[iksépʃənl]",pos:"adj",kr:"뛰어난, 예외적인",ex:"Paul Lang showed <b>exceptional</b> talent in computer programming.",exkr:"Paul Lang은 컴퓨터 프로그래밍에 뛰어난 재능을 보였다.",stars:1,tip:"exceptional(adj. 매우 뛰어난)과 exceptionally(adv. 유난히)의 품사 구별하기.",deriv:"exceptionally adv. 유난히 / remarkable 뛰어난"},
  {n:7,en:"appreciation",pron:"[əprìːʃiéiʃən]",pos:"n",kr:"감사",ex:"The director gave a short speech to express his <b>appreciation</b>.",exkr:"그 이사는 감사를 표하기 위해 짧은 연설을 했다.",stars:2,deriv:"appreciate v. 감사하다"},
  {n:8,en:"evaluate",pron:"[ivǽljuèit]",pos:"v",kr:"평가하다",ex:"Workers' performance should be <b>evaluated</b> annually.",exkr:"직원들의 실적은 매년 평가되어야 한다.",stars:3,deriv:"evaluation n. 평가 / judge 판단하다, 평가하다"},
  {n:9,en:"suggest",pron:"[미 səgdʒést / 영 sədʒést]",pos:"v",kr:"제안하다, 추천하다",ex:"Charles <b>suggested</b> posting a job advertisement.",exkr:"Charles는 채용 광고를 올리는 것을 제안했다.",stars:3},
  {n:10,en:"preference",pron:"[préfərəns]",pos:"n",kr:"선호",ex:"Rita has no <b>preference</b> for working the night shift or the day shift.",exkr:"Rita는 야간 근무나 주간 근무 중 선호하는 것이 없다.",stars:3,tip:"meal preference 선호하는 메뉴. meal preference는 비행기나 연회 등에서 제공되는 메뉴 중 개인이 선호하는 것을 표시하는 양식 등에서 자주 사용된다."},
  {n:11,en:"management",pron:"[mǽnidʒmənt]",pos:"n",kr:"경영진, 경영",ex:"<b>Management</b> announced a new hiring plan this month.",exkr:"경영진은 이번 달에 새로운 고용 계획을 발표했다.",stars:3},
  {n:12,en:"predict",pron:"[pridíkt]",pos:"v",kr:"예측하다",ex:"Many <b>predict</b> that the CEO will retire soon.",exkr:"많은 사람들이 최고 경영자가 곧 은퇴할 것으로 예측한다.",stars:3,deriv:"prediction n. 예언"},
  {n:13,en:"transfer",pron:"[미 trænsfə́:r / 영 trænsfə́:]",pos:"v",kr:"보내다; 전근시키다",ex:"The technology department will <b>transfer</b> the old files to the new server.",exkr:"기술 부서는 오래된 파일들을 새 서버로 보낼 것이다.",stars:3,tip:"The administrator has been <b>transferred</b> to England. 그 관리자는 영국으로 전근되었다. // n. 전근, 이전 [미 trǽnsfər / 영 trǽnsfə]. // transfer A to B A를 B로 보내다, A를 B로 전근시키다. transfer와 함께 쓰이는 전치사 to를 묶어서 기억해 두자.",deriv:"move 옮기다"},
  {n:14,en:"award",pron:"[미 əwɔ́:rd / 영 əwɔ́:d]",pos:"n",kr:"상",ex:"The best-employee <b>award</b> is given every year.",exkr:"최고 직원상은 매년 수여된다.",stars:3,tip:"v. (상 등을) 수여하다 — The company <b>awards</b> a prize to the most dedicated employee. 그 회사는 가장 헌신적인 직원에게 상을 수여한다."},
  {n:15,en:"mandatory",pron:"[미 mǽndətɔ̀:ri / 영 mǽndətəri]",pos:"adj",kr:"의무적인",ex:"Attendance to the weekly staff meeting is <b>mandatory</b>.",exkr:"주간 직원회의 출석은 의무적이다.",stars:3},
  {n:16,en:"competent",pron:"[미 kámpətənt / 영 kɔ́mpitənt]",pos:"adj",kr:"유능한, 능숙한",ex:"Eileen is very <b>competent</b> at her job and is well-liked by her staff.",exkr:"Eileen은 일에 있어서 매우 유능하고 그녀의 직원들에게 매우 사랑받는다.",stars:3},
  {n:17,en:"performance",pron:"[미 pərfɔ́:rməns / 영 pəfɔ́:məns]",pos:"n",kr:"실적, 성과; 공연, 연주, 연기",ex:"The CEO attributed the company's outstanding <b>performance</b> to the staff.",exkr:"최고 경영자는 회사의 뛰어난 실적을 직원 덕분으로 돌렸다.",stars:3,tip:"The director's welcoming ceremony included a <b>performance</b> by a string quartet. 이사 환영식은 현악 4중주단의 공연을 포함했다. // performance review 실적 평가, 인사 고과 / performance evaluation 실적 평가, 성능 평가. performance는 평가를 의미하는 명사와 함께 복합 명사로 시험에 자주 출제된다. // performance 실적, 공연 ↔ performer 연주자. 추상 명사 performance와 사람 명사 performer를 구별하는 문제로 출제된다.",deriv:"perform v. ~을 수행하다, 공연하다 / performer n. 연주자 / execution n. 연주, 연기"},
  {n:18,en:"reward",pron:"[미 riwɔ́:rd / 영 riwɔ́:d]",pos:"v",kr:"~에 보답하다, 보상하다",ex:"Management plans to <b>reward</b> employees' efforts with wage increases.",exkr:"경영진은 임금 인상으로 직원들의 노력에 보답할 계획이다.",stars:3,tip:"n. 포상, 보상 — He was given the job as a <b>reward</b> for meeting his sales quota. 판매 할당량을 달성한 것에 대한 포상으로 그에게 그 업무가 주어졌다.",deriv:"rewarding adj. 가치가 있는, 보답받는"},
  {n:19,en:"search",pron:"[미 sə:rtʃ / 영 sə:tʃ]",pos:"n",kr:"찾기, 수색, 조사",ex:"We have been in <b>search</b> of a new president ever since Mr. Rowles resigned.",exkr:"우리는 Mr. Rowles가 사임한 후로 계속해서 새 회장을 찾고 있다.",stars:3,tip:"v. 찾다"},
  {n:20,en:"inexperienced",pron:"[ìnikspíəriənst]",pos:"adj",kr:"경험 없는, 미숙한",ex:"Robert is too <b>inexperienced</b> to be promoted to manager.",exkr:"Robert는 부장으로 승진되기에 너무 경험이 없다.",stars:3},
  {n:21,en:"early",pron:"[미 ə́:rli / 영 ə́:li]",pos:"adj",kr:"시간상 이른, 조기의",ex:"Ms. Jones opted for an <b>early</b> retirement.",exkr:"Ms. Jones는 조기 퇴직을 선택했다.",stars:3,tip:"adv. 일찍 // early : previous — '시간상으로 앞선'을 뜻하는 단어들의 용례 차이를 구별하는 문제로 출제된다. early 시간상 이른(시간상으로 보통보다 이르다는 의미이다) / previous 이전의(지금보다 이전에 발생한 사건 등을 말할 때 사용한다). Her <b>previous</b> post was sales manager. 그녀의 이전 직책은 영업부장이었다.",deriv:"late 늦은"},
  {n:22,en:"designate",pron:"[dézignèit]",pos:"v",kr:"지명하다, 지정하다",ex:"Ms. Carling <b>designated</b> Owen to be the project's team leader.",exkr:"Ms. Carling은 Owen을 그 프로젝트의 팀장으로 지명했다.",stars:2,deriv:"designation n. 지명, 지정"},
  {n:23,en:"executive",pron:"[igzékjutiv]",pos:"adj",kr:"경영의, 관리의",ex:"Mr. Fulton holds an <b>executive</b> position at Greenway Bank.",exkr:"Mr. Fulton은 Greenway 은행에서 경영직을 맡고 있다.",stars:2},
  {n:24,en:"dedication",pron:"[dèdikéiʃən]",pos:"n",kr:"헌신",ex:"Ms. Hayes was recognized for her <b>dedication</b> to the company.",exkr:"Ms. Hayes는 회사에 대한 헌신으로 인정받았다.",stars:2,tip:"dedication to ~에 대한 헌신. dedication과 함께 쓰이는 전치사 to를 묶어서 기억해 두자.",deriv:"dedicate v. ~에 전념하다 / dedicated adj. 헌신적인, 전념하는"},
  {n:25,en:"unanimously",pron:"[미  juːnǽnəməsli / 영 juːnǽniməsli]",pos:"adv",kr:"만장일치로",ex:"The board voted <b>unanimously</b> to replace the underperforming CEO.",exkr:"이사회는 실적이 저조한 최고 경영자를 교체하는 데 만장일치로 찬성했다.",stars:2},
  {n:26,en:"progress",pron:"[미 prágres / 영 práugres]",pos:"n",kr:"진행, 진척, 진전",ex:"Daily reports are good tools for measuring employees' work <b>progress</b>.",exkr:"일일 보고서는 직원의 업무 진행 상황을 측정하는 데 좋은 도구이다.",stars:2,tip:"v. 진행되다, 진척시키다 [prəgrés]",deriv:"progressive adj. 전진하는"},
  {n:27,en:"congratulate",pron:"[미 kəngrǽtʃulèit / 영 kəngrǽtjuleit]",pos:"v",kr:"축하하다",ex:"The president personally <b>congratulated</b> the assistant on her promotion.",exkr:"그 사장은 보좌관의 승진을 직접 축하해 주었다.",stars:2,tip:"congratulate A on B A에게 B에 대해 축하하다. congratulate와 함께 쓰이는 전치사 on이 문제로 출제된다.",deriv:"congratulation n. 축하"},
  {n:28,en:"dismiss",pron:"[dismís]",pos:"v",kr:"해임하다, 해고하다",ex:"Those staff found in violation of company regulations may be <b>dismissed</b>.",exkr:"회사 규정을 위반한 것으로 확인된 직원들은 해임될 수도 있다.",stars:2,deriv:"dismissal n. 해고"},
  {n:29,en:"independence",pron:"[ìndipéndəns]",pos:"n",kr:"독립성",ex:"Branch managers are given the <b>independence</b> to make some decisions.",exkr:"지점장들은 일부 결정을 내릴 수 있도록 독립성을 부여받았다.",stars:2},
  {n:30,en:"participation",pron:"[미 pɑːrtìsəpéiʃən / 영 pɑːtìsipéiʃən]",pos:"n",kr:"참여, 참가, 가입",ex:"Workers gained valuable knowledge through <b>participation</b> in the program.",exkr:"직원들은 프로그램 참여를 통해 귀중한 지식을 얻었다.",stars:2,tip:"participation 참여 ↔ participant 참가자. 추상 명사인 participation과 사람 명사인 participant를 구별하는 문제로 출제된다.",deriv:"participate v. 참여하다 / participant n. 참가자 / involvement 참여"},
  {n:31,en:"praise",pron:"[preiz]",pos:"n",kr:"칭찬",ex:"Stacey Randall received <b>praise</b> for her outstanding sales record.",exkr:"Stacey Randall은 뛰어난 판매 실적으로 칭찬을 받았다.",stars:2,tip:"v. 칭찬하다",deriv:"compliment 칭찬"},
  {n:32,en:"accomplishment",pron:"[미 əkámpliʃmənt / 영 əkʌ́mpliʃmənt]",pos:"n",kr:"성과, 업적",ex:"The team was given a bonus for its <b>accomplishments</b> last quarter.",exkr:"그 팀은 지난 분기 성과에 대한 상여금을 받았다.",stars:2},
  {n:33,en:"deliberation",pron:"[dilìbəréiʃən]",pos:"n",kr:"토의, 심의",ex:"The <b>deliberation</b> about hiring new staff lasted for nearly two hours.",exkr:"새로운 직원들을 고용하는 것에 대한 토의는 거의 두 시간 동안 지속되었다.",stars:2},
  {n:34,en:"leadership",pron:"[미 líːdərʃìp / 영 líːdəʃip]",pos:"n",kr:"리더십, 지도력",ex:"Ms. Robinson's display of <b>leadership</b> has earned her the respect of her staff.",exkr:"Ms. Robinson이 발휘한 리더십은 그녀에게 직원들의 존경심을 가져다주었다.",stars:2},
  {n:35,en:"retire",pron:"[미 ritáiər / 영 ritáiə]",pos:"v",kr:"퇴직하다, 은퇴하다",ex:"Peter Oswald <b>retires</b> in May after 40 years with the firm.",exkr:"Peter Oswald는 그 회사에 40년 근무한 끝에 5월에 퇴직한다.",stars:2,deriv:"retirement n. 퇴직, 은퇴"},
  {n:36,en:"nomination",pron:"[미 nàmənéiʃən / 영 nɔ̀minéiʃən]",pos:"n",kr:"임명, 지명",ex:"Sue Blaine's <b>nomination</b> to the board was a surprise.",exkr:"Sue Blaine이 이사회에 임명된 것은 놀라운 일이었다.",stars:2,tip:"사람을 직책에 임명하다라는 문맥일 때 nomination은 appointment로 바꾸어 쓸 수 있다.",deriv:"nominate v. 지명하다 / nominee n. 지명된 사람 / appointment 임명"},
  {n:37,en:"reorganize",pron:"[미 riːɔ́:rgənaiz / 영 riːɔ́:gənaiz]",pos:"v",kr:"재편성하다, 재조직하다",ex:"The marketing team will be <b>reorganized</b> after the merger.",exkr:"마케팅팀은 합병 이후에 재편성될 것이다.",stars:2,deriv:"reorganization n. 재편성 (= restructuring)"},
  {n:38,en:"serve",pron:"[미 sə́:rv / 영 sə́:v]",pos:"v",kr:"일하다, 근무하다",ex:"The marketing director will <b>serve</b> as the acting director of consumer relations for now.",exkr:"마케팅부장이 당분간 고객 서비스 부장 대행으로서 일할 것이다.",stars:1,tip:"serve as ~로서 일하다. 전치사 as를 선택하는 문제로 출제된다.",deriv:"service n. 봉사, 서비스 / act 역할을 하다"},
  {n:39,en:"encouragement",pron:"[미 inkə́:ridʒmənt / 영 inkʌ́ridʒmənt]",pos:"n",kr:"격려",ex:"Mr. Vance offers regular <b>encouragement</b> to his employees.",exkr:"Mr. Vance는 직원들에게 주기적으로 격려를 해 준다.",stars:1,deriv:"encourage v. 격려하다 / encouraging adj. 힘을 북돋아주는"},
  {n:40,en:"resignation",pron:"[rèzignéiʃən]",pos:"n",kr:"사임, 사직, 사직서",ex:"The company announced the <b>resignation</b> of its head of development.",exkr:"회사는 개발부장의 사임을 발표했다.",stars:1,deriv:"resign v. 사임하다 (= step down)"},
  {n:41,en:"strictly",pron:"[stríktli]",pos:"adv",kr:"엄격히",ex:"International transfer opportunities are <b>strictly</b> limited.",exkr:"해외 전근 기회는 엄격히 제한된다.",stars:1,tip:"strictly + limited/prohibited 엄격히 제한된/금지된. strictly는 limit, prohibit 등 제한을 의미하는 동사와 주로 사용된다.",deriv:"strict adj. 엄격한 / severely, sternly 심하게, 엄하게"},

  {n:7,en:"permit",pron:"[v. 미 pərmít / 영 pəmít] [n. 미 pə́:rmit / 영 pə́:mit]",pos:"v",kr:"허락하다",ex:"The store <b>permits</b> only shoppers to park in the lot.",exkr:"그 상점은 오직 쇼핑객들만 주차장에 주차하도록 허락한다.",stars:3,tip:"n. 허가증 — Residents must purchase a parking <b>permit</b> every year. 거주자들은 매년 주차 허가증을 구입해야 한다. // permit : permission — '허가'와 관련된 단어들의 뜻 차이를 구별하는 문제로 출제된다. permit 허가증(허가하는 사실을 표시한 증서를 의미한다) / permission 허가(청하거나 바라는 바를 들어주는 것을 뜻한다). The pilot requested <b>permission</b> for the aircraft to land. 기장은 항공기 착륙 허가를 요청했다. // '허락하다'라는 의미의 permit은 allow로 바꾸어 쓸 수 있다.",deriv:"permission n. 허락 / permissive adj. 허가하는 / permissibly adv. 허용되어, 무방하여 / allow 허락하다 / forbid, prohibit 금하다"},

  {n:9,en:"opportunity",pron:"[미 àpərtjúːnəti / 영 ɔ̀pətjúːnəti]",pos:"n",kr:"기회",ex:"The bus tour provides visitors an <b>opportunity</b> to explore the city in one day.",exkr:"버스 투어는 방문객들에게 하루 만에 도시를 둘러볼 기회를 제공한다.",stars:3,tip:"opportunity to do ~할 기회. opportunity는 to 부정사와 함께 자주 시험에 출제된다."},
  {n:10,en:"clearly",pron:"[미 klíərli / 영 klíəli]",pos:"adv",kr:"명확히",ex:"The reporter's use of animated graphics <b>clearly</b> showed the flow of traffic during rush hour.",exkr:"그 기자의 동영상 그래픽 사용은 출퇴근 시간의 교통 흐름을 명확히 보여주었다.",stars:3,tip:"be clearly displayed 명확히 제시되다 / speak clearly 명확하게 말하다. clearly는 display, speak 등의 동사들과 자주 어울려 출제된다. // clearly 명확히, 분명하게 ↔ clear 완전히; 멀리 떨어져서. 어근과 품사가 같지만 용례가 다른 두 단어를 구별하는 문제로 출제된다. clearly는 말이나 설명이 명확하거나 분명하여 이해하기 쉬운 경우에 사용한다. clear는 부사로 쓰일 때 무엇이 '완전하게, 또렷하게' 보이는 것 또는 '멀리 떨어져서' 있는 것을 의미하고, 주로 자동사 뒤에 쓰인다. When the weather is good, you can see <b>clear</b> across the lake from one side to the other. 날씨가 좋을 때, 한쪽에서 건너편으로 호수를 가로질러 완전히 볼 수 있다.",deriv:"clear adj. 명백한, 명확한 adv. 완전히, 또렷하게; 멀리 떨어져서 / evidently 분명히, 명백히"},
  {n:11,en:"ongoing",pron:"[미 ángòuiŋ / 영 ɔ́ngòuiŋ]",pos:"adj",kr:"계속 진행 중인",ex:"<b>Ongoing</b> roadwork is causing delays through the city center.",exkr:"계속 진행 중인 도로 공사가 도심 여기저기에 지체를 일으키고 있다.",stars:3},

  {n:24,en:"official",pron:"[əfíʃəl]",pos:"n",kr:"공무원, 관리",ex:"Transportation <b>officials</b> announced plans to construct a city bypass.",exkr:"교통부 공무원은 도시 우회로 건설 계획을 발표했다.",stars:2,tip:"adj. 공식적인 — The <b>official</b> report showed that automobile accidents have recently increased. 그 공식 보고서는 최근에 자동차 사고가 증가하고 있음을 나타냈다.",deriv:"officially adv. 공식적으로 / formal 공식적인"},
  {n:25,en:"transit",pron:"[미 trǽnsit / 영 trǽnzit]",pos:"n",kr:"교통, 수송",ex:"The travel card can be used for all public <b>transit</b>.",exkr:"그 교통 카드는 모든 대중교통에 이용할 수 있습니다.",stars:2,tip:"public transit 대중교통 / in transit 수송 중, 이동 중. transit은 '교통'이란 의미로 많이 알고 있지만 토익에서는 '수송', '이동'이란 뜻으로도 자주 출제된다."},
  {n:26,en:"fare",pron:"[미 fɛər / 영 feə]",pos:"n",kr:"교통 요금",ex:"Bus <b>fares</b> increased in line with gasoline prices.",exkr:"버스 요금이 휘발유 가격에 맞추어 인상되었다.",stars:2,tip:"fare : fee : toll — '요금'을 뜻하는 단어들의 용례 차이를 구별하는 문제로 출제된다. fare 교통 요금(버스, 기차, 배 등의 교통수단 이용 요금을 뜻한다) / fee 각종 수수료, 무형의 봉사에 대한 요금(입장료, 수업료 등의 각종 수수료에 사용한다). The parking lot's entry <b>fee</b> is higher on weekends. 주차장 입장료는 주말에 더 비싸다. / toll 통행료(도로나 다리를 이용할 때 지불하는 요금을 의미한다). The transit department voted to double the <b>toll</b> for the bridge. 교통부는 다리 통행료를 두 배 인상하기로 표결했다."},
  {n:27,en:"expense",pron:"[ikspéns]",pos:"n",kr:"비용, 지출",ex:"Residents agreed that the new highway was worth the <b>expense</b>.",exkr:"주민들은 새로운 고속도로가 비용을 들인 만큼 가치 있다는 데 동의했다.",stars:2,tip:"Illegally parked vehicles will be removed at the owner's <b>expense</b>. 불법 주차 차량은 소유주 부담으로 견인될 것입니다. // at one's expense ~의 부담으로, ~의 비용으로 / travel expenses 여행 경비 / expense receipts 지출영수증 / outstanding expenses 미결제 비용. expense의 토익 출제 표현을 알아 두자.",deriv:"expensive adj. 값비싼 / charge, cost 비용 / expenditure 지출"},
  {n:28,en:"trust",pron:"[trʌst]",pos:"n",kr:"신뢰, 신임",ex:"Car owners who earn the <b>trust</b> of insurers are eligible for discounts.",exkr:"보험 회사의 신뢰를 얻은 차주들은 할인 혜택을 받을 자격이 있다.",stars:2,tip:"v. 믿다, 신뢰하다 — Drivers <b>trust</b> that the police will keep roadways safe. 운전자들은 경찰이 도로를 안전하게 유지할 것이라고 믿는다.",deriv:"trusting adj. (사람을) 의심하지 않는, 잘 믿는 / trustful adj. 믿음직하게 여기는 / trustworthy adj. 믿을 수 있는"},
  {n:29,en:"head",pron:"[hed]",pos:"v",kr:"(~의 방향으로) 나아가다, 향하게 하다",ex:"The motorcyclists <b>headed</b> west toward the mountains.",exkr:"오토바이 운전자들은 산을 향해 서쪽으로 나아갔다.",stars:2},
  {n:30,en:"drive",pron:"[draiv]",pos:"v",kr:"(차 등을) 운전하다, 타고 가다, 조종하다",ex:"Vehicles with multiple passengers are allowed to <b>drive</b> in the carpool lane.",exkr:"다수의 탑승자가 있는 차량은 다인승 전용 차선에서 운전하는 것이 허용된다.",stars:2},
  {n:31,en:"fine",pron:"[fain]",pos:"n",kr:"벌금",ex:"Drivers speeding in a school zone are subject to a substantial <b>fine</b>.",exkr:"어린이 보호 구역에서 과속하는 운전자들에게는 상당한 벌금이 부과된다.",stars:2,tip:"v. ~에게 벌금을 과하다 / adj. 훌륭한; 맑은 // fine : tariff : price : charge — '비용'을 의미하는 단어들의 용례 차이를 구별하는 문제로 출제된다. fine 벌금(법을 어겼을 때 부과되는 요금이다) / tariff 관세(세관을 통과하는 상품에 대해 부과하는 세금을 뜻한다). The government reduced <b>tariffs</b> on imported vehicles by 25 percent. 정부는 수입 자동차 관세를 25퍼센트 인하했다. / price 가격(물건을 살 때 지불하는 비용을 의미한다). The yacht's retail <b>price</b> is set at $1 million. 그 요트의 소매가격은 백만 달러로 매겨졌다. / charge 요금, 수수료(특정 서비스의 대가로 지불하는 비용을 뜻한다). The guest asked about a mistaken <b>charge</b> for car maintenance. 그 손님은 자동차 정비 비용 오류에 대해 문의했다.",deriv:"penalty, forfeit 벌금"},
  {n:32,en:"pass",pron:"[미 pæs / 영 pɑːs]",pos:"v",kr:"지나가다, 통과하다",ex:"For safety reasons, motorists should not <b>pass</b> other cars on the right.",exkr:"안전상의 이유로, 자동차 운전자들은 다른 차량의 오른쪽으로 지나가면 안 된다.",stars:2,deriv:"passable adj. 쓸 만한, 통행할 수 있는 / passage n. 통로, 통행"},
  {n:33,en:"securely",pron:"[미 sikjúərli / 영 sikjúəli]",pos:"adv",kr:"(매듭 등이) 단단하게, 튼튼하게",ex:"Passengers are required to fasten seatbelts <b>securely</b>.",exkr:"승객들은 안전벨트를 단단히 고정시켜야 한다.",stars:1,tip:"securely + fastened/attached/anchored 단단하게 조여진/부착된/정박된. securely는 사물이 안정적으로 연결되어 있을 때 사용하며 fasten, attach 등의 동사를 주로 수식한다.",deriv:"secure adj. 안전한 / security n. 안전, 안심 / insecurely 불안하게, 위태롭게"},
  {n:34,en:"prominently",pron:"[미 prámənəntli / 영 prɔ́minəntli]",pos:"adv",kr:"눈에 잘 띄게, 두드러지게",ex:"Traffic control signs are <b>prominently</b> displayed along the highway.",exkr:"교통 표지판이 고속도로를 따라 눈에 잘 띄게 설치되어 있다.",stars:1,tip:"prominently : markedly : explicitly — '뚜렷하다'와 관련된 단어들의 용례 차이를 구별하는 문제로 출제된다. prominently 눈에 잘 띄게, 두드러지게(표시 등이 눈에 잘 보인다는 뜻이다) / markedly 현저하게, 두드러지게(변화나 차이가 눈에 띄게 드러날 때 사용된다). The traffic conditions were <b>markedly</b> better after the roadwork was completed. 도로 공사가 완료된 후에 교통 상황은 현저하게 좋아졌다. / explicitly 명백히, 명시적으로(의도나 목적이 모호하지 않고 분명함을 의미한다). The government <b>explicitly</b> forbids unauthorized importation of automotive parts. 정부는 인가 받지 않은 자동차 부품 수입을 명백히 금지한다.",deriv:"prominent adj. 현저한 / noticeably 두드러지게"},
  {n:35,en:"reserved",pron:"[미 rizə́:rvd / 영 rizə́:vd]",pos:"adj",kr:"예약된, 예약한; 지정된",ex:"The rail service allows passengers to book <b>reserved</b> seats online.",exkr:"철도청은 승객들이 온라인으로 좌석을 예약할 수 있게 한다.",stars:1,tip:"<b>Reserved</b> parking for tenants is available at the rear of the building. 거주자들을 위한 지정 주차 공간은 건물 뒤쪽에서 이용 가능하다. // reserved parking 지정 주차. '지정된'이라는 의미로 사용될 때 자주 출제되는 표현을 알아 두자. // reserved : preserved — '보존된'을 뜻하는 단어들의 용례 차이를 구별하는 문제로 출제된다. reserved 예약된(특정 목적을 위해 미리 예약을 해 놓을 때 쓰인다) / preserved 보존된(오염이나 파괴되는 것을 막아서 그 상태를 손상되지 않게 유지함을 뜻한다). Many tourists are attracted to Stewart Island's <b>preserved</b> wildlife habitat. 수많은 관광객들이 Stewart 섬의 보존된 야생 동물 서식지로 몰려온다.",deriv:"reserve v. 예약하다 / reservation n. 예약"},
  {n:36,en:"average",pron:"[ǽvəridʒ]",pos:"n",kr:"평균치, 평균",ex:"Compared to last year's <b>average</b>, road accidents have significantly decreased.",exkr:"작년 평균치와 비교해 볼 때, 교통사고가 현저하게 감소했다.",stars:1,tip:"adj. 평균의"},
  {n:37,en:"collision",pron:"[미 kəlíʒən / 영 kəlíʒən]",pos:"n",kr:"충돌",ex:"Fortunately, no one was hurt in the four-car <b>collision</b>.",exkr:"다행스럽게도, 4중 차량 충돌 사고에서 아무도 다치지 않았다.",stars:1},
  {n:38,en:"tow",pron:"[미 tou / 영 təu]",pos:"v",kr:"(차를) 견인하다",ex:"All unauthorized vehicles will be <b>towed</b>.",exkr:"허가되지 않은 모든 차량은 견인될 것입니다.",stars:1},
  {n:39,en:"reverse",pron:"[미 rivə́:rs / 영 rivə́:s]",pos:"adj",kr:"뒤의, 반대의",ex:"Jim accidentally put the truck into <b>reverse</b> gear.",exkr:"Jim은 실수로 트럭을 후진 기어에 놓았다.",stars:1,tip:"n. 반대, 뒷면 / v. 반대로 하다; 번복하다"},
  {n:40,en:"obstruct",pron:"[əbstrʌ́kt]",pos:"v",kr:"(전망 등을) 가리다, 차단하다; (도로 등을) 막다",ex:"Passengers must not <b>obstruct</b> the driver's view.",exkr:"승객들은 운전자의 시야를 가리지 말아야 한다.",stars:1,tip:"The road was <b>obstructed</b> by a fallen tree. 그 도로는 쓰러진 나무에 의해 막혔다. // 장애물로 인해 시야나 길이 막히다라는 문맥에서 obstruct는 block으로 바꾸어 쓸 수 있다.",deriv:"obstruction n. 방해, 방해물 / obstructive adj. 방해하는 / block 막다"},

  {n:8,en:"on behalf of",pron:"",pos:"phr",kr:"~을 대신해서",ex:"The broker received authorization to sell shares <b>on behalf of</b> his client.",exkr:"그 중개인은 고객을 대신해 주식을 매각할 수 있는 권한을 받았다.",stars:3},
  {n:9,en:"lease",pron:"[liːs]",pos:"n",kr:"임대차 (계약)",ex:"Investors agreed to a 25-year <b>lease</b> on the office building.",exkr:"투자자들은 사무실 건물에 대한 25년 임대차 계약에 동의했다.",stars:3,tip:"v. 임대하다, 임차하다"},
  {n:10,en:"sponsor",pron:"[미 spánsər / 영 spónsə]",pos:"v",kr:"후원하다",ex:"Reed Bank <b>sponsored</b> a series of financial seminars.",exkr:"Reed 은행은 일련의 재무 세미나를 후원했다.",stars:3,tip:"n. 후원자 — The organizer kindly thanked the <b>sponsors</b> of the event. 주최자는 행사의 후원자들에게 진심으로 감사를 표했다.",deriv:"sponsorship n. 후원, 협찬"},
  {n:11,en:"propose",pron:"[미 prəpóuz / 영 prəpə́uz]",pos:"v",kr:"제안하다",ex:"Gould Capital <b>proposed</b> to fund Ms. Locke's venture.",exkr:"Gould Capital사는 Ms. Locke의 벤처 사업에 자금을 대는 것을 제안했다.",stars:3},
  {n:12,en:"support",pron:"[미 səpɔ́ːrt / 영 səpɔ́ːt]",pos:"n",kr:"후원, 원조, 지지",ex:"The small business owner is seeking the <b>support</b> of investors.",exkr:"그 소규모 사업주는 투자자의 후원을 구하고 있다.",stars:3,tip:"v. 지원하다, 후원하다; 살게 하다, (생명·기력 등을) 유지하다 — The museum is <b>supported</b> financially by several local companies. 그 박물관은 몇몇 지역 사업체들로부터 재정적으로 지원받는다. // Wildlife reserves <b>support</b> many different species of animals. 야생동물 보호구역은 여러 다양한 동물 종을 살게 한다. // for one's continued support ~의 지속적인 성원에 대해. support는 for one's continued support 형태로 지속적인 거래나 이용에 감사를 표하는 문맥으로 자주 출제된다.",deriv:"supporter n. 팬, 지지자, 후원자 / supportive adj. 도와주는, 힘을 주는 / aid n. 원조, 도움; v. 돕다 / oppose 반대하다"},
  {n:13,en:"distribution",pron:"[미 dìstrəbjúːʃən / 영 dìstribjúːʃən]",pos:"n",kr:"분배, 배급",ex:"The <b>distribution</b> of profits will be announced to shareholders next week.",exkr:"수익 분배는 다음 주에 주주들에게 공표될 것이다.",stars:3},
  {n:14,en:"consider",pron:"[미 kənsídər / 영 kənsídə]",pos:"v",kr:"고려하다",ex:"Before buying a property, it's important to <b>consider</b> the hidden expenses involved.",exkr:"부동산을 매입하기 전에 관련된 잠재 비용을 고려하는 것이 중요하다.",stars:3,deriv:"considerate adj. 신중한 / consideration n. 고려"},
  {n:15,en:"nearly",pron:"[미 níərli / 영 níəli]",pos:"adv",kr:"거의, 대략",ex:"The firm was operated so well that investors <b>nearly</b> doubled their money.",exkr:"회사가 매우 잘 운영되어서 투자자들은 투자금을 거의 두 배로 만들었다.",stars:3,tip:"nearly + 수치 거의 ~인. nearly는 수치를 나타내는 표현과 어울려 시험에 자주 출제된다. 형태가 비슷하지만 뜻이 다른 near(가까이, 가까운)와 혼동하지 않도록 주의하자.",deriv:"near adv. 가까이 adj. 가까운 / almost 거의"},
  {n:16,en:"consent",pron:"[kənsént]",pos:"n",kr:"동의, 허락",ex:"A sale of the business will require the <b>consent</b> of shareholders.",exkr:"사업체의 매각은 주주들의 동의를 필요로 한다.",stars:3,tip:"v. 동의하다 // consent of ~의 동의. consent와 함께 쓰이는 전치사 of를 묶어서 기억해 두자. // 허가의 의미로 사용되는 consent는 approval이나 permission으로 바꾸어 쓸 수 있다.",deriv:"approval, permission 승인, 허락 / dissent, objection 이의, 반대"},
  {n:17,en:"gratitude",pron:"[미 ɡrǽtətjùːd / 영 ɡrǽtitjuːd]",pos:"n",kr:"고마움, 감사",ex:"The CEO showed his <b>gratitude</b> to those who have stayed with the company from the beginning.",exkr:"최고 경영자는 초창기부터 회사에 있었던 사람들에게 그의 고마움을 표했다.",stars:3},
  {n:18,en:"consult",pron:"[kənsʌ́lt]",pos:"v",kr:"상의하다, 상담하다",ex:"Unsure about whether to invest, Jacob <b>consulted</b> with his financial advisor.",exkr:"투자할지 확실하지 않았기 때문에, Jacob은 자신의 재정 고문과 상의했다.",stars:2,tip:"consult the manual 설명서를 참조하다. consult는 '상의하다', '상담하다'라는 뜻으로 많이 알고 있지만 '참조하다', '참고하다'라는 뜻으로도 토익에 나오므로 함께 외워 두자."},
  {n:19,en:"advice",pron:"[ədváis]",pos:"n",kr:"조언, 충고",ex:"The bank provides its clients with <b>advice</b> on how to save more money.",exkr:"그 은행은 고객들에게 더 많은 돈을 저축할 수 있는 방법에 대한 조언을 제공한다.",stars:2,deriv:"advise v. 조언하다"},
  {n:20,en:"partially",pron:"[미 pɑ́ːrʃəli / 영 pɑ́ːʃəli]",pos:"adv",kr:"부분적으로, 일부분은",ex:"Indigo Inc. will be <b>partially</b> funded by the sale of bonds.",exkr:"Indigo사는 채권의 매각을 통해 부분적으로 자금이 제공될 것이다.",stars:2},
  {n:21,en:"evident",pron:"[미 évədənt / 영 évidənt]",pos:"adj",kr:"분명한, 명백한",ex:"The executives of Panta Ltd. are pleased at the <b>evident</b> interest shown in their public offering.",exkr:"Panta사의 임원들은 회사 주식 공모에 보여진 분명한 관심에 기뻐했다.",stars:2},
  {n:22,en:"reliability",pron:"[미 rilàiəbíləti / 영 rilàiəbíliti]",pos:"n",kr:"신뢰도, 믿음직함",ex:"KTR's success is dependent on the <b>reliability</b> of its financial research analysis.",exkr:"KTR사의 성공은 회사의 재무 연구 분석에 대한 신뢰도에 달려 있다.",stars:2},
  {n:23,en:"cautious",pron:"[kɔ́ːʃəs]",pos:"adj",kr:"조심하는, 신중한",ex:"Analysts are <b>cautious</b> about recommending the troubled company's stocks.",exkr:"분석가들은 문제가 많은 회사의 주식을 추천하는 것에 대해 조심한다.",stars:2,tip:"cautiously optimistic 조심스럽게 낙관하는 / reenter the market cautiously 조심스럽게 시장에 재진출하다. cautiously는 cautiously optimistic 형태로 시험에 많이 출제된다.",deriv:"cautiously adv. 조심스럽게 / caution n. 조심, 주의 / careless 부주의한"},
  {n:24,en:"insight",pron:"[ínsàit]",pos:"n",kr:"식견, 통찰력",ex:"The feature article on Dunbar offered valuable <b>insight</b> into the company's operations.",exkr:"Dunbar사에 대한 특집 기사는 그 회사 경영에 대한 귀중한 식견을 제공했다.",stars:2},
  {n:25,en:"portfolio",pron:"[미 pɔːrtfóuliòu / 영 pɔ̀ːtfóuliəu]",pos:"n",kr:"포트폴리오, 투자 자산 구성",ex:"The advisor suggested that his client diversify her <b>portfolio</b>.",exkr:"그 고문은 그의 고객에게 포트폴리오를 다양화해야 한다고 제안했다.",stars:2},
  {n:26,en:"possible",pron:"[미 pásəbl / 영 pósəbl]",pos:"adj",kr:"가능한, 있음 직한",ex:"Cautious investors take every <b>possible</b> measure to prevent losses.",exkr:"신중한 투자자들은 손실을 막기 위해 모든 가능한 조치를 취한다.",stars:2,tip:"in any way possible 가능한 어떻게든. possible은 명사를 뒤에서 꾸며 주는 형태로도 자주 사용된다. // possible(adj. 가능한)과 possibility(n. 가능성)의 품사 구별하기.",deriv:"possibly adv. 혹시, 아마 / possibility n. 가능성 / impossible 불가능한"},
  {n:27,en:"speculation",pron:"[spèkjuléiʃən]",pos:"n",kr:"추측",ex:"Company shares fell amid growing <b>speculation</b> of bankruptcy.",exkr:"파산에 대한 추측이 증가하는 가운데 회사 주식이 하락했다.",stars:1,tip:"widespread/growing + speculation 널리 퍼져 있는/증가하는 추측. speculation은 widespread, growing 등의 형용사와 어울려 출제된다.",deriv:"speculate v. 추측하다"},
  {n:28,en:"solely",pron:"[미 sóulli / 영 sə́ulli]",pos:"adv",kr:"전적으로",ex:"Their interest was <b>solely</b> in foreign investment.",exkr:"그들의 관심은 전적으로 해외 투자에만 있었다.",stars:1,deriv:"sole adj. 하나뿐인 / exclusively 전적으로"},
  {n:29,en:"entrepreneur",pron:"[미 ɑ̀ːntrəprənɔ́ːr / 영 ɔ̀ntrəprənɔ́ː]",pos:"n",kr:"사업가",ex:"Rosedale Investments offers venture capital to young <b>entrepreneurs</b>.",exkr:"Rosedale Investments사는 젊은 사업가들에게 벤처 자금을 제공한다.",stars:1,deriv:"enterprise n. 사업; 회사"},
  {n:30,en:"eventually",pron:"[미 ivéntʃuəli / 영 ivéntjuəli]",pos:"adv",kr:"결국, 마침내",ex:"Stocks are expected to stabilize <b>eventually</b>.",exkr:"주식이 결국에는 안정될 것으로 예측된다.",stars:1,deriv:"eventual adj. 최후의 / finally, ultimately 결국, 마침내"},
  {n:31,en:"shareholder",pron:"[미 ʃɛ́ərhòuldər / 영 ʃɛ́əhəuldə]",pos:"n",kr:"주주",ex:"<b>Shareholders</b> can now gain access to updated financial reports on the company's Web site.",exkr:"주주들은 이제 회사 웹사이트에서 갱신된 재정 보고서를 볼 수 있다.",stars:1},
  {n:32,en:"outlook",pron:"[áutlùk]",pos:"n",kr:"전망",ex:"The <b>outlook</b> for financial markets is positive.",exkr:"금융 시장의 전망은 밝다.",stars:1,deriv:"prospect 전망"},
  {n:33,en:"stability",pron:"[미 stəbíləti / 영 stəbíliti]",pos:"n",kr:"안정, 안정성",ex:"Sound economic policies are essential for long-term <b>stability</b>.",exkr:"견고한 경제 정책들이 장기적인 안정을 위해 꼭 필요하다.",stars:1,deriv:"stable adj. 안정된 / stabilize v. 안정시키다"},
  {n:34,en:"bond",pron:"[미 band / 영 bɔnd]",pos:"n",kr:"채권",ex:"The government issued public <b>bonds</b> to raise money for infrastructure projects.",exkr:"정부는 기반 시설 사업 자금을 모으기 위해 공모 채권을 발행했다.",stars:1},
  {n:35,en:"depreciation",pron:"[diprìːʃiéiʃən]",pos:"n",kr:"가치 하락, 화폐의 구매력 저하",ex:"Due to the currency <b>depreciation</b>, many investors experienced a loss.",exkr:"화폐 가치 하락으로 인해 많은 투자자들이 손해를 입었다.",stars:1,deriv:"depreciate v. 가치가 떨어지다"},
  {n:36,en:"increasing",pron:"[inkríːsiŋ]",pos:"adj",kr:"증가하는",ex:"<b>Increasing</b> market pressure led banks to decrease lending rates.",exkr:"증가하는 시장 압박은 은행들이 대출 금리를 인하하는 것으로 이어졌다.",stars:1,tip:"increasing amount of information 증가하는 정보량 / increasing market pressure 증가하는 시장 압력. increasing은 amount, pressure 등 양과 관련된 명사와 주로 출제된다.",deriv:"increase v. 증가하다 / increasingly adv. 점점"},
  {n:37,en:"prevalent",pron:"[prévələnt]",pos:"adj",kr:"유행하고 있는, 널리 퍼진",ex:"Analysts watch the most <b>prevalent</b> trends in the market.",exkr:"분석가들은 시장에서 가장 유행하고 있는 경향을 주시한다.",stars:1,tip:"prevalent : leading — '주도적인'을 뜻하는 단어들의 용례 차이를 구별하는 문제로 출제된다. prevalent 널리 퍼진 — 어떤 상태나 관행 등이 널리 퍼져 유행하고 있다는 의미이다. leading 주요한, 선도하는 — 특정 분야에서 가장 주요하거나 뛰어나다는 뜻이다. Corruption is a <b>leading</b> cause of economic instability in the region. 부패는 그 지역의 경제 불안정의 주요인이다. // 널리 보급된 것을 의미할 때 prevalent는 widespread 또는 popular와 바꾸어 쓸 수 있다.",deriv:"prevail v. 우세하다 / prevalence n. 널리 퍼짐 / widespread 널리 보급된 / popular 인기 있는, 대중적인"},
  {n:38,en:"rapid",pron:"[rǽpid]",pos:"adj",kr:"빠른, 신속한",ex:"Utility companies have been growing at a <b>rapid</b> rate in suburban areas.",exkr:"공익 기업들이 교외 지역에서 빠른 속도로 성장하고 있다.",stars:1,tip:"rapid + rate/increase/decline/growth/change 빠른 속도/증가/감소/성장/변화. rapid는 속도 및 증감을 나타내는 명사와 어울려 자주 출제된다.",deriv:"rapidly adv. 빨리, 급속히 / rapidity n. 급속, 신속"},
  {n:39,en:"unprecedented",pron:"[미 ʌnprésədèntid / 영 ʌnprésidentid]",pos:"adj",kr:"전례 없는",ex:"Housing prices in the region rose an <b>unprecedented</b> 50 percent in just six months.",exkr:"그 지역의 주택 가격이 6개월 만에 50퍼센트라는 전례 없는 상승을 보였다.",stars:1},
  {n:40,en:"yield",pron:"[jiːld]",pos:"v",kr:"(이윤을) 가져오다, 산출하다",ex:"Our investments for the past fiscal year <b>yielded</b> returns exceeding 100 percent.",exkr:"지난 회계 연도 동안의 우리의 투자는 100퍼센트를 넘는 이윤을 가져왔다.",stars:1,tip:"n. 생산량; 이윤"},

  {

    desc:"환경 주제에서는 주로 일기예보, 친환경 신제품 개발 기사 등이 출제되고 있다",
    words:[
  {n:1,en:"conserve",pron:"[미 kənsɔ́ːrv / 영 kənsɔ́ːv]",pos:"v",kr:"보존하다, 유지하다",ex:"Measures were introduced to <b>conserve</b> forests in the region.",exkr:"그 지역의 숲을 보존하기 위한 조치가 도입되었다.",stars:1,tip:"낭비 또는 훼손되지 않도록 하다라는 문맥에서 conserve는 preserve 또는 maintain으로 바꾸어 쓸 수 있다.",deriv:"conservation n. 보존, 보호 / conservative adj. 보수적인 (↔ progressive) / preserve 보존하다 / maintain 유지하다"},
  {n:2,en:"chance",pron:"[미 tʃæns / 영 tʃɑːns]",pos:"n",kr:"가능성, 기회",ex:"The morning weather report predicted a 30 percent <b>chance</b> of rain today.",exkr:"아침 일기 예보에서는 오늘 비가 올 가능성이 30퍼센트라고 예상했다.",stars:3,tip:"chance : opportunity — '기회'를 의미하는 단어들의 용례 차이를 구별하는 문제로 출제된다. chance 가능성, 기회 — opportunity처럼 '기회'라는 의미로 사용하지만 chance는 '우연히 어떤 일이 일어날 가능성'을 뜻하기도 한다는 것이 차이점이다. opportunity 기회 — 주변 상황과 조건이 받쳐 주어 어떤 일을 할 수 있는 기회가 있을 때 쓰인다. The Green Earth Symposium provided a good <b>opportunity</b> to meet like-minded colleagues. Green Earth 심포지엄은 같은 생각을 하는 동료들을 만나는 좋은 기회를 제공했다."},
  {n:3,en:"forecast",pron:"[미 fɔ́ːrkæst / 영 fɔ́ːkɑːst]",pos:"n",kr:"(날씨의) 예보",ex:"The news station gives hourly weather <b>forecasts</b>.",exkr:"그 뉴스 방송국은 매시간 일기 예보를 제공한다.",stars:1,tip:"v. 예측하다 (= predict) // weather forecast 일기 예보 / market forecast 시장 전망. forecast는 복합 명사 형태로 자주 시험에 나오므로 표현을 익혀 두자. // 미래에 발생할 일에 대한 예측을 뜻하는 forecast는 prediction으로 바꾸어 쓸 수 있다.",deriv:"prediction 예보"},
  {n:4,en:"waste",pron:"[weist]",pos:"n",kr:"쓰레기, 폐기물",ex:"Recyclable <b>waste</b> must be placed in the designated receptacles.",exkr:"재활용 쓰레기는 지정된 용기에 넣어야 한다.",stars:1,tip:"v. 낭비하다 // 쓰레기를 뜻하는 waste는 garbage, trash, rubbish 등으로 바꾸어 쓸 수 있다.",deriv:"wasteful adj. 낭비하는 / garbage, trash, rubbish 쓰레기"},
  {n:5,en:"dispose",pron:"[미 dispóuz / 영 dispə́uz]",pos:"v",kr:"처분하다, 처리하다",ex:"Manufacturers must <b>dispose</b> of their waste appropriately.",exkr:"제조업체들은 폐기물을 적절하게 처분해야 한다.",stars:2,tip:"1. dispose of ~을 처분하다 — '(사물을) 처분하다'의 의미일 때 dispose는 전치사 of와 함께 사용되므로 묶어서 알아 둬야 한다. 2. disposable income 가처분 소득 / disposable towel 일회용 타월. disposable income은 처분할 수 있는 소득, 즉 세금을 뺀 순수입을 의미한다.",deriv:"disposable adj. 일회용의, 처분할 수 있는 (↔ reusable) / disposal n. 폐기, 처분 (= dumping)"},
  {n:6,en:"recycling",pron:"[rìːsáikliŋ]",pos:"n",kr:"재활용",ex:"<b>Recycling</b> saves energy and reduces acid rain.",exkr:"재활용은 에너지를 절약하고 산성비를 감소시킨다.",stars:1,deriv:"recycle v. 재활용하다"},
  {n:7,en:"clear",pron:"[미 kliər / 영 kliə]",pos:"adj",kr:"맑게 갠; 명백한, 분명한",ex:"The picnic was held at the park on a <b>clear</b> day.",exkr:"맑게 갠 날 공원에서 소풍이 열렸다.",stars:3,tip:"adv. 또렷하게, 완전히; 떨어져서 — When the weather is good, you can see <b>clear</b> across the lake from one side to the other. 날씨가 좋을 때, 호수의 한쪽에서 건너편을 또렷하게 볼 수 있다. // 사실임이 명백한 경우를 설명하는 문맥에서 clear는 obvious로 바꾸어 쓸 수 있다.",deriv:"clearly adv. 명확히, 분명하게 / clearable adj. 깨끗이 할 수 있는 / obvious 명백한, 분명한"},
  {n:8,en:"damage",pron:"[dǽmidʒ]",pos:"n",kr:"피해, 손해",ex:"The thunderstorm caused extensive <b>damage</b> to the region.",exkr:"폭풍우가 그 지역에 막대한 피해를 입혔다.",stars:3,tip:"v. (물건을) 손상시키다 — The spilled chemicals <b>damaged</b> some factory machinery. 엎질러진 화학 물질이 몇몇 공장 기계를 손상시켰다. // cause damage to the machine 기계에 손상을 주다 / damage the machine 기계를 손상시키다. 명사 damage는 전치사 to와 어구를 이루어 자주 사용된다. 하지만 동사 damage는 타동사이므로 뒤에 전치사 to가 올 수 없다는 것을 꼭 기억해 두자. // 물리적 손상, 정신적 피해 또는 이를 가하는 행위를 의미할 때 명사 또는 동사 damage는 harm으로 바꾸어 쓸 수 있다.",deriv:"damaging adj. 손해를 끼치는 / damaged adj. 손상된 / harm 손해; 훼손하다"},
  {n:9,en:"significant",pron:"[siɡnífikənt]",pos:"adj",kr:"상당한; 중대한, 중요한",ex:"Hurricane Aida produced <b>significant</b> winds in excess of 200 kilometers an hour.",exkr:"허리케인 Aida는 시속 200킬로미터를 초과하는 상당한 바람을 만들어냈다.",stars:3,tip:"Greenhouse gases have a <b>significant</b> impact on global temperatures. 온실가스는 지구 기온에 중대한 영향을 끼친다.",deriv:"important 중요한"},
  {n:10,en:"solution",pron:"[səlúːʃən]",pos:"n",kr:"해결책",ex:"Solar power is one <b>solution</b> to energy problems.",exkr:"태양력은 에너지 문제에 대한 하나의 해결책이다.",stars:3,tip:"solution to ~에 대한 해결책. solution은 전치사 to와 함께 사용되므로 묶어서 알아 둬야 한다.",deriv:"solve v. 해결하다"},
  {n:11,en:"occur",pron:"[미 əkɔ́ːr / 영 əkɔ́ː]",pos:"v",kr:"(일이) 발생하다, 생기다",ex:"Earthquakes <b>occur</b> frequently in several regions of Japan.",exkr:"지진은 일본의 여러 지역에서 자주 발생한다.",stars:3,tip:"어떤 일이 발생하다라는 의미일 때 occur는 happen으로 바꾸어 쓸 수 있다.",deriv:"occurrence n. 사건, 발생 / happen 발생하다"},
  {n:12,en:"ideal",pron:"[미 aidíːəl / 영 aidíəl]",pos:"adj",kr:"이상적인",ex:"The weather this week has been <b>ideal</b> for a camping trip.",exkr:"이번 주 날씨는 캠핑 여행을 가기에 이상적이었다.",stars:3,tip:"1. ideal + venue/place 이상적인 개최지/장소. ideal은 venue, place 등 장소를 뜻하는 명사들과 어울려 출제된다. 2. be ideal for ~에 이상적이다. ideal과 함께 쓰이는 전치사 for를 묻는 문제로 출제된다. // 어떤 일을 하기에 좋은 조건을 설명하는 문맥에서 ideal은 perfect로 바꾸어 쓸 수 있다.",deriv:"n. 이상, 이상적인 것(사람) / perfect 이상적인"},
  {n:13,en:"preserve",pron:"[미 prizɔ́ːrv / 영 prizɔ́ːv]",pos:"v",kr:"보존하다, 보호하다",ex:"EnviroCore's mandate is to <b>preserve</b> natural habitats in North America.",exkr:"EnviroCore의 임무는 북아메리카의 자연 서식지를 보존하는 것이다.",stars:2,deriv:"preserved adj. 보존된"},
  {n:14,en:"aid",pron:"[eid]",pos:"n",kr:"원조",ex:"The government pledged $15 million in <b>aid</b> to repair flood damage.",exkr:"정부는 홍수 피해를 복구하는 데 1,500만 달러의 원조를 약속했다.",stars:2,tip:"v. 원조하다, 돕다"},
  {n:15,en:"excessive",pron:"[미 iksésiv / 영 eksésiv]",pos:"adj",kr:"지나친, 과도한",ex:"<b>Excessive</b> garbage is a serious problem for many megacities.",exkr:"지나친 쓰레기는 많은 대도시의 심각한 문제이다.",stars:2},
  {n:16,en:"intensively",pron:"[inténsivli]",pos:"adv",kr:"집중적으로",ex:"The wind blew <b>intensively</b> for hours during the storm.",exkr:"폭풍이 칠 때 바람이 몇 시간 동안 집중적으로 불었다.",stars:2},
  {n:17,en:"vary",pron:"[미 véəri / 영 véəri]",pos:"v",kr:"다르다, 다양하다",ex:"The level of water in the lake <b>varies</b> greatly from year to year.",exkr:"그 호수의 수위는 해마다 크게 다르다.",stars:2,deriv:"variation n. 변형, 변화, 차이 / varied adj. 여러 가지의, 다채로운"},
  {n:18,en:"pleasing",pron:"[plíːziŋ]",pos:"adj",kr:"즐거운, 기분 좋은, 만족스러운",ex:"Trees in city parks are not only <b>pleasing</b> to see, but environmentally beneficial.",exkr:"시립 공원의 나무들은 보기에 즐거울 뿐만 아니라, 환경적으로도 이롭다.",stars:2,tip:"pleasing 즐거운, 만족스러운 — pleasing은 즐거움의 원인이 되는 대상을 설명할 때 사용된다. pleased 만족한, 즐거워하는 — pleased는 만족감이나 즐거움을 느끼는 사람을 설명할 때 사용되며, 주로 be pleased with 형태로 출제된다. Most residents were <b>pleased</b> with the city council's new environmental initiative. 대부분의 주민은 시의회의 새로운 환경 법안 발의에 만족했다."},
  {n:19,en:"mark",pron:"[미 mɑːrk / 영 mɑːk]",pos:"n",kr:"점수, 평점, 표시",ex:"Allor Corp. received an excellent <b>mark</b> from environment monitoring groups.",exkr:"Allor사는 환경 감시 단체들로부터 우수한 점수를 받았다.",stars:2,tip:"v. 기념하다, 축하하다 — The company <b>marked</b> Arbor Day by planting trees on its compound. 그 회사는 구내에 나무를 심는 것으로 식목일을 기념했다. // mark는 평가를 통해 받은 점수를 의미하는 명사로 쓰일 때는 rating으로, 기념일을 축하하다라는 의미의 동사로 쓰일 때는 celebrate로 바꾸어 쓸 수 있다.",deriv:"rating 평가, 등급 / celebrate 기념하다, 축하하다"},
  {n:20,en:"inaccessible",pron:"[미 ìnəksésəbl / 영 ìnəksésibl]",pos:"adj",kr:"접근이 불가능한, 이용이 불가능한",ex:"The wildlife park is <b>inaccessible</b> by car, so visitors have to take a ferry.",exkr:"그 야생 공원은 자동차로 접근이 불가능해서, 방문객들은 나룻배를 타고 가야 한다.",stars:2,tip:"currently inaccessible 현재 접근/이용이 불가능한. inaccessible은 currently 등 시점을 나타내는 부사와 함께 주로 사용된다."},
  {n:21,en:"disturb",pron:"[미 distɔ́ːrb / 영 distɔ́ːb]",pos:"v",kr:"방해하다",ex:"The guests were <b>disturbed</b> by the noise from the construction site.",exkr:"손님들은 건설 현장으로부터 나는 소리에 방해받았다.",stars:2},
  {n:22,en:"pollutant",pron:"[pəlúːtnt]",pos:"n",kr:"오염 물질",ex:"Automotive exhaust introduces harmful <b>pollutants</b> into the air.",exkr:"자동차 배기가스는 유해한 오염 물질을 대기 중으로 내보낸다.",stars:2,tip:"pollutant 오염 물질 / pollution 오염. 물질 명사인 pollutant와 추상 명사인 pollution의 뜻을 구별하는 문제로 출제된다.",deriv:"pollute v. 오염시키다 / pollution n. 오염"},
  {n:23,en:"emission",pron:"[imíʃən]",pos:"n",kr:"배기가스, 방출",ex:"New laws now limit <b>emissions</b> from cars.",exkr:"새로운 법률이 이제부터 자동차 배기가스 양을 제한한다.",stars:2,deriv:"emit v. 배출하다"},
  {n:24,en:"dense",pron:"[dens]",pos:"adj",kr:"빽빽한, 밀집한",ex:"The Black Forest is so <b>dense</b> that it appears dark even at noon.",exkr:"Black 숲은 너무 빽빽해서 한낮에도 어두워 보인다.",stars:2},
  {n:25,en:"environmental",pron:"[미 invài∂rənméntl / 영 invài∂rənméntl]",pos:"adj",kr:"환경적인",ex:"Climate change has become a major global <b>environmental</b> issue.",exkr:"기후 변화는 전 세계적으로 중요한 환경 문제가 되었다.",stars:2,deriv:"environment n. 환경 / environmentalist n. 환경 운동가 / environmentally adv. 환경적으로"},
  {n:26,en:"consistent",pron:"[kənsístənt]",pos:"adj",kr:"일치하는, 지속적인, 한결같은",ex:"Factory construction must be <b>consistent</b> with government environmental regulations.",exkr:"공장 건설은 정부 환경 규정에 일치해야 한다.",stars:1,deriv:"consistently adv. 일관하여, 지속적으로"},
  {n:27,en:"leak",pron:"[liːk]",pos:"n",kr:"누출, 누출량",ex:"A <b>leak</b> in an oil pipeline caused considerable sickness in wildlife.",exkr:"송유관의 누출이 야생 동물들에게 많은 질병을 야기했다.",stars:1,tip:"v. (물·빛이) 새게 하다 — Improperly sealed tanks slowly <b>leaked</b> chemicals into the water. 부적절하게 밀봉된 탱크가 화학 물질이 물속으로 천천히 새게 했다."},
  {n:28,en:"organization",pron:"[미 ɔ̀ːrɡənizéiʃən / 영 ɔ̀ːɡənaizéiʃən]",pos:"n",kr:"단체",ex:"Many <b>organizations</b> have grouped together to protect the African savanna.",exkr:"많은 단체가 아프리카 사바나를 보호하기 위해 함께 뭉쳤다.",stars:1,deriv:"organize v. 조직하다 / association 단체"},
  {n:29,en:"continually",pron:"[kəntínjuəli]",pos:"adv",kr:"계속해서",ex:"The processing plant <b>continually</b> polluted nearby lakes.",exkr:"그 가공 처리 공장은 계속해서 인근 호수들을 오염시켰다.",stars:1,tip:"continually : lastingly — '계속해서'를 의미하는 단어들의 용례 차이를 구별하는 문제로 출제된다. continually 계속해서 — 어떤 일이 발생했다 멈췄다 하며 거듭해서 계속 일어날 때 사용한다. lastingly 지속적으로, 영속적으로 — 어떤 사항이 지속적으로 존재하거나 영향을 미치는 경우에 쓰인다. The new environmental bill promises to <b>lastingly</b> protect the nation's waterways. 새로운 환경 법안은 그 나라의 수로를 지속적으로 보호하는 것을 보장한다.",deriv:"continue v. 계속되다 / continual adj. 반복되는, 끊임없는 / continuous adj. 계속적인 / continuity n. 연속성 / continuation n. 지속, 연속되는 것"},
  {n:30,en:"contaminate",pron:"[미 kəntǽmənèit / 영 kəntǽmineit]",pos:"v",kr:"오염시키다",ex:"The water was <b>contaminated</b> with gasoline.",exkr:"물이 휘발유로 오염되었다.",stars:1,tip:"위험 또는 오염 물질을 더해 불순하게 하다라는 의미일 때 contaminate는 pollute로 바꾸어 쓸 수 있다.",deriv:"contamination n. 오염 / pollute 오염시키다"},
  {n:31,en:"disaster",pron:"[미 dizǽstər / 영 dizáːstə]",pos:"n",kr:"재난",ex:"Emergency procedures are implemented in case of a natural <b>disaster</b>.",exkr:"자연재해가 발생할 시에는 비상 절차가 시행된다.",stars:1},
  {n:32,en:"discharge",pron:"[미 distʃɑ́ːrdʒ / 영 distʃɑ́ːdʒ]",pos:"v",kr:"방출하다",ex:"It is illegal to <b>discharge</b> industrial chemicals into the environment.",exkr:"산업용 화학 물질을 자연환경으로 방출하는 것은 불법이다.",stars:1,tip:"n. 방출"},
  {n:33,en:"resource",pron:"[미 ríːsɔːrs / 영 rísɔːs]",pos:"n",kr:"자원",ex:"Designating lands as national parks can help preserve natural <b>resources</b>.",exkr:"토지를 국립 공원으로 지정하는 것은 천연자원을 보존하는 데 도움이 된다.",stars:1,tip:"natural resources 천연자원 / human resources 인적 자원, 인사(부). resource는 복합 명사 형태로 자주 시험에 나오므로 표현을 익혀 두자.",deriv:"resourceful adj. 자원이 풍부한"},
  {n:34,en:"prominent",pron:"[미 prámənənt / 영 prɔ́minənt]",pos:"adj",kr:"유명한, 두드러진",ex:"Mr. Goldstein is a <b>prominent</b> expert in the energy industry.",exkr:"Mr. Goldstein은 에너지 업계에서 유명한 전문가이다.",stars:1,tip:"잘 알려진 사람이나 단체를 설명하는 문맥에서 prominent는 renowned로 바꾸어 쓸 수 있다.",deriv:"prominence n. 두드러짐, 걸출 / prominently adv. 두드러지게, 현저하게 / renowned 유명한"},
  {n:35,en:"deplete",pron:"[diplíːt]",pos:"v",kr:"고갈시키다",ex:"The area's water resources have been <b>depleted</b>, causing a drop in produce.",exkr:"그 지역의 수자원이 고갈되면서 농산물 감소의 원인이 되었다.",stars:1,tip:"자원이나 자금을 다 써서 거의 없게 하다라는 의미의 deplete는 exhaust로 바꾸어 쓸 수 있다.",deriv:"depletion n. 고갈, 파괴 / exhaust 고갈시키다"},
  {n:36,en:"purify",pron:"[미 pjúərəfài / 영 pjúərifai]",pos:"v",kr:"정화시키다",ex:"The plant <b>purifies</b> the water before it is offered to the local population.",exkr:"그 공장은 지역 주민들에게 제공되기 전에 물을 정화시킨다.",stars:1,deriv:"purification n. 정화"},
  {n:37,en:"endangered",pron:"[미 indéindʒərd / 영 indéindʒəd]",pos:"adj",kr:"멸종 위기에 처한",ex:"WildAid is fighting to protect <b>endangered</b> species.",exkr:"WildAid는 멸종 위기에 처한 종들을 보호하기 위해 싸우고 있다.",stars:1,tip:"멸종 위기에 처한 상태를 의미하는 endangered는 threatened로 바꾸어 쓸 수 있다.",deriv:"threatened 멸종 위기에 처한"},
  {n:38,en:"extinction",pron:"[ikstíŋkʃən]",pos:"n",kr:"멸종",ex:"Polar bears are now in danger of <b>extinction</b>.",exkr:"북극곰은 현재 멸종 위기에 처해 있다.",stars:1,deriv:"extinct adj. 멸종된"},
  {n:39,en:"drought",pron:"[draut]",pos:"n",kr:"가뭄",ex:"The persistent <b>drought</b> affected the water supply.",exkr:"계속되는 가뭄이 급수에 영향을 주었다.",stars:1},
  {n:40,en:"inflict",pron:"[inflíkt]",pos:"v",kr:"(고통·피해를) 입히다, 가하다",ex:"The new dam has <b>inflicted</b> considerable damage on the local communities.",exkr:"새로운 댐이 지역 사회에 상당한 피해를 입혔다.",stars:1,deriv:"infliction n. (고통·피해를) 가함"},
  {n:41,en:"migration",pron:"[maiɡréiʃən]",pos:"n",kr:"이동, 이주",ex:"The tank was isolated to prevent the <b>migration</b> of contaminants.",exkr:"탱크는 오염 물질의 이동을 막기 위해 격리되었다.",stars:1,tip:"migration : immigration — '이동'을 뜻하는 단어들의 용례 차이를 구별해 두자. migration 이동, 이주 — 한 지역에서 다른 지역으로 이동하거나 이주할 때 쓰인다. immigration 이민 (↔ emigration) — 외국으로부터 이주해 오는 것을 뜻한다. The government adopted strict new controls on <b>immigration</b>. 정부는 이민에 대해 강경한 신규 법적 규제를 채택했다.",deriv:"migrate v. 이주하다"},
  {n:42,en:"ecology",pron:"[미 ikálədʒi / 영 ikɔ́lədʒi]",pos:"n",kr:"생태, 자연환경",ex:"Global warming alters the <b>ecology</b> of our planet.",exkr:"지구 온난화는 지구의 생태를 변화시킨다.",stars:1},
  {n:43,en:"habitat",pron:"[hǽbitæt]",pos:"n",kr:"(동·식물의) 서식지",ex:"The plant rarely grows outside its natural <b>habitat</b>.",exkr:"그 식물은 자연 서식지 밖에서는 거의 자라지 않는다.",stars:1,deriv:"habitation n. 거주 / inhabitant n. 주민, 거주자"},

  {n:6,en:"prescribe",pron:"[priskráib]",pos:"v",kr:"(약을) 처방하다",ex:"The doctor <b>prescribed</b> a remedy for Elaine's cold.",exkr:"의사가 Elaine의 감기를 위한 치료약을 처방했다.",stars:2,tip:"prescribe medicine 약을 처방하다 / fill a prescription 처방전을 조제하다. prescribe는 medicine 등 약을 의미하는 명사가 주로 목적어로 온다. 명사 prescription은 동사 fill과 어울려 사용된다는 것을 함께 알아 두자.",deriv:"prescription n. 처방전"},

  {n:8,en:"recognize",pron:"[rékəɡnàiz]",pos:"v",kr:"인정하다, 알아보다",ex:"Many alternative medicines are not <b>recognized</b> as valid treatments.",exkr:"많은 대체 의약품들은 유효한 치료법으로 인정되지 않는다.",stars:3,tip:"recognize는 사람의 수고, 노력 등을 알아주어 표창하는 문맥일 때에는 honor로, 사물이나 상황의 본질을 알아보고 이해한다는 문맥일 때에는 realize로 바꾸어 쓸 수 있다.",deriv:"recognizable adj. 인식할 수 있는, 알아볼 수 있는 / honor 명예를 주다 / realize 인식하다, 확실히 이해하다"},

function saveChecked() {
  try { localStorage.setItem('hv_checked', JSON.stringify(checked)); } catch(e) {}
}

function resetProgress() {
  if (!confirm('학습 진도를 모두 초기화할까요?\n체크한 단어 기록이 전부 삭제되며 되돌릴 수 없습니다.')) return;
  checked = {};
  try { localStorage.removeItem('hv_checked'); } catch(e) {}
  if (mode === 'study') showDay(currentDay);
  else showQuizSetup();
  buildSidebar();
}

// ====================================================
// SIDEBAR
// ====================================================
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '<div class="sidebar-title">DAY 목록</div>';
  DAYS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (d.num === currentDay ? ' active' : '');
    btn.dataset.day = d.num;
    btn.innerHTML = `<span class="day-num">D${String(d.num).padStart(2,'0')}</span><div><div>${d.story}</div><div class="day-topic">${d.category}</div></div>`;
    btn.onclick = () => {
      currentDay = d.num;
      buildSidebar();
      mode = 'study';
      document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.m === 'study'));
      showDay(d.num);
      closeDrawer();
      window.scrollTo(0, 0);
    };
    sb.appendChild(btn);
  });
}

function posClass(pos) {
  return {n:'pos-n',v:'pos-v',adj:'pos-adj',adv:'pos-adv',phr:'pos-phr'}[pos] || 'pos-n';
}
function posLabel(pos) {
  return {n:'명', v:'동', adj:'형', adv:'부', phr:'구'}[pos] || pos;
}
function starsHtml(n) {
  return n ? `<span class="stars">${'★'.repeat(n)}${'☆'.repeat(3-n)}</span>` : '';
}

function getDayChecked(day) {
  const d = DAYS.find(x=>x.num===day);
  if(!d) return 0;
  return d.words.filter(w => checked[`${day}_${w.n}`]).length;
}

function showDay(num) {
  const d = DAYS.find(x=>x.num===num);
  if(!d) return;
  const mc = document.getElementById('mainContent');
  const done = getDayChecked(num);
  const total = d.words.length;
  const extraCount = (d.extra||[]).reduce((s,sec)=>s+sec.groups.reduce((a,g)=>a+g.items.length,0),0);
  const grand = total + extraCount;
  const pct = total ? Math.round(done/total*100) : 0;

  let html = `
  <div class="day-header">
    <div class="day-badge">
      <div class="day-badge-label">DAY</div>
      <div class="day-badge-num">${String(num).padStart(2,'0')}</div>
    </div>
    <div class="day-info">
      <div class="day-story">${d.story}</div>
      <div class="day-category"># ${d.category}</div>
      <div class="day-desc">${d.desc}</div>
    </div>
    <div class="day-count">
      <div class="day-count-n">${grand}</div>
      <div class="day-count-label">빈출 ${total} · 완성 ${extraCount}</div>
    </div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-label">학습 진도</div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-pct">${done}/${total}</div>
  </div>
  <div class="vocab-grid">`;

  d.words.forEach(w => {
    const key = `${num}_${w.n}`;
    const isDone = !!checked[key];
    html += `
    <div class="vocab-card${isDone?' done':''}" id="card_${key}" onclick="toggleExpand('${key}')">
      <div class="card-top">
        <div class="card-left">
          <div class="word-num">No. ${w.n}</div>
          <div class="word-en">${w.en}${starsHtml(w.stars)}</div>
          ${w.pron ? `<div class="word-pron">${w.pron}</div>` : ''}
          <div>
            <span class="word-pos ${posClass(w.pos)}">${posLabel(w.pos)}</span>
            <span class="word-kr">${w.kr}</span>
          </div>
        </div>
        <div class="card-right">
          <button class="check-btn${isDone?' checked':''}" onclick="event.stopPropagation();toggleCheck('${key}')" title="학습 완료 표시">
            ${isDone?'✓':'○'}
          </button>
          ${spkBtn(w.en, '')}
        </div>
      </div>
      <div class="example-wrap">
        ${w.ex ? `<div class="example-en">${w.ex}${spkBtn(w.ex, 'sm')}</div><div class="example-kr">${w.exkr}</div>` : ''}
        ${w.deriv ? `<div class="deriv-box"><span class="deriv-label">관련어</span>${w.deriv}</div>` : ''}
        ${w.tip ? `<div class="toeic-tip"><div class="toeic-tip-title">🤖 토익 이렇게 나온다</div>${w.tip}</div>` : ''}
      </div>
    </div>`;
  });

  html += '</div>';

  // 토익완성단어 (기초 / 800 / 900) 섹션
  if(d.extra && d.extra.length) {
    html += `<div class="extra-wrap">`;
    d.extra.forEach(sec => {
      const lvlClass = sec.level==='기초' ? 'lv-basic' : sec.level==='800' ? 'lv-800' : 'lv-900';
      const count = sec.groups.reduce((s,g)=>s+g.items.length,0);
      html += `<div class="extra-section">
        <div class="extra-head ${lvlClass}">${sec.title} <span class="extra-count">${count}개</span></div>`;
      sec.groups.forEach(g => {
        html += `<div class="extra-group"><div class="extra-sub">${g.sub}</div><div class="extra-list">`;
        g.items.forEach(it => {
          html += `<div class="extra-item"><span class="ei-en">${it.en}</span><span class="word-pos ${posClass(it.pos)}">${posLabel(it.pos)}</span><span class="ei-kr">${it.kr}</span></div>`;
        });
        html += `</div></div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }

  mc.innerHTML = html;
  window.scrollTo(0, 0);
}

function toggleExpand(key) {
  const card = document.getElementById('card_'+key);
  if(card) card.classList.toggle('expanded');
}

function toggleCheck(key) {
  checked[key] = !checked[key];
  if (checked[key]) wrLearned(key);
  saveChecked();
  const [dayNum] = key.split('_');
  showDay(parseInt(dayNum));
  buildSidebar();
}

// SEARCH
// ====================================================
function handleSearch(query) {
  const q = query.trim().toLowerCase();
  const mc = document.getElementById('mainContent');
  const searchPanel = document.getElementById('searchPanel');
  
  if(!q) {
    document.getElementById('searchPanel') && document.getElementById('searchPanel').remove && null;
    showDay(currentDay);
    return;
  }

  let results = [];
  DAYS.forEach(d => {
    d.words.forEach(w => {
      if(w.en.toLowerCase().includes(q) || w.kr.includes(q) || (w.tip||'').toLowerCase().includes(q)) {
        results.push({day:d, word:w});
      }
    });
  });

  let html = `<div class="search-result-count">검색어 "<span>${query}</span>" 결과: <span>${results.length}개</span></div><div class="vocab-grid">`;
  if(results.length === 0) {
    html += `<div style="text-align:center;color:var(--gray-text);padding:40px">검색 결과가 없습니다.</div>`;
  }
  results.forEach(({day, word:w}) => {
    const key = `${day.num}_${w.n}`;
    const isDone = !!checked[key];
    html += `
    <div class="vocab-card${isDone?' done':''}" onclick="toggleExpand('${key}')" id="card_${key}">
      <div style="font-size:0.72rem;color:var(--accent);font-weight:700;margin-bottom:4px">DAY ${String(day.num).padStart(2,'0')} · ${day.category}</div>
      <div class="card-top">
        <div class="card-left">
          <div class="word-en">${w.en}${starsHtml(w.stars)}</div>
          ${w.pron ? `<div class="word-pron">${w.pron}</div>` : ''}
          <div><span class="word-pos ${posClass(w.pos)}">${posLabel(w.pos)}</span><span class="word-kr">${w.kr}</span></div>
        </div>
        <button class="check-btn${isDone?' checked':''}" onclick="event.stopPropagation();toggleCheck('${key}')">${isDone?'✓':'○'}</button>
      </div>
      <div class="example-wrap">
        ${w.ex ? `<div class="example-en">${w.ex}</div><div class="example-kr">${w.exkr}</div>` : ''}
        ${w.tip ? `<div class="toeic-tip"><div class="toeic-tip-title">🤖 토익 이렇게 나온다</div>${w.tip}</div>` : ''}
      </div>
    </div>`;
  });
  html += '</div>';
  mc.innerHTML = html;
}

/* 퀴즈에서 빠져나갈 때 돌던 타이머와 예약된 다음 문제를 모두 멈춥니다. */
function stopQuiz() {
  if (window.speechSynthesis) speechSynthesis.cancel();

  gTimer = speedTimer = gNextT = null; speedActive = false; gLocked = false;
}

function pickType(t) {
  quizType = t;
  document.querySelectorAll('.mode-card').forEach(c =>
    c.classList.toggle('selected', c.dataset.type === t));
}

// 출제 단어 풀 만들기
function collectWords() {
  let words = [];
  DAYS.forEach(d => {
    if(quizDayTarget==='all' || parseInt(quizDayTarget)===d.num) {
      d.words.forEach(w => { if(w.kr && w.en) words.push({day:d.num, word:w}); });
    }
  });
  return words.sort(()=>Math.random()-0.5);
}
// 오답 보기 풀 (kr 또는 en)
function distractorPool(field) {
  const pool=[];
  DAYS.forEach(d=>{ if(quizDayTarget==='all'||parseInt(quizDayTarget)===d.num)
    d.words.forEach(w=>{ if(w[field]) pool.push(w[field]); }); });
  return pool;
}
function buildChoices(correct, field) {
  const pool = [...new Set(distractorPool(field).filter(x=>x!==correct))];
  const ds = pool.sort(()=>Math.random()-0.5).slice(0,3);
  return [correct, ...ds].sort(()=>Math.random()-0.5);
}

function startQuiz() {
  const sel = document.getElementById('quizDaySelect');
  quizDayTarget = sel ? sel.value : 'all';
  let words = collectWords();
  // 빈칸 채우기는 예문 있는 단어만
  if(quizType==='cloze') words = words.filter(x=>x.word.ex && /<b>.*<\/b>/.test(x.word.ex));
  if(words.length < 4) { alert('이 범위에는 문제가 부족해요. 범위를 넓혀주세요.'); return; }
  if(quizType!=='speed' && quizDayTarget==='all') words = words.slice(0,20);

  quizQueue = words; quizIndex = 0;
  gScore=0; gCombo=0; gMaxCombo=0; gCorrect=0; gWrong=0; gLives=5;

  if(quizType==='speed') {
    speedLeft = SPEED_TOTAL; speedActive = true;
    clearInterval(speedTimer);
    speedTimer = setInterval(()=>{
      speedLeft--;
      const el=document.getElementById('speedTime'); if(el) el.textContent=speedLeft+'초';
      if(speedLeft<=0){ clearInterval(speedTimer); speedActive=false; showResult(); }
    },1000);
  }
  showQuizCard();
}

function hudHtml(day, extra='') {
  const livesRow = quizType==='speed' ? '' :
    `<div class="hud-sep"></div><div class="hud-item"><span class="hud-label">LIVES</span><span class="hud-value hud-lives" id="hudLives">${'❤️'.repeat(Math.max(0,gLives))}${'🖤'.repeat(Math.max(0,5-gLives))}</span></div>`;
  const counter = quizType==='speed'
    ? `<div class="hud-item"><span class="hud-label">맞힘</span><span class="hud-value" id="hudCount">${gCorrect}</span></div>`
    : `<div class="hud-item"><span class="hud-label">문제</span><span class="hud-value">${quizIndex+1}/${quizQueue.length}</span></div>`;
  return `
    <div class="game-hud">
      <div class="hud-item"><span class="hud-label">SCORE</span><span class="hud-value score" id="hudScore">${gScore}</span></div>
      <div class="hud-sep"></div>
      <div class="hud-item"><span class="hud-label">COMBO</span><span class="hud-value combo" id="hudCombo">x${gCombo}</span></div>
      <div class="hud-sep"></div>
      ${counter}
      <div class="hud-spacer"></div>
      ${extra}${livesRow}
    </div>`;
}

function showQuizCard() {
  clearInterval(gTimer); gLocked=false;
  const mc = document.getElementById('mainContent');

  // 종료 조건
  if(quizType==='speed') {
    if(!speedActive){ showResult(); return; }
    if(quizIndex >= quizQueue.length) quizQueue = collectWords(); // 단어 소진 시 재셔플
  } else {
    if(quizIndex >= quizQueue.length || gLives<=0){ showResult(); return; }
  }

  const {day, word:w} = quizQueue[quizIndex];
  const banner = quizType==='speed'
    ? `<div class="speed-banner">⚡ 속도전 · 남은 시간 <span class="speed-time" id="speedTime">${speedLeft}초</span></div>` : '';
  const timerBar = quizType==='speed' ? ''
    : `<div class="game-timer-track"><div class="game-timer-fill" id="timerFill"></div></div>`;

  let body = '';
  if(quizType==='meaning') {
    const choices = buildChoices(w.kr,'kr');
    body = `
      <div class="quiz-qnum">DAY ${String(day).padStart(2,'0')}</div>
      <div class="quiz-prompt">이 단어의 뜻은?</div>
      <div class="quiz-word">${w.en}</div>
      <div class="quiz-pron">${w.pron||''}</div>
      ${spkBtn(w.en, 'lg')}
      <div class="quiz-options">
        ${choices.map(c=>`<button class="quiz-option" onclick="answerMC(this,${esc(c)===esc(w.kr)})">${c}</button>`).join('')}
      </div>`;
  } else if(quizType==='word') {
    const choices = buildChoices(w.en,'en');
    body = `
      <div class="quiz-qnum">DAY ${String(day).padStart(2,'0')}</div>
      <div class="quiz-prompt">이 뜻을 가진 영어 단어는?</div>
      <div class="quiz-meaning-big">${w.kr}</div>
      <div class="quiz-sub"><span class="word-pos ${posClass(w.pos)}">${posLabel(w.pos)}</span></div>
      <div class="quiz-options">
        ${choices.map(c=>`<button class="quiz-option en-opt" onclick="answerMC(this,${esc(c)===esc(w.en)})">${c}</button>`).join('')}
      </div>`;
  } else if(quizType==='cloze') {
    const choices = buildChoices(w.en,'en');
    const sentence = w.ex.replace(/<b>.*?<\/b>/, '<span class="cloze-blank">_____</span>');
    body = `
      <div class="quiz-qnum">DAY ${String(day).padStart(2,'0')}</div>
      <div class="quiz-prompt">빈칸에 들어갈 단어는?</div>
      <div class="cloze-sentence">${sentence}</div>
      <div class="quiz-options">
        ${choices.map(c=>`<button class="quiz-option en-opt" onclick="answerMC(this,${esc(c)===esc(w.en)})">${c}</button>`).join('')}
      </div>`;
  } else if(quizType==='spell') {
    const masked = w.en.split('').map((ch,i)=> i===0||ch===' '||ch==='-' ? ch : '·').join('');
    body = `
      <div class="quiz-qnum">DAY ${String(day).padStart(2,'0')}</div>
      <div class="quiz-prompt">뜻을 보고 영어 철자를 입력하세요</div>
      <div class="quiz-meaning-big">${w.kr}</div>
      <div class="quiz-sub"><span class="word-pos ${posClass(w.pos)}">${posLabel(w.pos)}</span></div>
      <div class="spell-mask">${masked} <span style="font-size:0.85rem;color:var(--gray-text)">(${w.en.length}글자)</span></div>
      <input class="spell-input" id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="여기에 입력" onkeydown="if(event.key==='Enter')submitSpell()">
      <button class="spell-submit" onclick="submitSpell()">확인 (Enter)</button>`;
  } else if(quizType==='speed') {
    // 속도전은 객관식(뜻 맞히기)으로 빠르게
    const choices = buildChoices(w.kr,'kr');
    body = `
      <div class="quiz-prompt">뜻 고르기</div>
      <div class="quiz-word">${w.en}</div>
      <div class="quiz-pron">${w.pron||''}</div>
      ${spkBtn(w.en, 'lg')}
      <div class="quiz-options">
        ${choices.map(c=>`<button class="quiz-option" onclick="answerMC(this,${esc(c)===esc(w.kr)})">${c}</button>`).join('')}
      </div>`;
  }

  mc.innerHTML = banner + hudHtml(day) + timerBar + `
    <div class="quiz-card">${body}</div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <div class="quiz-skip-row"><button class="quiz-skip-btn" onclick="endGame()">⏹ 게임 종료</button></div>`;

  if(quizType==='spell') { const inp=document.getElementById('spellInput'); if(inp) inp.focus(); }
  if(quizType!=='speed') startTimer();
}

// 따옴표/HTML 안전 비교용
function esc(s){ return (s||'').replace(/"/g,'&quot;'); }

function startTimer() {
  gTimeLeft = G_TIME;
  const fill = document.getElementById('timerFill');
  if(fill) fill.style.width='100%';
  gTimer = setInterval(()=>{
    gTimeLeft -= 0.1;
    const pct = Math.max(0, gTimeLeft/G_TIME*100);
    if(fill){ fill.style.width=pct+'%'; fill.classList.toggle('warn', gTimeLeft<=3); }
    if(gTimeLeft<=0){ clearInterval(gTimer); timeUp(); }
  },100);
}

function timeUp() {
  if(gLocked) return; gLocked=true;
  const {word:w}=quizQueue[quizIndex];
  const ansField = (quizType==='word'||quizType==='cloze') ? 'en' : 'kr';
  document.querySelectorAll('.quiz-option').forEach(b=>{
    b.disabled=true;
    if(b.textContent===w[ansField]){ b.classList.add('correct'); b.innerHTML+='<span class="opt-mark">✓</span>'; }
  });
  registerWrong(true);
}

// 객관식 정답 처리
function answerMC(btn, isCorrect) {
  if(gLocked) return; gLocked=true; clearInterval(gTimer);
  const {day, word:w}=quizQueue[quizIndex];
  const ansField=(quizType==='word'||quizType==='cloze')?'en':'kr';
  document.querySelectorAll('.quiz-option').forEach(b=>b.disabled=true);
  if(isCorrect){
    btn.classList.add('correct'); btn.innerHTML+='<span class="opt-mark">✓</span>';
    scoreCorrect(day,w);
  } else {
    btn.classList.add('wrong'); btn.innerHTML+='<span class="opt-mark">✕</span>';
    document.querySelectorAll('.quiz-option').forEach(b=>{
      if(b.textContent===w[ansField]){ b.classList.add('correct'); b.innerHTML+='<span class="opt-mark">✓</span>'; }
    });
    registerWrong(false);
  }
}

// 철자 정답 처리
function submitSpell() {
  if(gLocked) return;
  const inp=document.getElementById('spellInput'); if(!inp) return;
  const val=inp.value.trim().toLowerCase();
  if(!val) return;
  gLocked=true; clearInterval(gTimer);
  const {day, word:w}=quizQueue[quizIndex];
  const target=w.en.trim().toLowerCase();
  inp.disabled=true;
  if(val===target){ inp.classList.add('correct'); scoreCorrect(day,w); }
  else {
    inp.classList.add('wrong');
    const fb=document.getElementById('quizFeedback');
    if(fb) fb.innerHTML=`<div class="fb-text bad">✕ 오답 <span style="color:var(--navy)">정답: ${w.en}</span></div><div class="quiz-next-hint">잠시 후 다음 문제…</div>`;
    gCombo=0; gWrong++; gLives--; updateHud();
    gNextT = setTimeout(nextCard, 1500);
  }
}

function scoreCorrect(day, w) {
  const timeBonus = quizType==='speed' ? 0 : Math.round(gTimeLeft*10);
  gCombo++; gMaxCombo=Math.max(gMaxCombo,gCombo);
  const comboBonus=(gCombo-1)*20;
  const typeBonus = quizType==='spell' ? 50 : 0; // 철자는 난도 보너스
  const gained=100+timeBonus+comboBonus+typeBonus;
  gScore+=gained; gCorrect++;
  checked[`${day}_${w.n}`]=true; wrLearned(`${day}_${w.n}`); saveChecked();
  const fb=document.getElementById('quizFeedback');
  const msg=['정답!','좋아요!','훌륭해요!','완벽해요!'][Math.min(3,Math.floor(gCombo/3))];
  if(fb) fb.innerHTML=`<div class="fb-text good">✓ ${msg} +${gained}점</div>
    ${gCombo>=2?`<div class="fb-combo">🔥 ${gCombo} 콤보!${comboBonus?` (보너스 +${comboBonus})`:''}</div>`:''}
    <div class="quiz-next-hint">잠시 후 다음 문제…</div>`;
  updateHud();
  gNextT = setTimeout(nextCard, quizType==='speed'?500:1000);
}

function registerWrong(isTimeout) {
  gCombo=0; gWrong++; gLives--;
  const {word:w}=quizQueue[quizIndex];
  const ansField=(quizType==='word'||quizType==='cloze')?'en':'kr';
  const fb=document.getElementById('quizFeedback');
  if(fb) fb.innerHTML=`<div class="fb-text bad">${isTimeout?'⏰ 시간 초과!':'✕ 오답'} <span style="color:var(--navy);font-weight:700">정답: ${w[ansField]}</span></div>
    <div class="quiz-next-hint">${(quizType!=='speed'&&gLives<=0)?'생명을 모두 소진했어요':'잠시 후 다음 문제…'}</div>`;
  updateHud();
  gNextT = setTimeout(nextCard, 1500);
}

function nextCard(){ quizIndex++; showQuizCard(); }

function updateHud() {
  const s=document.getElementById('hudScore'); if(s)s.textContent=gScore;
