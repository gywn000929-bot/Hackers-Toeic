<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* 저장된 테마를 그리기 전에 적용 — 깜빡임 방지 */
try{var t=localStorage.getItem('english-room-theme');if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<title>해커스 토익 기출 보카 | 인터랙티브 전자책</title>
<meta name="description" content="해커스 토익 기출 보카 30일 완성. 예문·팁·파생어와 퀴즈까지 한 페이지에.">
<meta name="theme-color" content="#1b2a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 공부방">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons-app/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons-app/icon-192.png">
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('./fonts/PretendardVariable.woff2') format('woff2-variations');
    font-weight: 45 920;
    font-style: normal;
    font-display: swap;
  }
  :root {
    /* 색·글꼴은 '매일 영어(OPIc)' 앱과 같은 값을 씁니다. */
    --navy: #16233d;          /* 잉크/메인 */
    --navy-light: #46536c;    /* 보조 텍스트 */
    --navy-soft: #ecf1fd;     /* 파랑 계열 연한 배경 */
    --accent: #2f5fd0;        /* 포인트 — 로열 블루 */
    --accent-light: #dde6f8;
    --yellow: #fbf1e2;        /* 팁 배경 — 따뜻한 모래빛 */
    --yellow-border: #f2e6cf;
    --green-dot: #2f9461;     /* 정답 */
    --ok-bg: #e8f5ee;
    --white: #ffffff;
    --gray-light: #fbfcfe;    /* 페이지 배경 */
    --surface-2: #f3f6fb;     /* 살짝 눌린 면 (입력창·칩) */
    --gray-mid: #e4e9f2;      /* 헤어라인 구분선 */
    --line-soft: #eef2f8;     /* 더 옅은 구분선 */
    --gray-text: #7c8698;     /* 캡션 그레이 */
    --red: #d1495b;           /* 오답 */
    --no-bg: #fbebed;
    --star: #e8a317;          /* 별 */
    --on-accent: #ffffff;     /* 파랑 버튼 위에 얹히는 글자 */

    --sans: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
            'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
    --serif: var(--sans);        /* 영어도 같은 글꼴로 통일 */
    --shadow: 0 1px 2px rgba(22,35,61,.05), 0 6px 18px -10px rgba(22,35,61,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --navy:#e7ecf5; --navy-light:#a7b2c6; --gray-text:#74809a;
      --gray-light:#10151f; --white:#161d2b; --surface-2:#1d2637;
      --gray-mid:#29334a; --line-soft:#212a3d;
      --accent:#7ea4f5; --navy-soft:#1c2947; --accent-light:#1c2947;
      --yellow:#33260f; --yellow-border:#3f2f14;
      --green-dot:#4fbb84; --ok-bg:#123326; --red:#e8737f; --no-bg:#35181d;
      --star:#f0b73f;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
      --on-accent: #10151f;
  }
  }
:root[data-theme="light"] {
    --navy:#16233d; --navy-light:#46536c; --gray-text:#7c8698;
    --gray-light:#fbfcfe; --white:#ffffff; --surface-2:#f3f6fb;
    --gray-mid:#e4e9f2; --line-soft:#eef2f8;
    --accent:#2f5fd0; --navy-soft:#ecf1fd; --accent-light:#ecf1fd;
    --yellow:#fbf1e2; --yellow-border:#f2e6cf;
    --green-dot:#2f9461; --ok-bg:#e8f5ee; --red:#d1495b; --no-bg:#fbebed;
    --star:#e8a317;
    --shadow:0 1px 2px rgba(22,35,61,.05), 0 6px 18px -10px rgba(22,35,61,.18);
  }
:root[data-theme="sepia"] {
    --navy:#3f3423; --navy-light:#6b5c45; --gray-text:#97866c;
    --gray-light:#f7f1e3; --white:#fdf9f0; --surface-2:#f0e8d6;
    --gray-mid:#e2d7c0; --line-soft:#ece3d1;
    --accent:#2b56a8; --navy-soft:#e6e9f2; --accent-light:#e6e9f2;
    --yellow:#f2e6cf; --yellow-border:#e6d5b4;
    --green-dot:#3f7d54; --ok-bg:#e6efe0; --red:#b2483f; --no-bg:#f4e2dc;
    --star:#c8901c;
    --shadow:0 1px 2px rgba(63,52,35,.06), 0 6px 18px -10px rgba(63,52,35,.22);
  }
:root[data-theme="gray"] {
    --navy:#1f2733; --navy-light:#4a5563; --gray-text:#7d8896;
    --gray-light:#eceff3; --white:#f9fafc; --surface-2:#e4e8ee;
    --gray-mid:#d5dae2; --line-soft:#e2e6ec;
    --accent:#2f5fd0; --navy-soft:#e5ebfa; --accent-light:#e5ebfa;
    --yellow:#f5ecdd; --yellow-border:#e6d9c2;
    --green-dot:#2f9461; --ok-bg:#e3f0e8; --red:#c9455a; --no-bg:#f7e3e6;
    --star:#d49a15;
    --shadow:0 1px 2px rgba(31,39,51,.06), 0 6px 18px -10px rgba(31,39,51,.25);
  }
:root[data-theme="dark"] {
    --navy:#e7ecf5; --navy-light:#a7b2c6; --gray-text:#74809a;
    --gray-light:#10151f; --white:#161d2b; --surface-2:#1d2637;
    --gray-mid:#29334a; --line-soft:#212a3d;
    --accent:#7ea4f5; --navy-soft:#1c2947; --accent-light:#1c2947;
    --yellow:#33260f; --yellow-border:#3f2f14;
    --green-dot:#4fbb84; --ok-bg:#123326; --red:#e8737f; --no-bg:#35181d;
    --star:#f0b73f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
    --on-accent: #10151f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--gray-light);
    color: var(--navy);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* 영어는 세리프로 — 매일 영어와 같은 조판입니다. 기기에 있는 글꼴만 쓰므로
     인터넷이 없어도 처음부터 제대로 보입니다. */
  .word-en, .quiz-word, .example-en, .quiz-example,
  .word-pron, .quiz-pron, .ei-en, .cloze-sentence,
  .quiz-option.en-opt, .spell-input, .spell-mask { font-family: var(--serif); }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ── 앱 껍데기 — 매일 영어와 같은 구성 ── */
  .hd {
    position: sticky; top: 0; z-index: 200;
    background: var(--white); border-bottom: 1px solid var(--gray-mid);
  }
  .hd-in { max-width: 760px; margin: 0 auto; padding: 12px 16px 0; }
  .hd-top { display: flex; align-items: center; gap: 10px; }
  .hd-mark {
    width: 36px; height: 36px; flex: 0 0 auto; border-radius: 11px;
    display: grid; place-items: center; text-decoration: none;
    background: var(--accent); color: var(--on-accent); font-size: 1.05rem; font-weight: 700;
    transition: filter 0.15s;
  }
  .hd-mark:hover { filter: brightness(1.08); }
  .hd-txt { flex: 1; min-width: 0; }
  .hd-t {
    font-size: 1.02rem; font-weight: 800; letter-spacing: -0.4px; color: var(--navy);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hd-s { font-size: 0.7rem; color: var(--navy-light); margin-top: 1px; }
  .hd-btns { display: flex; gap: 4px; flex: 0 0 auto; }
  .ic {
    width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center;
    color: var(--navy-light); border: 1px solid transparent; background: none;
    cursor: pointer; font-family: inherit;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .ic svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .ic:hover { background: var(--surface-2); color: var(--accent); }
  .ic.on { background: var(--navy-soft); color: var(--accent); border-color: var(--accent-light); }

  /* 검색 — 아이콘으로 열고 닫습니다 */
  .search-wrap { max-height: 0; overflow: hidden; transition: max-height 0.22s ease; }
  .search-wrap.open { max-height: 64px; }
  .search {
    width: 100%; margin-top: 10px; padding: 9px 14px;
    background: var(--surface-2); border: 1px solid var(--gray-mid); border-radius: 11px;
    color: var(--navy); font-size: 0.88rem; font-family: inherit; outline: none;
  }
  .search:focus { border-color: var(--accent); background: var(--white); }
  .search::placeholder { color: var(--gray-text); }

  /* 모드 세그먼트 */
  .seg { display: flex; gap: 4px; margin-top: 10px; padding-bottom: 10px; }
  .seg button {
    flex: 1; border-radius: 10px; padding: 8px 4px;
    font-size: 0.8rem; font-weight: 700; color: var(--navy-light);
    background: var(--surface-2); border: 1px solid var(--gray-mid);
    cursor: pointer; font-family: inherit; white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .seg button:hover { color: var(--accent); }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  /* ── DAY 목록 서랍 ── */
  .scrim {
    position: fixed; inset: 0; z-index: 300; background: rgba(10,15,25,0.45);
    opacity: 0; pointer-events: none; transition: opacity 0.22s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; z-index: 310; left: 0; top: 0; bottom: 0; width: 264px; max-width: 84vw;
    background: var(--white); border-right: 1px solid var(--gray-mid);
    display: flex; flex-direction: column;
    transform: translateX(-100%); transition: transform 0.24s cubic-bezier(.32,.72,0,1);
  }
  .drawer.open { transform: none; box-shadow: 0 0 40px rgba(22,35,61,0.18); }
  .drawer-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 12px 10px 18px; border-bottom: 1px solid var(--gray-mid);
    font-size: 0.78rem; font-weight: 800; color: var(--navy-light); letter-spacing: 0.6px;
  }
  .voice-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    padding: 10px 14px; border-top: 1px solid var(--gray-mid);
  }
  .voice-row[hidden] { display: none; }
  .voice-row .lab {
    width: 100%; font-size: 0.7rem; font-weight: 800; color: var(--gray-text);
    letter-spacing: 0.6px; margin-bottom: 2px;
  }
  .voice-row select {
    flex: 1; min-width: 0; padding: 6px 8px; font-family: inherit; font-size: 0.72rem;
    color: var(--navy); background: var(--surface-2);
    border: 1px solid var(--gray-mid); border-radius: 8px;
  }
  .theme-row {
    display: flex; flex-wrap: wrap; gap: 5px;
    padding: 10px 14px; border-top: 1px solid var(--gray-mid);
  }
  .theme-row .lab {
    width: 100%; font-size: 0.7rem; font-weight: 800; color: var(--gray-text);
    letter-spacing: 0.6px; margin-bottom: 2px;
  }
  .theme-row button {
    display: flex; align-items: center; gap: 5px;
    border: 1px solid var(--gray-mid); background: var(--surface-2); color: var(--navy-light);
    border-radius: 8px; padding: 5px 8px; font-size: 0.71rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .theme-row button i { width: 11px; height: 11px; border-radius: 4px; border: 1px solid rgba(125,125,125,.35); }
  .theme-row button.on { border-color: var(--accent); color: var(--accent); background: var(--navy-soft); }
  .drawer-ft { padding: 10px 14px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--gray-mid); }
  .drawer-ft[hidden] { display: none; }
  .drawer-ft button {
    width: 100%; border-radius: 11px; padding: 10px;
    background: var(--accent); border: 1px solid var(--accent); color: var(--on-accent);
    font-size: 0.82rem; font-weight: 800; cursor: pointer; font-family: inherit;
  }
  .drawer-ft button[hidden] { display: none; }
  .sidebar { flex: 1; overflow-y: auto; padding: 8px 0; }
  .sidebar-title { display: none; }
  .day-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 9px 16px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--navy);
    text-align: left;
    transition: background 0.15s;
    line-height: 1.3;
    font-family: inherit;
  }
  .day-btn:hover { background: var(--navy-soft); }
  .day-btn.active { background: var(--navy-soft); color: var(--navy); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
  .day-num {
    background: var(--surface-2);
    color: var(--navy-light);
    font-size: 0.66rem;
    font-weight: 700;
    border: 1px solid var(--gray-mid);
    border-radius: 6px;
    padding: 2px 6px;
    min-width: 30px;
    text-align: center;
  }
  .day-btn.active .day-num { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .day-topic { font-size: 0.73rem; font-weight: 500; color: var(--navy-light); }

  /* ── 하단 독 ── */
  .dock {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 190;
    width: 100%; max-width: 760px;
    display: flex; gap: 6px;
    background: var(--white); border-top: 1px solid var(--gray-mid);
    box-shadow: 0 -8px 24px -18px rgba(22,35,61,0.5);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .dock button {
    flex: 1; border-radius: 11px; padding: 8px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 0.66rem; font-weight: 700; color: var(--navy-light);
    border: 1px solid var(--gray-mid); background: var(--surface-2);
    cursor: pointer; font-family: inherit;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .dock button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .dock button:hover { color: var(--accent); border-color: var(--accent-light); }
  .dock button.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .dock button.pri:hover { filter: brightness(1.06); color: var(--on-accent); }


  /* ── MAIN ── */
  .main { max-width: 760px; margin: 0 auto; padding: 22px 16px calc(88px + env(safe-area-inset-bottom, 0px)); }

  /* ── DAY HEADER ── */
  .day-header {
    background: var(--white);
    color: var(--navy);
    border: 1px solid var(--gray-mid);
    border-left: 3px solid var(--accent);
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 22px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px 18px;
  }
  @media (max-width: 560px) {
    .day-header { grid-template-columns: auto 1fr; }
    .day-info { grid-column: 1 / -1; grid-row: 2; }
    .day-count { justify-self: end; }
  }
  .day-badge {
    background: var(--navy-soft);
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    text-align: center;
    color: var(--accent);
  }
  .day-badge-label { font-size: 0.66rem; letter-spacing: 1.5px; font-weight: 700; opacity: 0.7; }
  .day-badge-num { font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .day-info { flex: 1; }
  .day-story { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.4px; }
  .day-category {
    display: inline-block;
    background: var(--navy-soft);
    color: var(--accent);
    border-radius: 20px;
    padding: 3px 12px;
    font-size: 0.78rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .day-desc { font-size: 0.86rem; color: var(--gray-text); line-height: 1.55; }
  .day-count {
    background: var(--surface-2);
    border: 1px solid var(--gray-mid);
    border-radius: 12px;
    padding: 12px 18px;
    text-align: center;
  }
  .day-count-n { font-size: 1.5rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .day-count-label { font-size: 0.68rem; color: var(--gray-text); font-weight: 600; }

  /* ── PROGRESS BAR ── */
  .progress-bar-wrap {
    background: var(--white);
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  .progress-label { font-size: 0.78rem; color: var(--gray-text); min-width: 70px; }
  .progress-track { flex: 1; height: 8px; background: var(--gray-mid); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s ease; }
  .progress-pct { font-size: 0.76rem; font-weight: 700; color: var(--navy); min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ── VOCAB CARDS ── */
  .vocab-grid { display: flex; flex-direction: column; gap: 16px; }
  .vocab-card {
    background: var(--white);
    border-radius: 14px;
    padding: 20px 22px;
    border: 1px solid var(--gray-mid);
    border-left: 3px solid var(--gray-mid);
    transition: box-shadow 0.2s, border-color 0.2s, transform 0.1s;
    cursor: pointer;
    position: relative;
  }
  .vocab-card:hover { box-shadow: var(--shadow); border-left-color: var(--accent); }
  .vocab-card.done { border-left-color: var(--green-dot); background: var(--ok-bg); }
  .vocab-card.done .word-en { color: var(--green-dot); }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card-left { flex: 1; }
  .word-num { font-size: 0.72rem; font-weight: 700; color: var(--navy-light); margin-bottom: 2px; }
  .word-en {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.25;
    letter-spacing: -0.2px;
  }
  .stars { font-size: 0.85rem; color: var(--star); margin-left: 8px; vertical-align: middle; }
  .word-pron { font-size: 0.95rem; color: var(--navy-light); margin-top: 4px; letter-spacing: 0.2px; }
  .word-pos {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 5px;
    margin-right: 4px;
    margin-top: 4px;
    vertical-align: middle;
  }
  .pos-n { background: var(--surface-2); color: var(--navy-light); border: 1px solid var(--gray-mid); }
  .pos-v { background: var(--surface-2); color: var(--navy-light); border: 1px solid var(--gray-mid); }
  .pos-adj { background: var(--surface-2); color: var(--navy-light); border: 1px solid var(--gray-mid); }
  .pos-adv { background: var(--surface-2); color: var(--navy-light); border: 1px solid var(--gray-mid); }
  .pos-phr { background: var(--surface-2); color: var(--navy-light); border: 1px solid var(--gray-mid); }
  .word-kr { font-size: 1.15rem; font-weight: 700; color: var(--navy); margin-top: 6px; line-height: 1.4; }

  .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .check-btn {
    width: 28px; height: 28px;
    border: 2px solid var(--gray-mid);
    border-radius: 50%;
    background: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .check-btn.checked { background: var(--green-dot); border-color: var(--green-dot); color: var(--on-accent); }

  /* 잠깐 뜨는 안내 */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(8px);
    bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 400;
    background: var(--navy); color: var(--gray-light);
    padding: 10px 16px; border-radius: 11px; font-size: 0.8rem; font-weight: 600;
    max-width: 90vw; text-align: center; line-height: 1.5;

  .result-stat .rs-label { font-size: 0.74rem; color: var(--gray-text); font-weight: 600; }

  .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 18px; }
  .mode-card {
    background: var(--white); border: 1.5px solid var(--gray-mid);
    border-radius: 14px; padding: 16px 16px; cursor: pointer;
    transition: all 0.16s; text-align: left; font-family: inherit;
    display: flex; flex-direction: column; gap: 4px;
  }
  .mode-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
  .mode-card.selected { border-color: var(--accent); background: var(--navy-soft); }
  .mode-card .mc-ico { font-size: 1.5rem; }
  .mode-card .mc-name { font-size: 0.98rem; font-weight: 800; color: var(--navy); }
  .mode-card .mc-desc { font-size: 0.76rem; color: var(--gray-text); line-height: 1.45; }

  .quiz-option.en-opt { font-family: var(--serif); }
  .quiz-meaning-big { font-size: 1.6rem; font-weight: 800; color: var(--navy); margin-bottom: 4px; letter-spacing:-0.3px; }
  .quiz-sub { font-size: 0.9rem; color: var(--gray-text); margin-bottom: 20px; }

  /* 빈칸 채우기 예문 */
  .cloze-sentence {
    font-family: var(--serif);
    font-size: 1.25rem; line-height: 1.7; color: var(--navy);
    margin: 6px auto 22px; max-width: 540px;
  }
  .cloze-blank {
    display: inline-block; min-width: 70px;
    border-bottom: 3px solid var(--accent); color: var(--accent);
    font-weight: 800; text-align: center; padding: 0 6px;
  }

  /* 철자 맞추기 입력 */
  .spell-input {
    width: 100%; max-width: 420px; margin: 4px auto 6px; display: block;
    border: 2px solid var(--gray-mid); border-radius: 12px;
    padding: 14px 18px; font-size: 1.4rem; font-weight: 700;

    font-family: var(--serif);
    transition: border-color 0.15s;
  }
  .spell-input:focus { border-color: var(--accent); }
  .spell-input.correct { border-color: var(--green-dot); background: var(--ok-bg); }
  .spell-input.wrong { border-color: var(--red); background: var(--no-bg); }
  .spell-mask { font-size: 1.1rem; color: var(--gray-text); letter-spacing: 3px; margin-bottom: 14px; font-family: var(--serif); }
  .spell-submit {
    background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent); border-radius: 11px;

  }
  .spell-submit:hover { filter: brightness(1.06); }

  /* 속도전 헤더 */
  .speed-banner {
    max-width: 620px; margin: 0 auto 14px; text-align:center;

  /* scrollbar */
  .sidebar::-webkit-scrollbar, .main::-webkit-scrollbar { width: 5px; }
  .sidebar::-webkit-scrollbar-track, .main::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 3px; }

  {n:14,en:"cater",pron:"[미 kéitər / 영 kéitə]",pos:"v",kr:"(연회 등의) 음식물을 공급하다",ex:"The Stovepipe Grill charges reasonable rates to <b>cater</b> large events.",exkr:"Stovepipe Grill사는 규모가 큰 행사의 음식을 공급하는 데 합리적인 요금을 청구한다.",stars:3},
  {n:15,en:"reservation",pron:"[미 rèzərvéiʃən / 영 rèzəvéiʃən]",pos:"n",kr:"예약, 지정; 보호 구역",ex:"Once you receive confirmation by e-mail, the <b>reservation</b> has been made.",exkr:"확인 이메일을 받으면, 예약이 이루어진 것입니다.",stars:3,tip:"St. Louis has been designated as a <b>reservation</b> for wildlife since 1985. St. Louis는 1985년부터 야생 동물 보호 구역으로 지정되어 왔다.",deriv:"reserve v. 예약하다 / reserved adj. 예약된, 지정의 / booking 예약"},
  {n:16,en:"beverage",pron:"[bévəridʒ]",pos:"n",kr:"음료",ex:"Snacks and <b>beverages</b> are available in the business-class lounge.",exkr:"비즈니스 클래스 라운지에서 간식과 음료를 이용할 수 있다.",stars:3},
  {n:17,en:"confirm",pron:"[미 kənfə́ːrm / 영 kənfə́ːm]",pos:"v",kr:"확인하다",ex:"Please <b>confirm</b> your seating reservation prior to arrival.",exkr:"도착 전에 귀하의 좌석 예약을 확인하세요.",stars:3,tip:"confirm a reservation 예약을 확인하다. confirm은 reservation과 어울려 출제된다. 예약 또는 변경 사항을 확인하다라는 의미로 쓰일 때 confirm은 verify로 바꾸어 쓸 수 있다.",deriv:"confirmation n. 확인 / confirmative adj. 확인의 / verify 확인하다"},
  {n:18,en:"cancel",pron:"[kǽnsəl]",pos:"v",kr:"취소하다",ex:"Those wishing to <b>cancel</b> a booking are asked to do so at least a day in advance.",exkr:"예약을 취소하고 싶은 사람들은 적어도 하루 전에 취소해야 한다.",stars:3},
  {n:19,en:"rate",pron:"[reit]",pos:"n",kr:"요금",ex:"The inn offers fine rooms at affordable <b>rates</b>.",exkr:"그 여관은 좋은 방들을 알맞은 요금에 제공한다.",stars:3,deriv:"v. 평가하다, 여기다 / fee 요금"},
  {n:20,en:"conveniently",pron:"[미 kənvíːnjəntli / 영 kənvíːniəntli]",pos:"adv",kr:"편리하게",ex:"Our hotel is <b>conveniently</b> located in downtown Sydney.",exkr:"우리 호텔은 시드니 중심가에 편리하게 위치해 있습니다.",stars:3,tip:"conveniently + located/placed 편리하게 위치한. conveniently는 located 등 위치와 관련된 단어들과 어울려 주로 출제된다. // conveniently(adv. 편리하게)와 convenient(adj. 편리한)의 품사 구별하기.",deriv:"convenient adj. 편리한 / convenience n. 편리"},
  {n:21,en:"decorate",pron:"[dékərèit]",pos:"v",kr:"장식하다",ex:"The restaurant owner <b>decorated</b> its interior with paintings of Italy.",exkr:"그 식당 주인은 식당 내부를 이탈리아를 그린 그림들로 장식했다.",stars:3,deriv:"decorative adj. 장식의, 장식적인"},
  {n:22,en:"information",pron:"[미 ìnfərméiʃən / 영 ìnfəméiʃən]",pos:"n",kr:"정보, 자료",ex:"Further <b>information</b> about the resort can be found on its Web site.",exkr:"그 리조트에 대한 자세한 정보는 웹사이트에서 찾을 수 있습니다.",stars:3,tip:"additional/further + information 추가/자세한 정보. information은 additional, further 등의 형용사와 어울려 자주 출제된다.",deriv:"inform v. 알리다, 통지하다"},
  {n:23,en:"retain",pron:"[ritéin]",pos:"v",kr:"유지하다, 보유하다",ex:"The cafeteria <b>retains</b> customers by offering inexpensive, flavorful food.",exkr:"그 식당은 저렴하면서도 맛있는 음식을 제공함으로써 고객을 유지한다.",stars:3,deriv:"retention n. 유지, 보유 / maintain 유지하다, 지속하다 / keep 유지하다"},
  {n:24,en:"atmosphere",pron:"[미 ǽtməsfìər / 영 ǽtməsfiə]",pos:"n",kr:"분위기, 환경",ex:"The hotel provides a comfortable <b>atmosphere</b>.",exkr:"그 호텔은 편안한 분위기를 제공한다.",stars:3,deriv:"mood 분위기"},
  {n:25,en:"cuisine",pron:"[kwizíːn]",pos:"n",kr:"(독특한) 요리",ex:"Jacque will prepare an exquisite selection of international <b>cuisine</b>.",exkr:"Jacque는 훌륭하고 엄선된 세계 요리를 준비할 것이다.",stars:3},
  {n:26,en:"sequence",pron:"[síːkwəns]",pos:"n",kr:"순서, 차례",ex:"The head chef makes sure every dinner order is prepared in the correct <b>sequence</b>.",exkr:"수석 주방장은 모든 저녁 식사 주문이 정확한 순서대로 준비되었는지 확인한다.",stars:3,deriv:"v. 차례로 배열하다"},
  {n:27,en:"extensive",pron:"[iksténsiv]",pos:"adj",kr:"광범위한, 넓은",ex:"The restaurant offers an <b>extensive</b> range of Chinese dishes.",exkr:"그 식당은 광범위한 종류의 중국요리를 제공한다.",stars:2,tip:"어떤 일에 필요한 것이나 관련된 것을 모두 포함하다라는 의미로 사용될 때 extensive를 comprehensive로 바꾸어 쓸 수 있다.",deriv:"extend v. 넓히다, 연장하다 / extension n. 연장, 확장 / extended adj. 장기간에 걸친 / extensively adv. 널리 / comprehensive 넓은 / diverse 다양한"},
  {n:28,en:"prior",pron:"[미 práiər / 영 práiə]",pos:"adj",kr:"전의, 먼저의",ex:"<b>Prior</b> to checkout, guests are asked to fill out a survey.",exkr:"체크아웃에 앞서, 투숙객들은 설문 조사를 작성해 달라는 요청을 받는다.",stars:2,tip:"prior to ~에 앞서, 먼저. prior는 to와 같이 쓰여야 전치사 역할을 할 수 있음을 꼭 기억하자.",deriv:"priority n. 우선 사항, 우선(권)"},
  {n:29,en:"book",pron:"[buk]",pos:"v",kr:"예약하다",ex:"The restaurant is busy on weekends, so <b>booking</b> a table is necessary.",exkr:"그 식당은 주말에 붐벼서, 테이블을 예약하는 것은 필수다.",stars:2,deriv:"n. 책, 서적, 도서"},
  {n:30,en:"amenity",pron:"[미 əménəti / 영 əmíːniti]",pos:"n",kr:"편의 시설",ex:"The hotel <b>amenities</b> include a health center and a swimming pool.",exkr:"그 호텔의 편의 시설은 보건소와 수영장을 포함한다.",stars:2},
  {n:31,en:"belongings",pron:"[미 bilɔ́ːŋiŋz / 영 bilɔ́ŋiŋz]",pos:"n",kr:"소지품, 소유물",ex:"Safety boxes are available in every room for the storage of valuable <b>belongings</b>.",exkr:"귀중품 보관을 위해 모든 방에서 귀중품 보관함을 이용하실 수 있습니다.",stars:2},
  {n:32,en:"entirely",pron:"[미 intáiərli / 영 intáiəli]",pos:"adv",kr:"완전히",ex:"The Eatery is known to cook <b>entirely</b> with organic produce.",exkr:"Eatery사는 완전히 유기농 농작물로만 조리하는 것으로 알려져 있다.",stars:2,deriv:"entire adj. 전체의"},
  {n:33,en:"ease",pron:"[iːz]",pos:"v",kr:"완화시키다",ex:"Jennifer <b>eased</b> the temperature of the oven to avoid burning her dish.",exkr:"Jennifer는 요리를 태우지 않기 위해 오븐의 온도를 완화시켰다.",stars:2,tip:"n. 쉬움, 용이함. Customers appreciate the <b>ease</b> with which they can make reservations online. 고객들은 그들이 온라인으로 예약을 쉽게 할 수 있다는 점을 높이 평가한다.",deriv:"easy adj. 쉬운, 편안한 / easily adv. 쉽게, 용이하게"},
  {n:34,en:"ingredient",pron:"[ingríːdiənt]",pos:"n",kr:"재료, 성분",ex:"The chef shops for fresh <b>ingredients</b> each morning at the local market.",exkr:"그 요리사는 매일 아침 현지 시장에서 신선한 재료들을 산다.",stars:2},
  {n:35,en:"sip",pron:"[sip]",pos:"v",kr:"음미하며 마시다, 홀짝거리다",ex:"<b>Sip</b> your beverages at the café's new outdoor area!",exkr:"카페의 새로운 야외 공간에서 음료를 음미하세요!",stars:2},
  {n:36,en:"stir",pron:"[미 stəːr / 영 stəː]",pos:"v",kr:"휘젓다, 뒤섞다",ex:"<b>Stir</b> the sauce to prevent it from sticking.",exkr:"소스가 달라붙는 것을 방지하기 위해 휘저어 주세요.",stars:1},
  {n:37,en:"choice",pron:"[tʃɔis]",pos:"n",kr:"선택물, 선택 사항, 선택",ex:"Today's special comes with the <b>choice</b> of soup or a salad.",exkr:"오늘의 특선 메뉴는 수프나 샐러드 중 선택하신 것과 함께 제공됩니다.",stars:1,tip:"choice : option '선택'을 의미하는 단어들의 용례 차이를 구별하는 문제로 출제된다. choice 선택물, 선택(choice는 여러 가지 중에서 선택된 사람이나 물건을 뜻한다) / option 선택권, 선택(여러 가지 중에 가능한 선택 사항을 의미한다). Diners have the <b>option</b> of eating at the bar. 식사하시는 분들은 바에서 드실 수 있는 선택권이 있습니다.",deriv:"choose v. 선택하다"},
  {n:38,en:"complication",pron:"[미 kɑ̀mpləkéiʃən / 영 kɔ̀mplikéiʃən]",pos:"n",kr:"복잡한 문제",ex:"We encountered several <b>complications</b> with our reservation.",exkr:"우리는 예약과 관련해 몇몇 복잡한 문제에 맞닥뜨렸다.",stars:1,deriv:"complicate v. 복잡하게 하다"},
  {n:39,en:"freshness",pron:"[미 fréʃnis / 영 fréʃnəs]",pos:"n",kr:"신선함",ex:"Wrapping produce in paper helps prolong its <b>freshness</b>.",exkr:"농산물을 종이로 포장해 두면 신선함을 오래 지속시켜 준다.",stars:1,tip:"freshness 신선함 : refreshment 원기 회복, (-s) 다과. 형태가 유사하지만 뜻이 다른 두 단어를 구별해야 한다. refreshment는 단수, 복수형이 각각 다른 뜻으로 쓰인다는 것에도 유의해 두자. Snacks and liquid <b>refreshments</b> are sold at the kiosk. 매점에서 간식과 음료 다과가 판매된다.",deriv:"fresh adj. 신선한, (아이디어 등이) 참신한"},
  {n:40,en:"occupancy",pron:"[미 ɑ́kjupənsi / 영 ɔ́kjupənsi]",pos:"n",kr:"(호텔 등의) 이용률",ex:"The ski resort's <b>occupancy</b> peaks in January.",exkr:"그 스키 리조트의 이용률은 1월에 최고조에 달한다.",stars:1,deriv:"occupy v. 점유하다 / occupant n. 점유자, 입차인 / occupation n. 점유; 직업"},
  {n:41,en:"spot",pron:"[미 spɑːt / 영 spɔt]",pos:"v",kr:"발견하다, 찾다, 알아채다",ex:"When preparing to pay for the meal, Marie <b>spotted</b> a mistake on the bill.",exkr:"식사비를 지불할 준비를 할 때, Marie는 계산서에서 오류를 발견했다.",stars:1,tip:"n. (특정한) 장소. Midland Park is a good <b>spot</b> for a company picnic. Midland 공원은 회사 야유회에 좋은 장소이다. // 알아내기 쉽지 않은 것을 알아챈다는 의미로 쓰일 때 spot은 notice로 바꾸어 쓸 수 있다.",deriv:"notice 알아차리다"}

    words:[
  {n:1,en:"decline",pron:"[dikláin]",pos:"n",kr:"감소, 하락",ex:"A sharp <b>decline</b> in the number of buyers has lowered this year's profits.",exkr:"구매자 수의 급격한 감소가 금년도 수익을 떨어뜨렸다.",stars:3,tip:"v. (초대·신청을) 거절하다; 감소하다, 줄다 — The investor <b>declined</b> our invitation to lunch. 그 투자자는 우리의 점심 식사 초대를 거절했다. / The sales rate <b>declined</b> in recent years due to the recession. 경기 침체로 최근 몇 년간 판매율이 감소했다. // the rate of decline 감소율 / decline in ~의 감소. 명사 decline과 함께 쓰이는 전치사 in을 묻는 문제가 출제된다.",deriv:"decrease, reduction 감소 / reject 거절하다"},
  {n:2,en:"markedly",pron:"[미 má:rkidli / 영 má:kidli]",pos:"adv",kr:"현저하게, 눈에 띄게",ex:"Corporate profits continue to increase <b>markedly</b>.",exkr:"기업 이윤이 계속해서 현저하게 증가하고 있다.",stars:1,deriv:"marked adj. 현저한, 두드러진"},

  {n:5,en:"projection",pron:"[prədʒékʃən]",pos:"n",kr:"예상(치)",ex:"This month's income <b>projections</b> are higher than last month's were.",exkr:"이번 달 수입 예상치는 지난달 것보다 높다.",stars:3,tip:"spending and income projections 지출 및 수입 예상치. projection의 출제 표현을 익혀 두자.",deriv:"project v. 추정하다 / estimate 견적, 추정"},
  {n:6,en:"substantial",pron:"[səbstǽnʃəl]",pos:"adj",kr:"상당한",ex:"The company made <b>substantial</b> investments in several emerging markets.",exkr:"그 회사는 몇몇 신흥 시장에 상당한 투자를 했다.",stars:3,tip:"substantial + amount/increase/reduction 상당한 양/증가/감소. substantial은 amount, increase, reduction 등 양이나 증감과 관련된 명사와 자주 어울려 출제된다. // 양, 크기, 정도 등이 상당하여 주목할 만하다는 문맥일 때 substantial은 considerable로 바꾸어 쓸 수 있다.",deriv:"substantially adv. 상당히 / considerable 상당한"},
  {n:7,en:"anticipate",pron:"[미 æntísəpèit / 영 æntísipeit]",pos:"v",kr:"예상하다, 기대하다",ex:"We <b>anticipate</b> a 40 percent increase in sales next year.",exkr:"우리는 내년에 40퍼센트의 매출 증대를 예상한다.",stars:3,tip:"anticipate : hope — '기대하다'를 뜻하는 단어들의 용례 차이를 구별하는 문제로 출제된다. anticipate ~을 기대하다(전치사 없이 바로 목적어가 온다) / hope for ~을 바라다(hope는 전치사 for가 있어야 명사가 목적어로 올 수 있다). The financiers <b>hope for</b> a high return on their investment. 자본가들은 그들의 투자에 대한 높은 수익을 바란다. // 어떤 일이 일어나기를 기대하는 의미로 쓰일 때 anticipate는 expect로 바꾸어 쓸 수 있다.",deriv:"anticipation n. 예상, 기대 / expect 예상하다, 기대하다"},

  {n:9,en:"estimate",pron:"v. [미 éstəmèit / 영 éstimeit] / n. [미 éstəmət / 영 éstimət]",pos:"v",kr:"추정하다, 추산하다",ex:"The laptops were <b>estimated</b> to bring in over $50 million.",exkr:"그 노트북 컴퓨터는 5천만 달러 이상의 이익을 가져올 것으로 추정되었다.",stars:3,tip:"n. 추정(치), 추산 — Profits for the second quarter failed to meet <b>estimates</b> made in April. 2사분기 수익은 4월에 세운 추정치에 이르지 못했다."},

  {n:14,en:"impressive",pron:"[imprésiv]",pos:"adj",kr:"굉장한, 인상적인",ex:"NeuWear made <b>impressive</b> gains in the sportswear market.",exkr:"NeuWear사는 스포츠웨어 시장에서 굉장한 이익을 거두었다.",stars:3,tip:"impressive 인상적인 : impressed 감명을 받은 — impressive는 사람이나 사물이 인상적일 때, impressed는 사람이 무언가에 감명을 받았을 때 사용한다. 혼동하지 않도록 차이를 구별해 두자. // impressive(adj. 인상적인)와 impression(n. 인상)의 품사 구별하기.",deriv:"impressed adj. 감명을 받은 / impression n. 인상 / impress v. ~에게 인상을 주다 / impressively adv. 인상 깊게"},
  {n:15,en:"representative",pron:"[미 rèprizéntətiv]",pos:"n",kr:"직원, 외판원; 대표자",ex:"The sales <b>representative</b> developed an impressive client base.",exkr:"그 영업 사원은 굉장한 고객 기반을 구축했다.",stars:3,tip:"adj. 대표하는, 대리의 // The committee will be comprised of <b>representatives</b> from each division. 위원회는 각 부서의 대표자들로 구성될 것이다. // sales representative 영업 사원. representative는 sales와 자주 어울려 출제된다. // representative(n. 직원; 대표)와 represent(v. ~을 대표하다)의 품사 구별하기.",deriv:"represent v. ~을 대표하다"},

  {n:19,en:"employer",pron:"[미 implɔ́iər / 영 implɔ́iə]",pos:"n",kr:"고용주",ex:"The largest <b>employer</b> in the city is the automotive factory.",exkr:"그 도시의 최대 고용주는 자동차 공장이다.",stars:3},
  {n:20,en:"regular",pron:"[미 régjulər / 영 régjulə]",pos:"adj",kr:"정기적인; 단골의",ex:"<b>Regular</b> assessments of profitability occur throughout the fiscal year.",exkr:"정기적인 수익성 평가가 회계 연도 내내 이루어진다.",stars:3,tip:"Special events were held to reward <b>regular</b> customers. 단골 고객들에게 보답하기 위한 특별 행사들이 개최되었다. // regular + meeting/schedule/assessment 정기 회의/스케줄/평가. regular는 정기적으로 발생하는 meeting, schedule, assessment 등과 주로 어울려 출제된다. // regular(adj. 정기적인)와 regularly(adv. 정기적으로)의 품사 구별하기.",deriv:"regularly adv. 정기적으로 / irregular 불규칙한, 고르지 못한"},

  {n:23,en:"whole",pron:"[미 houl / 영 həul]",pos:"adj",kr:"전체의, 온전한",ex:"The <b>whole</b> amount of the loan must be paid in 60 days.",exkr:"대출금 전액은 60일 내로 상환해야 한다.",stars:3},

  {n:25,en:"figure",pron:"[미 fígjər / 영 fígə]",pos:"n",kr:"총액, 합계 수",ex:"Last quarter's sales <b>figures</b> need to be sent to the main office.",exkr:"지난 분기 매출 총액은 본사로 보내져야 한다.",stars:2,tip:"v. ~라고 여기다 // figure : digit — '수'를 의미하는 단어들의 용례 차이를 구별하는 문제로 출제된다. figure 수량(수치로 나타낸 양, 특히 통계치를 뜻한다) / digit 숫자(0에서 9까지의 숫자를 의미한다). The number 215 contains three <b>digits</b>. 숫자 215는 세 개의 숫자로 이루어져 있다.",deriv:"number 수"},

  {n:27,en:"frequent",pron:"[frí:kwənt]",pos:"adj",kr:"빈번한, 잦은",ex:"The company was able to adapt quickly despite <b>frequent</b> market changes.",exkr:"그 회사는 빈번한 시장 변화에도 불구하고 재빨리 적응할 수 있었다.",stars:2},
  {n:28,en:"achieve",pron:"[ətʃí:v]",pos:"v",kr:"달성하다, 성취하다",ex:"The corporation <b>achieved</b> its sales goals for the year.",exkr:"그 기업은 금년도 매출 목표를 달성했다.",stars:2,deriv:"achievement n. 달성, 성취 / achiever n. 달성자, 우수자 / reach 이루다, 도달하다"},
  {n:29,en:"assumption",pron:"[əsʌ́mpʃən]",pos:"n",kr:"추정, 산정",ex:"DonCo's <b>assumption</b> that consumers value quality over price proved correct.",exkr:"소비자들이 가격보다 품질을 중시한다는 DonCo사의 추정은 옳은 것으로 밝혀졌다.",stars:2},
  {n:30,en:"share",pron:"[미 ʃɛər / 영 ʃeə]",pos:"v",kr:"공유하다, 함께 쓰다; (생각·경험·감정을 남과) 함께 나누다",ex:"The CEO <b>shared</b> some excess profits with employees through bonuses.",exkr:"그 최고 경영자는 상여금을 통해 직원들과 초과 수익의 일부를 공유했다.",stars:2,tip:"n. 몫, 지분 — Each partner will receive an equal <b>share</b> of profits from the sale of the company. 각 동업자는 회사의 매각으로 인한 이익의 균등한 몫을 받을 것이다.",deriv:"discuss 상의하다"},
  {n:31,en:"encouraging",pron:"[미 inkɔ́:ridʒiŋ / 영 inkʌ́ridʒiŋ]",pos:"adj",kr:"고무적인, 힘을 북돋아 주는",ex:"The figures for this quarter were <b>encouraging</b>.",exkr:"이번 분기의 수치는 고무적이었다.",stars:2,tip:"encouragement(n. 격려)와 encourage(v. 격려하다)의 품사 구별하기.",deriv:"encourage v. 격려하다 / encouragement n. 격려 / discouraging 낙담시키는"},
  {n:32,en:"incur",pron:"[미 inkɔ́:r / 영 inkɔ́:]",pos:"v",kr:"(손실을) 입다, (빚을) 지다",ex:"We have <b>incurred</b> significant operating losses since our inception a decade ago.",exkr:"우리는 10년 전 개업한 이래 심각한 운영 손실을 입어 왔다.",stars:2,deriv:"incurrence n. (손해 따위를) 입음"},
  {n:33,en:"slightly",pron:"[sláitli]",pos:"adv",kr:"약간",ex:"Inquiries regarding purchases are expected to decrease <b>slightly</b>.",exkr:"구매에 관한 문의가 약간 감소할 것으로 예상된다.",stars:2,tip:"slightly(adv. 약간)와 slight(adj. 약간의)의 품사 구별하기.",deriv:"slight adj. 약간의"},
  {n:34,en:"profit",pron:"[미 práfit / 영 prɔ́fit]",pos:"n",kr:"수익, 이익",ex:"The <b>profits</b> from the auction will go to charity.",exkr:"경매 수익은 자선 단체로 보내질 것이다.",stars:2,deriv:"profitable adj. 이윤이 많은(= lucrative) / profitability n. 수익성"},

  {n:37,en:"inaccurate",pron:"[inǽkjurət]",pos:"adj",kr:"부정확한",ex:"The calculations in the report were <b>inaccurate</b>.",exkr:"보고서의 계산은 부정확했다.",stars:1,tip:"inaccurate information 부정확한 정보. inaccurate는 명사 information과 자주 어울려 출제된다.",deriv:"accurate 정확한"},
  {n:38,en:"percentage",pron:"[미 pərséntidʒ / 영 pəséntidʒ]",pos:"n",kr:"비율, 백분율",ex:"The <b>percentage</b> of people buying digital music players has decreased somewhat.",exkr:"디지털 음악 재생기를 구매하는 사람의 비율이 다소 감소했다.",stars:1,tip:"percentage : percent — '백분율'을 의미하는 단어들의 용례 차이를 구별하는 문제로 출제된다. percentage 백분율(수사와 함께 쓰지 못하므로 10 percentage는 틀린 표현이다) / percent 퍼센트, 백분율(수사와 함께 사용할 수 있다). The company sold 10 <b>percent</b> more oats than in the previous month. 그 회사는 지난달보다 10퍼센트 더 많은 귀리를 판매했다."},
  {n:39,en:"reduce",pron:"[ridjú:s]",pos:"v",kr:"줄이다, 감소시키다",ex:"Management <b>reduced</b> the travel budget in an effort to cut costs.",exkr:"경영진은 비용을 절감하고자 출장 예산을 줄였다.",stars:1,tip:"reduce + costs/budget 비용/예산을 줄이다. reduce는 cost, budget 등 비용을 나타내는 명사들과 어울려 출제된다. // reduce : dispose — '없애다'를 의미하는 단어들의 용례 차이를 구별하는 문제로 출제된다. reduce 줄이다, 감소시키다(줄여서 없애는 것을 말할 때 쓴다) / dispose of ~을 처분하다, 치우다(dispose는 전치사 of가 있어야 폐기할 것을 처리하여 없앤다는 의미가 된다). The company <b>disposed of</b> old equipment it no longer needed. 그 회사는 더 이상 필요하지 않은 오래된 장비들을 처분했다.",deriv:"reduction n. 감소 / reductive adj. 감소하는 / diminish, decrease 줄이다, 감소시키다"},
  {n:40,en:"tend",pron:"[tend]",pos:"v",kr:"~하는 경향이 있다, ~하기 쉽다",ex:"Corporate profits <b>tend</b> to rise in line with national income.",exkr:"회사 수익은 국민 소득과 함께 증가하는 경향이 있다.",stars:1,tip:"tend to do ~하는 경향이 있다. tend는 to부정사와 주로 함께 사용된다.",deriv:"tendency n. 경향"},
  {n:41,en:"beyond",pron:"[미 bijá:nd / 영 bijɔ́nd]",pos:"prep",kr:"~을 넘어서, ~이상으로",ex:"The monthly sales figures were far <b>beyond</b> the company's expectations.",exkr:"월 매출액은 회사의 예상을 훨씬 넘어섰다.",stars:1},

  {n:6,en:"deficit",pron:"[미 défəsit / 영 défisit]",pos:"n",kr:"적자, 부족액",ex:"Reserve funds will be used to make up for the <b>deficit</b>.",exkr:"예비 자금이 적자를 만회하기 위해 사용될 것이다.",stars:1,deriv:"shortfall 부족액 / surplus 흑자, 잉여금"},
  {n:7,en:"recently",pron:"[rí:sntli]",pos:"adv",kr:"최근에",ex:"Bookkeeping costs have <b>recently</b> risen considerably.",exkr:"부기 비용이 최근에 상당히 증가했다.",stars:3,tip:"have + recently + p.p. 최근에 ~했다. recently는 최근의 동향을 말할 때 쓰이므로 주로 현재 완료 시제와 어울려 시험에 출제된다.",deriv:"recent adj. 최근의 / lately 최근에"},
  {n:8,en:"substantially",pron:"[səbstǽnʃəli]",pos:"adv",kr:"크게, 상당히",ex:"The marketing team was <b>substantially</b> expanded to help boost sales.",exkr:"마케팅팀은 판매 증대에 도움이 되도록 크게 확장되었다.",stars:3,tip:"substantially + expand/exceed 크게 확장하다/초과하다. substantially는 expand, exceed 등 팽창과 관련된 동사들과 주로 함께 사용된다. // 수치의 증감이 크다는 문맥일 때 substantially는 significantly 또는 considerably로 바꾸어 쓸 수 있다.",deriv:"substantial adj. 상당한 / substance n. 물질, 실질 / significantly, considerably 상당히"},
  {n:9,en:"committee",pron:"[kəmíti]",pos:"n",kr:"위원회",ex:"The <b>committee</b> submitted a report on donations.",exkr:"위원회가 기부금에 관한 보고서를 제출했다.",stars:3},
  {n:10,en:"frequently",pron:"[frí:kwəntli]",pos:"adv",kr:"자주, 흔히",ex:"Clients who <b>frequently</b> pay on time may receive favorable terms.",exkr:"자주 돈을 제때 납부하는 고객들은 유리한 조건을 제공받을 수 있다.",stars:3},
  {n:11,en:"capability",pron:"[미 kèipəbíləti / 영 kèipəbíliti]",pos:"n",kr:"능력, 역량",ex:"The firm has the <b>capability</b> to advise clients on a range of financial decisions.",exkr:"그 회사는 다양한 재정적인 결정에 대해 고객에게 조언할 능력이 있다.",stars:3},
  {n:12,en:"proceeds",pron:"[미 próusi:dz / 영 prɔ́usi:dz]",pos:"n",kr:"수익금",ex:"All <b>proceeds</b> from the auction will go to local charities.",exkr:"경매의 모든 수익금은 지역 자선 단체로 보내질 것이다.",stars:3},
  {n:13,en:"reimburse",pron:"[미 rì:imbɔ́:rs / 영 rì:imbɔ́:s]",pos:"v",kr:"변제하다, 상환하다",ex:"The company will fully <b>reimburse</b> any travel expenses incurred.",exkr:"회사가 지출된 모든 여행 경비를 전액 변제할 것이다.",stars:3,tip:"reimburse 비용 (비용)을 변제하다 / reimburse 사람 for 비용 (사람)에게 (비용)을 변제하다. reimburse는 '~을 변제하다', '~에게 변제하다'라는 뜻을 모두 갖고 있으므로 목적어 자리에 비용과 사람이 모두 올 수 있다. // reimburse : reward : compensate — '보상하다'를 뜻하는 단어들의 용례 차이를 구별하는 문제로 출제된다. reimburse 변제하다(미리 돈을 사용하고 후에 다시 돌려받는 것을 뜻한다) / reward 보답하다(좋은 일을 한 사람에게 그에 대해 보답하는 것을 의미한다) / compensate 보상하다(손실에 대해 보상하는 경우에 사용한다).",deriv:"reimbursement n. 변제, 상환"},
  {n:14,en:"considerably",pron:"[kənsídərəbli]",pos:"adv",kr:"상당히, 많이",ex:"The new software program makes computing taxes <b>considerably</b> easier.",exkr:"새 소프트웨어는 세금 산출을 상당히 더 쉽게 해준다.",stars:3},
  {n:15,en:"adequate",pron:"[미 ǽdikwət / 영 ǽdəkwət]",pos:"adj",kr:"충분한, 적절한",ex:"Pelton Manufacturing lacks <b>adequate</b> funds for the purchase of new equipment.",exkr:"Pelton Manufacturing사는 새로운 장비를 구입할 충분한 자금이 없다.",stars:3,deriv:"adequacy n. 적절함, 타당 / adequately adv. 충분히, 적절히"},
  {n:16,en:"total",pron:"[미 tóutl / 영 tɔ́utl]",pos:"adj",kr:"총계의, 전부의",ex:"<b>Total</b> revenues for the year have yet to be added up.",exkr:"연간 총수입이 아직 합산되지 않았다.",stars:3,tip:"n. 합계, 총액 / v. 합산하다, 총계가 ~이 되다 // total(adj. 총계의)과 totally(adv. 전적으로)의 품사 구별하기.",deriv:"totally adv. 전적으로, 아주"},
  {n:17,en:"allocate",pron:"[ǽləkèit]",pos:"v",kr:"할당하다, 배분하다",ex:"Funds were <b>allocated</b> for the charity benefit.",exkr:"자선 행사를 위해 자금이 할당되었다.",stars:3,tip:"allocate A for B B를 위해 A를 할당하다 / allocate A to B A를 B에게 배분하다. allocate와 함께 쓰이는 전치사 for 뒤에는 '사용 목적'이, to 뒤에는 '사람'이 온다는 것을 함께 알아 두자. // 자원이나 업무를 나누어 배정하다라는 의미일 때 allocate는 assign으로 바꾸어 쓸 수 있다.",deriv:"allocation n. 배당, 배급 / assign 할당하다"},
  {n:18,en:"inspector",pron:"[미 inspéktər / 영 inspéktə]",pos:"n",kr:"조사관, 감독관",ex:"The <b>inspector</b> reviewed all the receipts submitted last year.",exkr:"그 조사관은 작년에 제출된 모든 영수증을 검토했다.",stars:3},
  {n:19,en:"preferred",pron:"[미 prifɔ́:rd / 영 prifɔ́:d]",pos:"adj",kr:"선호되는, 우선의",ex:"Our <b>preferred</b> method of online payment is through Pay Safe.",exkr:"우리가 선호하는 온라인 지불 방법은 Pay Safe를 통하는 것이다.",stars:3,tip:"1. preferred + means/method 선호하는 수단/방법. preferred는 보통 means, method 등 수단을 의미하는 명사와 자주 어울려 출제된다. 2. prefer A to B B보다 A를 선호하다. 동사 prefer와 함께 쓰이는 전치사 to를 묶어서 외워 두자.",deriv:"prefer v. 선호하다 / preference n. 선호"},
  {n:20,en:"quarter",pron:"[미 kwɔ́:rtər / 영 kwɔ́:tə]",pos:"n",kr:"사분기; 4분의 1",ex:"Profits this <b>quarter</b> are 20 percent higher than the last one.",exkr:"이번 분기의 수익은 지난 분기보다 20퍼센트 더 높다.",stars:2,tip:"Expenses dropped by a <b>quarter</b> after Milton Autos changed suppliers. Milton Autos사가 공급업체를 바꾼 후 지출이 4분의 1만큼 줄었다.",deriv:"quarterly adj. 분기별의, 연 4회의, adv. 분기별로"},
  {n:21,en:"interrupt",pron:"[intərʌ́pt]",pos:"v",kr:"중단시키다, 방해하다",ex:"Poor cash management forced the company to <b>interrupt</b> payments to its contractors.",exkr:"형편없는 현금 관리로 인해 회사는 하청업체에 지불을 중단할 수밖에 없었다.",stars:2},
  {n:22,en:"browse",pron:"[brauz]",pos:"v",kr:"훑어보다, 둘러보다",ex:"Investors may <b>browse</b> through the firm's financial statements before making a decision.",exkr:"투자자들은 결정을 내리기 전에 회사의 재무제표를 훑어봐도 된다.",stars:2},
  {n:23,en:"prompt",pron:"[미 prampt / 영 prɔmpt]",pos:"adj",kr:"즉각적인; 신속한",ex:"The CEO demanded a <b>prompt</b> response to her questions about the budget.",exkr:"그 최고 경영자는 예산에 대한 질문에 즉각적인 답변을 요구했다.",stars:2,tip:"Sheffing Co. was <b>prompt</b> in paying its bill. Sheffing사는 어음을 결제하는 데 있어 신속했다. // v. 촉발하다, 유도하다 — Mark's success at buying stocks <b>prompted</b> interest from other investors. Mark의 주식 매매 성공은 다른 투자자들의 관심을 촉발했다."},
  {n:24,en:"deduct",pron:"[didʌ́kt]",pos:"v",kr:"공제하다, 빼다",ex:"Michael <b>deducted</b> his business expenses from his gross income.",exkr:"Michael은 자신의 총수입에서 업무 경비를 공제했다.",stars:2,deriv:"deduction n. 공제"},
  {n:25,en:"measurement",pron:"[미 méʒərmənt / 영 méʒəmənt]",pos:"n",kr:"측정, 측량; 치수",ex:"Close <b>measurement</b> of the company's operating expenses helped the accountants spot inefficiencies.",exkr:"회사 운영비의 철저한 측정은 회계사들이 비능률을 찾는 데 도움이 되었다.",stars:2},
  {n:26,en:"shorten",pron:"[미 ʃɔ́:rtn / 영 ʃɔ́:tn]",pos:"v",kr:"단축하다, 짧게 하다",ex:"Tracking expenses online <b>shortens</b> the time needed to calculate expenditures.",exkr:"온라인상으로 지출을 추적하는 것은 비용을 계산하는 데 필요한 시간을 단축한다.",stars:2,tip:"To improve its cash position, the firm <b>shortened</b> its payment terms to 30 days. 현금 유동성을 향상시키기 위해, 그 회사는 결제 기한을 30일로 단축했다."},
  {n:27,en:"amend",pron:"[əménd]",pos:"v",kr:"수정하다",ex:"Ms. Ford <b>amended</b> the budget to account for the increased prices of goods.",exkr:"Ms. Ford는 인상된 물품 가격을 설명하기 위해 예산안을 수정했다.",stars:2,tip:"문서의 항목 등을 수정하다라는 의미로 쓰일 때 amend는 revise 또는 modify로 바꾸어 쓸 수 있다.",deriv:"amendment n. 개정, 수정 / amendable adj. 수정할 수 있는 / revise, modify 수정하다"},
  {n:28,en:"calculate",pron:"[kǽlkjulèit]",pos:"v",kr:"계산하다, 산출하다",ex:"The contractors <b>calculated</b> the cost of rebuilding to be around $2 million.",exkr:"하청업체들은 재건 비용을 약 2백만 달러로 계산했다.",stars:2,deriv:"calculation n. 계산"},
  {n:29,en:"exempt",pron:"[igzémpt]",pos:"adj",kr:"면제된, ~이 없는",ex:"Certain goods are <b>exempt</b> from import taxes.",exkr:"특정 물품들은 수입세를 면제받는다.",stars:2,tip:"be exempt from ~을 면제받다. exempt는 주로 전치사 from과 함께 어울려 사용됨을 알아 두자.",deriv:"exemption n. 면제"},
  {n:30,en:"deficient",pron:"[difíʃənt]",pos:"adj",kr:"부족한, 불충분한",ex:"Funding for the office renovations is <b>deficient</b>.",exkr:"사무실 개조 자금이 부족하다.",stars:2,deriv:"deficiency n. 부족 / sufficient 충분한"},
  {n:31,en:"compare",pron:"[미 kəmpɛ́ər / 영 kəmpéə]",pos:"v",kr:"비교하다",ex:"This software automatically <b>compares</b> profits for each year in a chart.",exkr:"이 소프트웨어는 표에 있는 연간 수익금을 자동적으로 비교한다.",stars:2,tip:"compared to ~와 비교해서 / compare A with B A를 B와 비교하다. compare는 숙어인 compared to나 compare A with B 형태로 출제된다.",deriv:"comparison n. 비교 / comparable adj. 필적하는, 비길 만한"},
  {n:32,en:"fortunate",pron:"[미 fɔ́:rtʃənət / 영 fɔ́:tʃənət]",pos:"adj",kr:"운 좋은",ex:"Some stockholders were <b>fortunate</b> to invest in the company early.",exkr:"몇몇 주주들은 운 좋게 그 회사에 일찍 투자할 수 있었다.",stars:2,deriv:"fortunately adv. 다행히, 운 좋게도"},
  {n:33,en:"expenditure",pron:"[미 ikspénditʃər / 영 ikspénditʃə]",pos:"n",kr:"지출, 비용",ex:"This month's sales outweigh <b>expenditures</b>.",exkr:"이달 매출은 지출보다 훨씬 많다.",stars:1,tip:"지출 비용을 의미할 때 expenditure는 expense로 바꾸어 쓸 수 있다.",deriv:"expend v. 지출하다 / expense 지출, 비용 / income, revenue 수입"},
  {n:34,en:"accurately",pron:"[ǽkjurətli]",pos:"adv",kr:"정확하게",ex:"To prevent later confusion, record transactions <b>accurately</b>.",exkr:"추후의 혼동을 예방하기 위해, 거래를 정확히 기록하세요.",stars:1,tip:"accurately : assuredly — '틀림없이'를 의미하는 단어들의 용례 차이를 구별하는 문제로 출제된다. accurately 정확하게(세부적인 일에 있어서 명확하고 옳다는 뜻이다) / assuredly 틀림없이, 확실히(의심할 여지없이 확실하다는 의미이다). Launching a Web site will <b>assuredly</b> increase your customer base. 웹사이트를 개설하면 틀림없이 귀사의 고객층이 늘어날 것입니다.",deriv:"accurate adj. 정확한 / accuracy n. 정확성 / inaccurately 부정확하게"},
  {n:35,en:"worth",pron:"[미 wəːrθ / 영 wəːθ]",pos:"adj",kr:"~의 가치가 있는",ex:"It is <b>worth</b> the cost to upgrade our machinery.",exkr:"기계를 업그레이드하는 것은 비용만큼의 가치가 있다.",stars:1,tip:"n. (얼마) 어치, 가치 — $200,000 <b>worth</b> of inventory was added last month alone. 지난달에만 20만 달러어치의 재고가 추가되었다. // worth + 비용 ~의 가치가 있는 / worth -ing ~할 가치가 있는. 형용사 worth는 뒤에 금액을 나타내는 명사나 동명사가 오는 형태로 주로 사용된다. // worth : value — '가치'를 뜻하는 단어들의 용례 차이를 구별하는 문제로 출제된다. worth 가치, (얼마)어치 / value 가격, 가치.",deriv:"worthy adj. 가치 있는 / worthwhile adj. ~할 가치가 있는"},
  {n:36,en:"excess",pron:"[ékses]",pos:"n",kr:"초과, 초과량",ex:"Spending controls led to an <b>excess</b> of funds.",exkr:"지출 억제는 자금의 초과로 이어졌다.",stars:1,tip:"in excess of ~을 초과하여. excess는 숙어인 in excess of 형태로 출제되므로 꼭 기억해 두자.",deriv:"exceed v. 초과하다 / excessive adj. 과도한 / excessively adv. 매우 / shortage 부족, 부족량"},
  {n:37,en:"fiscal",pron:"[fískəl]",pos:"adj",kr:"회계의, 재정상의",ex:"Results for the past <b>fiscal</b> year will be announced in August.",exkr:"지난 회계 연도의 성과는 8월에 발표될 것이다.",stars:1,tip:"fiscal year 회계 연도 / fiscal operations 회계 업무. fiscal year는 예산 편성, 집행 및 결산을 하기 위해 회계상으로 설정해 놓은 한 해의 기간을 뜻한다."},
  {n:38,en:"incidental",pron:"[미 ìnsədéntl / 영 ìnsidéntl]",pos:"adj",kr:"부수적인",ex:"Total all <b>incidental</b> expenses for the journey and submit the form to accounting.",exkr:"여행 중에 발생한 모든 부대 비용을 합산해서 해당 서식을 경리과에 제출하세요.",stars:1,tip:"incidental expenses 부대 비용. incidental expenses는 부수적으로 발생하는 비용, 즉 부대 비용을 뜻한다.",deriv:"incident n. 우발적 사건 / incidentally adv. 우연히"},
  {n:39,en:"inflation",pron:"[infléiʃən]",pos:"n",kr:"물가 상승, 인플레이션, 통화 팽창",ex:"A high <b>inflation</b> rate affected the company's net gains.",exkr:"높은 물가 상승률은 회사의 순수익에 영향을 미쳤다.",stars:1,tip:"lead to inflation 인플레이션을 초래하다 / inflation rate 물가 상승률 / the cause of inflation 인플레이션의 원인. inflation의 토익 출제 표현을 익혀 두자.",deriv:"inflate v. 팽창하다, 인플레가 일어나다 / inflationary adj. 인플레를 일으키는"},
  {n:40,en:"liable",pron:"[láiəbl]",pos:"adj",kr:"책임져야 할; ~하기 쉬운",ex:"The guarantor is <b>liable</b> for any unpaid debts.",exkr:"보증인은 모든 미납된 채무에 대한 책임이 있다.",stars:1,tip:"Expense accounts are <b>liable</b> to be misused. 지출 계좌는 오용되기 쉽다. // be liable for ~에 대한 책임이 있다 (= be responsible for) / be liable to do ~하기 쉽다 (= be likely to do). liable은 전치사 for 및 to부정사와 어울려 사용된다.",deriv:"liability n. 책임; 채무 / responsible 책임져야 할 / likely ~하기 쉬운"},
  {n:41,en:"spend",pron:"[spend]",pos:"v",kr:"~을 쓰다, 소비하다",ex:"The firm <b>spent</b> a lot of money on reinventing its products.",exkr:"그 회사는 제품을 처음부터 다시 만드는 데 많은 돈을 썼다.",stars:1,tip:"1. spend A on B B에 A를 쓰다. spend와 on이 모두 문제로 출제된다. 2. research and development spending 연구 개발 지출. 명사 spending 자리에 동사 spend를 쓰지 않도록 주의하자.",deriv:"spending n. 지출, 소비"},
  {n:42,en:"turnover",pron:"[미 tɔ́:rnòuvər / 영 tɔ́:nəuvə]",pos:"n",kr:"총 매상고, 거래액; 이직률",ex:"The company's <b>turnover</b> exceeded $2.8 million.",exkr:"회사의 총 매상고가 280만 달러를 넘어섰다.",stars:1,tip:"Poor work conditions lead to high employee <b>turnover</b>. 열악한 근로 조건은 높은 직원 이직률을 야기한다."},

    words:[
  {n:1,en:"announce",pron:"[ənáuns]",pos:"v",kr:"발표하다",ex:"The chairperson <b>announced</b> plans to increase overseas production.",exkr:"그 의장은 해외 생산을 증가시킬 계획을 발표했다.",stars:3,tip:"announce : inform : display — 정보 제공과 관련된 단어들의 용례 차이를 구별하는 문제로 출제된다. announce + 내용 ~을 발표하다(목적어로 발표 내용이 온다) / inform + 사람 + of 내용/that절 ~에게 ~을 알리다(inform 뒤에 사람 목적어가 와서 '~에게 알리다'라는 의미로 사용된다). The manager <b>informed</b> her staff of the corporate change. 그 관리자는 그녀의 직원들에게 회사의 변화에 대해 알렸다. / display 보이다, 눈에 잘 띄게 하다. The sign <b>displays</b> the departure and arrival of every flight. 그 표지판은 모든 비행편의 출발과 도착을 보여 준다.",deriv:"announcement n. 발표"},
  {n:2,en:"interested",pron:"[미 íntərəstid / 영 íntrəstid]",pos:"adj",kr:"관련 있는; 관심이 있는",ex:"<b>Interested</b> parties met to discuss the investment proposal.",exkr:"관련 당사자들이 투자 제의를 논의하기 위해 만났다.",stars:3,tip:"He is <b>interested</b> in the offer to buy the travel agency. 그는 여행사를 매입하겠다는 제안에 관심이 있다. // be interested in ~에 관심이 있다. interested와 전치사 in이 모두 문제로 출제된다.",deriv:"interest n. 관심 / interesting adj. 흥미로운"},
  {n:3,en:"active",pron:"[ǽktiv]",pos:"adj",kr:"적극적인, 활발한",ex:"Mr. Jones decided to take a more <b>active</b> role in the operations of his company.",exkr:"Mr. Jones는 회사 운영에 있어 보다 적극적인 역할을 하기로 결정했다.",stars:1,deriv:"activation n. 활성화 / actively adv. 적극적으로"},
  {n:4,en:"accept",pron:"[əksépt]",pos:"v",kr:"수락하다, 승낙하다",ex:"The managers voted to <b>accept</b> the new building proposal.",exkr:"그 관리자들은 새로운 건물 건립안을 수락하기로 표결했다.",stars:2,tip:"accept responsibility for ~에 대한 책임을 인정하다. accept는 responsibility와 어울려 많이 출제된다. // accept : admit — '받아들이다'라는 뜻을 가진 단어들의 용례 차이를 구별해 두자. accept 수락하다(제안 등을 받아들일 때 사용한다) / admit 시인하다(어떤 일이 사실임을 인정할 때 쓰인다). The company <b>admitted</b> that it had concealed information from trustees. 그 회사는 수탁자들로부터 정보를 감추었던 것을 시인했다.",deriv:"acceptable adj. 받아들일 수 있는 / acceptance n. 수락 / accepting adj. 쾌히 받아들이는, 솔직한 / acceptably adv. 받아들일 수 있게 / reject 거절하다"},
  {n:5,en:"foresee",pron:"[미 fɔ:rsí: / 영 fɔsí:]",pos:"v",kr:"예견하다, 예감하다",ex:"Food companies try to <b>foresee</b> future trends in agriculture.",exkr:"식품 회사들은 농업 분야의 미래 동향을 예견하려고 노력한다.",stars:1,tip:"앞으로 일어날 일을 미리 짐작한다는 의미로 쓰일 때 foresee는 predict로 바꾸어 쓸 수 있다.",deriv:"foreseeable adj. 예견할 수 있는 / unforeseen adj. 예측하지 못한, 뜻밖의 / predict 예측하다"},
  {n:6,en:"expansion",pron:"[ikspǽnʃən]",pos:"n",kr:"확장, 팽창",ex:"The firm is seeking opportunities for <b>expansion</b> into new markets.",exkr:"그 회사는 새로운 시장으로의 확장 기회를 찾고 있다.",stars:3,tip:"expansion project 확장 계획 / building expansion 건물 확장 / refinery expansion 제련소 확장. expansion은 복합 명사 형태로 자주 시험에 나오므로 표현을 익혀 두자.",deriv:"expand v. 확장하다 / expansive adj. 포괄적인, 광범위한"},

  {n:8,en:"competitor",pron:"[미 kəmpétətər / 영 kəmpétitə]",pos:"n",kr:"경쟁업체, 경쟁자",ex:"The company's closest <b>competitor</b> is catching up in sales.",exkr:"그 회사의 가장 치열한 경쟁업체가 판매에서 그들을 따라잡고 있다.",stars:3,tip:"competitor 경쟁자 / competitiveness 경쟁력 — 어근이 같지만 뜻이 다른 두 단어를 구별하는 문제로 출제된다. To maintain the company's <b>competitiveness</b>, it is downsizing some departments. 회사의 경쟁력을 유지하기 위해, 일부 부서들을 축소하고 있다."},

  {n:10,en:"contribute",pron:"[kəntríbju:t]",pos:"v",kr:"기여하다, 공헌하다",ex:"Various factors <b>contributed</b> to the company's success.",exkr:"다양한 요소들이 회사의 성공에 기여했다.",stars:3,deriv:"contribution n. 기여, 공헌 / contributor n. 기여자"},
  {n:11,en:"dedicated",pron:"[dédikèitid]",pos:"adj",kr:"(목표 등에) 전념하는, 헌신적인",ex:"The new director is <b>dedicated</b> to improving the firm's public image.",exkr:"신임 이사는 회사의 대외 이미지를 개선하는 데 전념한다.",stars:3,tip:"be dedicated to ~에 전념하다, 헌신하다 / a dedicated and talented team 헌신적이고 유능한 팀. dedicated는 함께 쓰이는 전치사 to와 묶어서 외워 둬야 한다.",deriv:"dedicate v. 바치다 / dedication n. 헌신, 전념 / devoted, committed 헌신적인"},
  {n:12,en:"misplace",pron:"[mispléis]",pos:"v",kr:"잃어버리다, 위치를 잘못 잡다",ex:"Marsha accidentally <b>misplaced</b> several sensitive company documents.",exkr:"Marsha는 뜻하지 않게 회사 기밀문서 몇 장을 잃어버렸다.",stars:3},
  {n:13,en:"considerable",pron:"[kənsídərəbl]",pos:"adj",kr:"(정도나 양이) 상당한",ex:"The developer raised the capital after <b>considerable</b> effort.",exkr:"그 개발 회사는 상당한 노력 끝에 자금을 마련했다.",stars:3,tip:"considerable 상당한 / considerate 사려 깊은 — 어근이 같지만 뜻이 다른 두 단어를 구별하는 문제로 출제된다. The president is very <b>considerate</b> to his employees. 그 회장은 직원들을 매우 사려 깊게 대한다. // considerable(adj. 상당한)과 consideration(n. 고려)의 품사 구별하기.",deriv:"consider v. 고려하다 / consideration n. 고려 / considerably adv. 상당히 / substantial (양·가치·중요성이) 상당한 / insignificant 사소한, 미미한"},

  {n:15,en:"emerge",pron:"[미 imɔ́:rdʒ / 영 imɔ́:dʒ]",pos:"v",kr:"부상하다, 나타나다",ex:"Macrotech Software <b>emerged</b> as the leader in the industry.",exkr:"Macrotech Software사는 업계의 선도업체로 두각을 나타냈다.",stars:3,tip:"emerge as ~로서 두각을 나타내다. emerge는 emerge as 형태로 시험에 출제되므로 꼭 기억해 두자.",deriv:"emergence n. 출현 / emergent adj. 신생의, 신흥의"},
  {n:16,en:"grow",pron:"[미 grou / 영 grəu]",pos:"v",kr:"성장하다, 성장시키다, 증가시키다",ex:"The market for electric vehicles is <b>growing</b> slowly but steadily.",exkr:"전기 자동차 시장은 느리지만 꾸준히 성장하고 있다.",stars:3,deriv:"growth n. 성장 / develop 성장하다, 발달하다"},
  {n:17,en:"select",pron:"[silékt]",pos:"v",kr:"선발하다, 선택하다",ex:"The board of Chambers Corp. <b>selected</b> a new chairperson last week.",exkr:"Chambers사의 이사회는 지난주에 새로운 회장을 선발했다.",stars:3,tip:"select : decide : nominate — '결정하다'를 뜻하는 단어들의 용례 차이를 구별하는 문제로 출제된다. select 선발하다, 선택하다(주의를 기울여 선발한다는 의미이다) / decide 결정하다(결과를 결정하다, 결정을 내린다는 의미이다). The marketing manager <b>decided</b> to accept the position of vice president of sales. 그 마케팅 팀장은 영업 부사장직을 수락하기로 결정했다. / nominate 지명하다, 추천하다(후보로 지명하거나 추천한다는 의미이다). The committee <b>nominated</b> Mr. Watson to be their leader. 위원회는 Mr. Watson을 위원장으로 지명했다.",deriv:"selection n. 선발, 선정 // adj. 엄선된, 고급의"},
  {n:18,en:"merge",pron:"[미 mɔ:rdʒ / 영 mɔ:dʒ]",pos:"v",kr:"합병하다, 병합하다",ex:"The private firm <b>merged</b> with a corporate giant.",exkr:"그 사기업은 대기업과 합병했다.",stars:3,tip:"mergers and acquisitions (M&A) 인수 합병. 명사 merger도 자주 출제되므로 꼭 기억해 둬야 한다.",deriv:"merger n. 합병 / amalgamate 합병하다"},
  {n:19,en:"imply",pron:"[implái]",pos:"v",kr:"암시하다, 넌지시 나타내다, 의미하다",ex:"A rise in the company's stock price <b>implies</b> investor confidence in its future performance.",exkr:"그 회사의 주가 상승은 회사의 장래 성과에 대한 투자자들의 신뢰를 암시한다.",stars:3,deriv:"suggest 암시하다, 시사하다"},
  {n:20,en:"vital",pron:"[váitl]",pos:"adj",kr:"필수적인",ex:"Understanding customers' needs is <b>vital</b> to growing a business.",exkr:"고객의 요구를 이해하는 것은 사업을 성장시키는 데 필수적이다.",stars:3,deriv:"vitally adv. 필수적으로, 지극히"},
  {n:21,en:"persist",pron:"[미 pərsíst / 영 pəsíst]",pos:"v",kr:"(집요하게) 계속하다, 계속되다, 지속되다",ex:"The firm must <b>persist</b> in its attempts to prosecute copyright violators.",exkr:"그 회사는 저작권 위반자들을 기소하기 위한 시도를 계속해야 한다.",stars:3,deriv:"persistent adj. 집요한 / persistence n. 끈기, 고집, 지속성"},
  {n:22,en:"independent",pron:"[ìndipéndənt]",pos:"adj",kr:"독립적인, 독자적인",ex:"An <b>independent</b> review board was formed to evaluate business proposals.",exkr:"사업 제안들을 평가하기 위해 독립적인 평가 위원회가 구성되었다.",stars:3,tip:"independent agency 독립 기관. independent의 출제 표현을 기억해 두자.",deriv:"dependent 의존하는"},
  {n:23,en:"force",pron:"[미 fɔ:rs / 영 fɔ:s]",pos:"n",kr:"세력",ex:"Johnson Homes has become a major <b>force</b> in the real estate sector.",exkr:"Johnson Homes사는 부동산 업계의 주요 세력이 되었다.",stars:3,tip:"v. 강요하다"},
  {n:24,en:"establish",pron:"[istǽbliʃ]",pos:"v",kr:"설립하다",ex:"The businessman is planning to <b>establish</b> an offshore company.",exkr:"그 사업가는 해외에 회사를 설립하려고 계획 중이다.",stars:2,deriv:"establishment n. 설립 / established adj. 확립된, 정평이 있는"},
  {n:25,en:"initiate",pron:"[iníʃièit]",pos:"v",kr:"(사업 등을) 착수하다, 시작하다",ex:"The CEO <b>initiated</b> plans for continued business growth.",exkr:"그 최고 경영자는 지속적인 사업 성장을 위한 계획에 착수했다.",stars:2,tip:"사업이나 계획 등을 시작하다라는 문맥일 때 initiate는 start, launch, commence 등으로 바꾸어 쓸 수 있다.",deriv:"initial adj. 초기의, n. 머리글자, (이름의) 이니셜 / initially adv. 처음에 / start, launch, commence 착수하다"},
  {n:26,en:"enhance",pron:"[미 inhǽns / 영 inhɑ́:ns]",pos:"v",kr:"(질 등을) 향상시키다, 높이다, 강화하다",ex:"Support of nonprofit organizations can <b>enhance</b> a company's image.",exkr:"비영리 단체를 후원하는 것은 회사 이미지를 향상시킬 수 있다.",stars:2,tip:"enhance는 질, 가치, 외관 등을 개선하다라는 문맥일 때는 improve로, 기능이나 효율을 높이다라는 문맥일 때는 reinforce나 strengthen으로 바꾸어 쓸 수 있다.",deriv:"enhancement n. 상승, 향상, 증대 / improve 증진하다 / reinforce, strengthen 강화하다"},
  {n:27,en:"renowned",pron:"[rináund]",pos:"adj",kr:"저명한, 유명한, 명성이 있는",ex:"Several <b>renowned</b> economists spoke at this year's national business conference.",exkr:"몇몇 저명한 경제학자들이 올해 열린 국내 경영 회담에서 연설했다.",stars:2},
  {n:28,en:"informed",pron:"[미 infɔ́:rmd / 영 infɔ́:md]",pos:"adj",kr:"정보에 근거한",ex:"Seeking legal advice will help you make an <b>informed</b> decision.",exkr:"법률 자문을 구하는 것은 현명한 결정을 하는 데 도움이 될 것이다.",stars:2,tip:"informed + decision/choice 정보에 근거한 결정/선택. informed decision은 좋은 정보에 근거한 결정, 즉 현명한 결정을 뜻한다.",deriv:"inform v. 알리다 / informative adj. 유익한 / information n. 정보"},
  {n:29,en:"minutes",pron:"[mínits]",pos:"n",kr:"회의록",ex:"Janine took <b>minutes</b> from the meeting and will send everyone a copy.",exkr:"Janine은 그 회의에서 회의록을 작성했고 모두에게 사본을 보낼 것이다.",stars:2},
  {n:30,en:"waive",pron:"[weiv]",pos:"v",kr:"(규칙 등을) 적용하지 않다, (권리·청구 등을) 포기하다",ex:"The Revenue Department <b>waives</b> tax requirements in exceptional circumstances.",exkr:"국세청은 예외적인 경우에 세금을 면제해 준다.",stars:2},
  {n:31,en:"reach",pron:"[ri:tʃ]",pos:"v",kr:"(치수·양 등이) ~에 달하다; ~에 도착하다",ex:"Sales figures for Sameco phones have <b>reached</b> 15 million units.",exkr:"Sameco사 전화의 판매 실적이 1,500만 대에 달했다.",stars:2,tip:"The bus <b>reached</b> Camberton three hours after leaving Hazelwood. 그 버스는 Hazelwood를 떠난 지 3시간 후 Camberton에 도착했다. // 매출, 수익 등이 목표치나 기준에 달하다라는 의미일 때 reach는 achieve로 바꾸어 쓸 수 있다.",deriv:"reachable adj. 닿을 수 있는, 도달 가능한 / achieve 달성하다, 성취하다 // n. 세력 범위; (팔이) 미치는 범위"},
  {n:32,en:"authority",pron:"[미 əθɔ́:rəti / 영 ɔ:θɔ́riti]",pos:"n",kr:"권한; 당국",ex:"Ms. Franklin has the <b>authority</b> to revoke the agent's license.",exkr:"Ms. Franklin은 중개인 면허를 취소할 수 있는 권한이 있다.",stars:2,tip:"The stock transaction was investigated by the <b>authorities</b>. 주식 거래가 당국에 의해 조사되었다. // authority : authorization : authorship — '권한'과 관련된 단어들의 뜻과 쓰임을 구별하는 문제로 출제된다. authority 권한(사람들에게 지시하고 통제할 수 있는 권한을 의미한다) / authorization 인가(공식적인 허락을 뜻한다). She obtained <b>authorization</b> to access the classified data. 그녀는 기밀 자료를 이용할 수 있는 인가를 받았다. / authorship (원)저자(저작물의 원작자를 뜻한다). The <b>authorship</b> of the anonymously published study proved to be Mr. Tate. 익명으로 발표된 연구의 원저자는 Mr. Tate로 밝혀졌다.",deriv:"authorize v. ~을 허가하다"},
  {n:33,en:"acquire",pron:"[미 əkwáiər / 영 əkwáiə]",pos:"v",kr:"매입하다, 취득하다",ex:"The company will <b>acquire</b> property near the financial district.",exkr:"그 회사는 금융가 근처의 부동산을 매입할 것이다.",stars:2,deriv:"acquired adj. 획득한; 후천적인 / acquisition n. 매수, 획득"},
  {n:34,en:"surpass",pron:"[미 sərpǽs / 영 səpɑ́:s]",pos:"v",kr:"~을 능가하다, 넘어서다",ex:"Profits for the last fiscal year <b>surpassed</b> $300 million.",exkr:"지난 회계 연도의 수익이 3억 달러를 능가했다.",stars:2,deriv:"surpassingly adv. 뛰어나게, 빼어나게"},
  {n:35,en:"run",pron:"[rʌn]",pos:"v",kr:"~을 운영하다, 경영하다; (공연, 영화 등이) 상연되다, 계속되다",ex:"The organization is <b>run</b> by retired executives.",exkr:"그 단체는 은퇴한 임원들에 의해 운영된다.",stars:2,tip:"The talented director's first musical <b>ran</b> for three years on Broadway. 그 유능한 감독의 첫 번째 뮤지컬은 브로드웨이에서 3년 동안 상연되었다. // 사업체, 조직 등을 운영하다는 문맥일 때 run은 operate 또는 manage로 바꾸어 쓸 수 있다.",deriv:"operate, manage ~을 경영하다"},
  {n:36,en:"improbable",pron:"[미 imprábəbl / 영 imprɔ́bəbl]",pos:"adj",kr:"사실이라고 생각할 수 없는, 일어날 것 같지 않은",ex:"Mr. Jenkins is an <b>improbable</b> candidate for the job, as he lacks experience.",exkr:"Mr. Jenkins는 경험이 부족하기 때문에 그 자리의 후보로 생각할 수 없다.",stars:2},
  {n:37,en:"edge",pron:"[edʒ]",pos:"n",kr:"우위, 유리함; 가장자리, 끝",ex:"Mr. Paulson's vast experience gives him an <b>edge</b> on the other job candidates.",exkr:"Mr. Paulson의 방대한 경험은 그를 다른 입사 지원자들보다 우위에 둔다.",stars:2,tip:"Property prices are far cheaper on the <b>edge</b> of town than in the center. 부동산 가격은 중심부보다 도시 가장자리 쪽이 훨씬 더 싸다. // edge가 상대적으로 우위에 있다는 문맥일 때 advantage로, 가장자리를 의미할 때에는 border로 바꾸어 쓸 수 있다. 참고로, an edge 또는 the edge로 쓰일 때에는 '날카로움'이라는 뜻도 있어서 sharpness로 바꾸어 쓸 수도 있다.",deriv:"advantage 우위, 유리함 / border 가장자리"},
  {n:38,en:"simultaneously",pron:"[미 sàiməltéiniəsli / 영 sìməltéiniəsli]",pos:"adv",kr:"동시에",ex:"The company is attempting to enter both Asia and Europe <b>simultaneously</b>.",exkr:"그 회사는 아시아와 유럽으로 동시에 진출하려고 시도하고 있다.",stars:1,deriv:"simultaneous adj. 동시의"},
  {n:39,en:"reveal",pron:"[riví:l]",pos:"v",kr:"밝히다, 누설하다",ex:"The companies <b>revealed</b> their plan to set up a joint venture.",exkr:"그 회사들은 합작 사업을 시작하려는 계획을 밝혔다.",stars:1,deriv:"revelation n. 폭로 / conceal 감추다"},
  {n:40,en:"productivity",pron:"[미 pràdəktívəti / 영 prɔ̀dʌktíviti]",pos:"n",kr:"생산성",ex:"Brewster Manufacturing has raised <b>productivity</b> at its Jakarta plant.",exkr:"Brewster Manufacturing사는 자카르타 공장의 생산성을 높였다.",stars:1,tip:"staff/employee + productivity 직원 생산성. 명사 productivity 자리에 형용사인 productive를 쓰지 않도록 주의해야 한다. // productivity 생산성 / product 제품 — 어근이 같지만 뜻이 다른 두 단어를 혼동하지 않도록 한다.",deriv:"productive adj. (상품·작물을 특히 대량으로) 생산하는, 결실 있는"},
  {n:41,en:"uncertain",pron:"[미 ʌnsɔ́:rtn / 영 ʌnsɔ́:tn]",pos:"adj",kr:"확신이 없는, 불확실한",ex:"The company is <b>uncertain</b> about the cost of operating a factory in China.",exkr:"그 회사는 중국에서 공장을 운영하는 비용에 대해 확신을 갖지 못한다.",stars:1,tip:"be uncertain about ~에 대해 확신을 갖지 못하다. uncertain과 함께 쓰이는 전치사 about을 묶어서 기억해 두자.",deriv:"uncertainly adv. 불확실하게 / certain 확신하는"},

  {

    words:[
  {n:1,en:"agenda",pron:"[ədʒéndə]",pos:"n",kr:"의제, 의사일정",ex:"Mr. Jones planned the <b>agenda</b> for the stockholders' meeting.",exkr:"Mr. Jones는 주주 총회의 의제를 구상했다.",stars:3,tip:"printed agenda 인쇄된 회의 의제 / on the agenda 의제에 올라 있는. agenda의 토익 출제 표현을 기억해 두자."},
  {n:2,en:"convene",pron:"[kənví:n]",pos:"v",kr:"(회원 등이) 모이다, (회의가) 개최되다",ex:"The CEOs will <b>convene</b> tomorrow to review joint investment initiatives.",exkr:"최고 경영자들은 공동 투자 계획을 재검토하기 위해 내일 모일 것이다.",stars:3,deriv:"convention n. 회의, 대회"},
  {n:3,en:"refute",pron:"[rifjú:t]",pos:"v",kr:"부인하다, 반박하다",ex:"Mr. Geiger did not <b>refute</b> the allegations made against him.",exkr:"Mr. Geiger는 그를 상대로 제기된 혐의를 부인하지 않았다.",stars:1,deriv:"refutation n. 반박, 논박"},
  {n:4,en:"coordination",pron:"[미 kouɔ̀:rdənéiʃən / 영 kəuɔ̀:dinéiʃən]",pos:"n",kr:"조정",ex:"Mr. Dane has taken on the <b>coordination</b> of the seminar.",exkr:"Mr. Dane이 세미나 조정 업무를 맡았다.",stars:2,deriv:"coordinate v. 조정하다 / coordinator n. 진행자, 조정자"},
  {n:5,en:"unanimous",pron:"[ju:nǽnəməs]",pos:"adj",kr:"만장일치의, 동의하는",ex:"The plans gained <b>unanimous</b> support from board members.",exkr:"그 계획은 이사진으로부터 만장일치의 지지를 얻었다.",stars:1,tip:"express unanimous support 만장일치의 지지를 표명하다. unanimous는 support 등 지지를 의미하는 명사와 어울려 출제된다.",deriv:"unanimously adv. 만장일치로"},
  {n:6,en:"convince",pron:"[kənvíns]",pos:"v",kr:"납득시키다, 확신시키다",ex:"The broker <b>convinced</b> the investors that the scheme was commercially viable.",exkr:"중개인은 투자자들에게 그 계획이 상업적으로 성공할 수 있다고 납득시켰다.",stars:2,tip:"convince A of B A에게 B를 납득시키다 / convince A that절 A에게 ~을 납득시키다. convince는 사람 목적어 다음에 전치사 of나 that절이 온다.",deriv:"convincing adj. 설득력 있는 / convinced adj. 확신하는"},
  {n:7,en:"consensus",pron:"[kənsénsəs]",pos:"n",kr:"여론, 일치된 의견",ex:"The general <b>consensus</b> seems to be that selling is the best option.",exkr:"매각이 최선의 선택이라는 것이 전반적인 여론인 듯하다.",stars:2,tip:"general consensus 전반적인 여론 / reach a consensus on ~에 합의를 보다, 합의에 도달하다. consensus는 general의 수식을 받거나 동사 reach와 어울려 주로 출제된다. // 어떤 안건에 대한 의견이 일치함을 의미할 때 consensus는 agreement로 바꾸어 쓸 수 있다.",deriv:"consent v. 동의하다, n. 동의, 승낙 / agreement 일치, 합의"},
  {n:8,en:"defer",pron:"[미 difɔ́:r / 영 difɔ́:]",pos:"v",kr:"연기하다, 미루다",ex:"The registration deadline has been <b>deferred</b> for one week.",exkr:"등록 마감일이 일주일 연기되었다.",stars:1,deriv:"postpone, delay 연기하다"},
  {n:9,en:"usually",pron:"[jú:ʒuəli]",pos:"adv",kr:"보통, 일반적으로",ex:"Team members <b>usually</b> discuss the schedule each Monday.",exkr:"팀원들은 보통 매주 월요일에 일정을 논의한다.",stars:3,tip:"usually + 현재 시제 보통 ~하다. usually는 일반적인 사실을 말할 때 쓰이므로 현재 시제와 함께 많이 사용된다.",deriv:"usual adj. 보통의, 평상시의 / unusually 보통과는 달리, 유별나게"},
  {n:10,en:"reschedule",pron:"[미 ri:skédʒu:l / 영 ri:ʃédju:l]",pos:"v",kr:"일정을 바꾸다",ex:"The conference may be <b>rescheduled</b> if Mr. Bellman is unavailable.",exkr:"Mr. Bellman이 참석할 수 없다면 회의 일정이 바뀔 수 있습니다.",stars:3},
  {n:11,en:"meeting",pron:"[mí:tiŋ]",pos:"n",kr:"회의",ex:"The <b>meeting</b> will begin at 10 A.M., so please be on time.",exkr:"회의는 오전 10시에 시작될 예정이오니, 제시간에 와 주십시오.",stars:3},
  {n:12,en:"determine",pron:"[미 ditɔ́:rmin / 영 ditɔ́:min]",pos:"v",kr:"알아내다; 결정하다, 확정하다",ex:"The team met to <b>determine</b> the cause of the chemical leak.",exkr:"그 팀은 화학 물질 유출의 원인을 알아내기 위해 모였다.",stars:3,tip:"The project participants gathered briefly to <b>determine</b> their next course of action. 프로젝트 관계자들은 다음 절차를 결정하기 위해 잠시 모였다. // determine the cause of ~의 원인을 알아내다. determine은 '알아내다'라는 뜻으로 쓰일 때 cause 등 원인이나 진상을 의미하는 명사와 함께 자주 사용된다.",deriv:"determination n. 결심, 결정 / determined adj. 단호한, 확정된"},
  {n:13,en:"report",pron:"[미 ripɔ́:rt / 영 ripɔ́:t]",pos:"v",kr:"보고하다; 출두하다, (직장·회의 등에 도착을) 알리다",ex:"The head researcher <b>reported</b> his findings to the department leaders.",exkr:"수석 연구원은 부서장들에게 그의 연구 결과를 보고했다.",stars:3,tip:"All new employees need to <b>report</b> to the orientation upon arrival. 모든 신입 사원들은 도착하는 대로 오리엔테이션으로 와야 한다. // n. 보고서; 보도, 기록 — Frank presented a <b>report</b> on his consumer study findings. Frank는 소비자 연구 결과에 대한 보고서를 제출했다. / One discussion topic was a news <b>report</b> about rising gas prices. 한 토론 주제는 증가하는 휘발유 가격에 대한 뉴스 보도였다. // report A (directly) to B A를 B에게 (직접) 보고하다. 동사 report는 report A to B 형태로 자주 사용되며 directly의 수식을 받기도 한다. // 특정 대상이 회의나 행사 장소 등으로 오다라는 의미로 사용되는 report to는 come to로 바꾸어 쓸 수 있다.",deriv:"reportable adj. 보고할 수 있는, 보도 가치가 있는 / reportedly adv. 전하는 바에 따르면, 소문에 따르면 / come 오다"},
  {n:14,en:"comment",pron:"[미 káment / 영 kɔ́ment]",pos:"v",kr:"논평하다, 언급하다",ex:"The spokesperson refused to <b>comment</b> on the budget cuts.",exkr:"대변인은 예산 삭감에 대해 말하길 거부했다.",stars:3,tip:"comment + about/on ~에 대해 말하다. comment는 전치사 about, on과 자주 어울려 쓰인다.",deriv:"n. 비평, 의견"},
  {n:15,en:"phase",pron:"[feiz]",pos:"n",kr:"단계",ex:"Mr. Baker made a detailed plan for the building project's third <b>phase</b>.",exkr:"Mr. Baker는 건축 프로젝트의 세 번째 단계에 대한 상세한 계획을 세웠다.",stars:3},
  {n:16,en:"approve",pron:"[əprú:v]",pos:"v",kr:"승인하다, 찬성하다",ex:"The head architect <b>approved</b> the proposal for changing the design process.",exkr:"수석 건축가는 설계 과정을 바꾸자는 기획안을 승인했다.",stars:2,tip:"approve the request 요청을 승인하다 / approve the plan 계획에 찬성하다. approve는 request, plan 등 어떤 일을 하겠다는 요청이나 계획을 의미하는 명사와 함께 주로 출제된다.",deriv:"approved adj. 승인받은 (= confirmed)"},
  {n:17,en:"enclosed",pron:"[미 inklóuzd / 영 inkláuzd]",pos:"adj",kr:"동봉된",ex:"A program is <b>enclosed</b> in the conference's information packet.",exkr:"일정표는 회의 자료 묶음에 동봉되어 있습니다.",stars:2,deriv:"enclose v. 동봉하다, 에워싸다"},
  {n:18,en:"easy",pron:"[í:zi]",pos:"adj",kr:"쉬운, 용이한",ex:"The decision to sell the shopping mall was not <b>easy</b> to make.",exkr:"그 쇼핑몰을 매각하겠다는 결정을 내리기 쉽지 않았다.",stars:2,tip:"easy to do ~하기 쉽다. easy는 주로 to부정사와 어울려 시험에 출제된다.",deriv:"ease n. 쉬움, 용이함 / easily adv. 쉽게 / smooth 순조로운"},
  {n:19,en:"record",pron:"n. [미 rékərd / 영 rékɔ:d] / v. [미 rikɔ́:rd / 영 rikɔ́:d]",pos:"n",kr:"기록; 경력, 이력",ex:"Managers reviewed the accounts <b>record</b> before making a final decision.",exkr:"관리자들은 최종 결정을 내리기 전에 회계 기록을 검토했다.",stars:2,tip:"v. 기록하다 — The secretary <b>recorded</b> everything that was said at the gathering. 그 비서는 모임에서 이야기된 모든 것을 기록했다. // transaction records 거래 내역. record의 토익 출제 표현을 기억해 두자. // record 기록 / recording 녹화, 녹음 — 정보 등을 기록함을 의미하는 명사 record와 '녹화, 녹음'이라는 뜻의 명사 recording을 혼동하지 않도록 유의한다. video <b>recordings</b> 영상 녹화 / <b>recording</b> equipment 녹음 장비, 녹화 장비 / a <b>recording</b> session 녹음 시간.",deriv:"register (계기가 특정한 양을) 기록하다"},
  {n:20,en:"suggestion",pron:"[미 səgdʒéstʃən / 영 sədʒéstʃən]",pos:"n",kr:"제안",ex:"Mr. Kumar made a useful <b>suggestion</b> to help improve profit margins.",exkr:"Mr. Kumar는 수익 개선에 도움이 되는 유용한 제안을 했다.",stars:2,tip:"suggestion : proposal — '제안'을 의미하는 단어들의 용례 차이를 구별해 두자. suggestion 제안(일반적인 제안의 의미이며 소극적인 제안일 때 쓰인다) / proposal (기획)안, 계획(적극적으로 추진하고자 하는 업무적 제안일 때 쓰인다). Antoine translated the business <b>proposal</b> into French. Antoine은 그 사업 기획안을 프랑스어로 번역했다.",deriv:"suggest v. ~을 제안하다"},
  {n:21,en:"attention",pron:"[əténʃən]",pos:"n",kr:"주의, 경청",ex:"The officials paid <b>attention</b> to the incoming president's formal address.",exkr:"임원들은 후임 회장의 공식 연설에 주의를 기울였다.",stars:2,tip:"pay attention to ~에 주의를 기울이다 / call attention to ~에 대해 타인의 주의를 환기시키다 / catch one's attention ~의 주의를 끌다 / attentive to ~을 경청하는. attention은 pay, call, catch 등의 동사와 숙어를 이룬 형태로 자주 사용된다. 형용사 attentive는 전치사 to와 묶어서 기억해 두자.",deriv:"attentive adj. 경청하는 / attentively adv. 주의 깊게"},
  {n:22,en:"object",pron:"v. [əbdʒékt] / n. [미 ábdʒikt / 영 ɔ́bdʒikt]",pos:"v",kr:"반대하다",ex:"No one <b>objected</b> to taking a short coffee break.",exkr:"아무도 짧은 휴식 시간을 갖는 것에 반대하지 않았다.",stars:2,tip:"object to -ing ~에 반대하다. object와 함께 쓰는 to는 전치사이므로 뒤에 동명사가 와야 한다. to 다음에 동사원형을 쓰지 않도록 유의하자. // n. 목표, 대상",deriv:"objection n. 반대, 이의 / objective adj. 객관적인"},
  {n:23,en:"coincidentally",pron:"[미 kouìnsidéntli / 영 kəuìnsidéntli]",pos:"adv",kr:"우연히, 일치하게, 동시 발생적으로",ex:"The new managers introduced at the meeting were both <b>coincidentally</b> from Taiwan.",exkr:"회의에서 소개된 신임 관리자들은 둘 다 우연히도 대만 출신이었다.",stars:2},
  {n:24,en:"crowded",pron:"[kráudid]",pos:"adj",kr:"붐비는, 복잡한",ex:"Conference attendees have complained about the small venue being too <b>crowded</b>.",exkr:"회의 참석자들은 작은 회의장이 너무 붐비는 것에 대해 불평했다.",stars:2},
  {n:25,en:"undergo",pron:"[미 ʌ̀ndərgóu / 영 ʌ̀ndəgáu]",pos:"v",kr:"겪다, 거치다, 경험하다",ex:"The meeting room is unavailable because it is <b>undergoing</b> renovation.",exkr:"회의실은 보수 중이기 때문에 이용할 수 없다.",stars:2,tip:"undergo construction/renovations 공사/보수를 치르다 / undergo extensive training 폭 넓은 훈련을 받다 / undergo improvement 개선을 거치다. undergo와 함께 토익에 자주 출제되는 표현들을 알아 두자."},
  {n:26,en:"outcome",pron:"[áutkʌ̀m]",pos:"n",kr:"결과",ex:"The <b>outcome</b> of the study was a topic for debate.",exkr:"그 연구 결과는 토론해 볼 만한 주제였다.",stars:2},
  {n:27,en:"narrowly",pron:"[미 nǽrouli / 영 nǽrəuli]",pos:"adv",kr:"주의 깊게, 좁게; 가까스로, 간신히, 겨우",ex:"The keynote speech was <b>narrowly</b> focused on trends in the industry.",exkr:"기조연설은 그 업계의 경향에 주의 깊게 집중했다.",stars:2,tip:"be narrowly focused on ~에 주의 깊게 집중하다. narrowly의 토익 출제 표현을 익혀 두자.",deriv:"narrow v. 좁히다"},
  {n:28,en:"differ",pron:"[미 dífər / 영 dífə]",pos:"v",kr:"의견을 달리하다, 다르다",ex:"Executives <b>differ</b> in their opinions on the issue of telecommuting.",exkr:"임원들은 재택근무에 대해 의견을 달리한다.",stars:2,tip:"differ + in/from ~ 면에서/~와 다르다 / differentiate A from B (differentiate between A and B) A를 B와 구별하다",deriv:"difference n. 차이점 / different adj. 다른 / differently adv. 다르게"},
  {n:29,en:"discuss",pron:"[diskʌ́s]",pos:"v",kr:"논의하다, 토론하다",ex:"Jeremy Stevens <b>discussed</b> the design proposal with his colleagues.",exkr:"Jeremy Stevens는 그의 동료들과 함께 디자인 안을 논의했다.",stars:2,tip:"discuss + 목적어 ~을 논의하다. discuss는 타동사이므로 뒤에 전치사 없이 바로 목적어가 온다는 것에 유의하자. // 어떤 일이나 주제에 대한 생각을 서로 공유하다라는 의미일 때 discuss는 share로 바꾸어 쓸 수 있다.",deriv:"discussion n. 토론, 토의 / share (생각·경험·감정 등을 남과) 나누다, 공유하다"},
  {n:30,en:"give",pron:"[giv]",pos:"v",kr:"(연설·수업 등을) 하다",ex:"The former president of Gascom will <b>give</b> a speech.",exkr:"Gascom사의 전 회장이 연설할 것이다.",stars:2,tip:"give a speech 연설하다 / give a presentation 발표하다 / give A one's support A를 지지하다. give의 짝 표현에 give를 채워 넣는 문제로 출제된다.",deriv:"given adj. 주어진, 특정한 (= particular), prep. ~을 고려해 볼 때"},
  {n:31,en:"brief",pron:"[bri:f]",pos:"v",kr:"~에게 간단히 설명하다, 브리핑하다",ex:"The manager <b>briefed</b> the staff on the policy change.",exkr:"부장은 직원들에게 방침 변화에 대해 간단히 설명했다.",stars:1,tip:"brief A on B A에게 B에 대해 간단히 설명하다. brief와 함께 쓰이는 전치사 on을 한데 묶어서 외워 두자.",deriv:"briefly adv. 간결하게, 짧게 // adj. 간결한, 짧은"},
  {n:32,en:"distract",pron:"[distrǽkt]",pos:"v",kr:"(주의를) 산만하게 하다, 빗기게 하다",ex:"The meeting's participants were constantly <b>distracted</b> by noise.",exkr:"회의 참석자들은 소음 때문에 끊임없이 주의가 산만해졌다.",stars:1,deriv:"distraction n. 정신이 흩어짐"},
  {n:33,en:"emphasis",pron:"[émfəsis]",pos:"n",kr:"강조, 중점",ex:"The speaker placed an <b>emphasis</b> on economic development strategies.",exkr:"발표자는 경제 개발 전략을 강조했다.",stars:1,tip:"place an emphasis on ~을 강조하다 / with emphasis 강조하여, 힘주어. emphasis의 짝 표현에 emphasis를 채워넣는 문제로 출제된다.",deriv:"emphasize v. 강조하다 / emphatic adj. 강조하는 / stress 강조"},
  {n:34,en:"press",pron:"[pres]",pos:"n",kr:"언론(계), 보도기관",ex:"The <b>press</b> covered the merger talks closely.",exkr:"언론은 합병 회담을 심도 있게 다루었다.",stars:1,tip:"v. 누르다 — The lecturer <b>pressed</b> the button to lower the screen. 강연자는 스크린을 내리기 위해 버튼을 눌렀다. // press release 보도 자료 / press conference 기자 회견. 시험에 자주 출제되는 press의 복합 명사를 알아 두자.",deriv:"pressure n. 압박(감), 곤경 / media 대중 매체"},
  {n:35,en:"organize",pron:"[미 ɔ́:rgənàiz / 영 ɔ́:gənaiz]",pos:"v",kr:"준비하다, 조직하다, 정리하다",ex:"Roy Dell <b>organized</b> a series of marketing seminars.",exkr:"Roy Dell이 일련의 마케팅 세미나를 준비했다.",stars:1,tip:"organize a committee 위원회를 조직하다 / organize one's thoughts 생각을 정리하다. organize는 단체를 조직하거나 생각 등을 정리하는 경우에도 사용한다.",deriv:"organization n. 조직, 구성 / organizer n. 주최자, 조직자"},
  {n:36,en:"mention",pron:"[ménʃən]",pos:"v",kr:"언급하다",ex:"Karl <b>mentioned</b> his concern about the low attendance levels.",exkr:"Karl은 낮은 출석률에 대한 우려를 언급했다.",stars:1,tip:"n. 언급"},
  {n:37,en:"persuasive",pron:"[미 pərswéisiv / 영 pəswéisiv]",pos:"adj",kr:"설득력 있는",ex:"Julia Accord's offer was refused despite her <b>persuasive</b> arguments.",exkr:"Julia Accord의 제안은 그녀의 설득력 있는 주장에도 불구하고 거절되었다.",stars:1,tip:"1. persuasive + argument/evidence 설득력 있는 주장/증거. persuasive는 argument 등 주장을 나타내는 명사와 어울려 출제된다. 2. persuade 사람 to do ~가 ~하도록 설득하다. 동사 persuade는 목적어 다음에 to부정사가 오는 형태로 주로 사용된다.",deriv:"persuade v. 설득하다 / persuasion n. 설득 / persuasively adv. 설득력 있게 / unconvincing 설득력이 없는"},
  {n:38,en:"understanding",pron:"[미 ʌ̀ndərstǽndiŋ / 영 ʌ̀ndəstǽndiŋ]",pos:"adj",kr:"이해심 있는",ex:"The negotiator assumed an <b>understanding</b> attitude throughout the discussion.",exkr:"그 협상자는 논의 내내 이해심 있는 태도를 보였다.",stars:1,tip:"understanding 이해심 있는 / understandable 이해할 수 있는 — 어근이 같지만 뜻이 다른 두 단어를 구별해 두자. understanding은 상대방을 이해하고 포용할 때 쓰이는 반면, understandable은 다른 사람의 행동이나 기분을 이해할 수 있는 경우에 사용한다. It is <b>understandable</b> that the director was so upset. 그 임원이 그렇게 화가 났던 것은 이해할 만하다.",deriv:"understand v. 이해하다 / understandable adj. 이해할 수 있는 // n. 이해"},
  {n:39,en:"adjourn",pron:"[미 ədʒɔ́:rn / 영 ədʒɔ́:n]",pos:"v",kr:"(회의 등을) 휴회하다",ex:"The meeting was <b>adjourned</b> an hour after it began.",exkr:"회의는 시작된 지 한 시간 후에 휴회되었다.",stars:1},
  {n:40,en:"constructive",pron:"[kənstrʌ́ktiv]",pos:"adj",kr:"건설적인",ex:"Supervisors should give <b>constructive</b> criticism to employees.",exkr:"관리자는 직원들에게 건설적인 비판을 해 주어야 한다.",stars:1,deriv:"construct v. 건설하다 / construction n. 건설 / constructively adv. 건설적으로, 구조상으로 / destructive 파괴적인"},
  {n:41,en:"preside",pron:"[prizáid]",pos:"v",kr:"(회의의) 사회를 보다, ~의 의장을 맡아보다",ex:"The chief of human resources will <b>preside</b> over the annual staff gathering.",exkr:"인사부장이 연례 직원 모임의 사회를 볼 것이다.",stars:1,tip:"preside over ~의 사회를 보다, 통솔하다. preside와 함께 쓰이는 전치사 over 뒤에는 주로 회의, 모임 등을 나타내는 명사가 온다. // a president 회장 / presidency 회장직 — 사람 명사 president와 추상 명사 presidency의 뜻을 구별하는 문제로 출제된다. president는 가산 명사이지만, presidency는 불가산 명사이므로 부정관사 a를 쓸 수 없다는 것도 기억해 두자.",deriv:"president n. 사회자, 의장 / presidency n. 회장직"},
  {n:42,en:"irrelevant",pron:"[미 iréləvənt / 영 irélivənt]",pos:"adj",kr:"관계가 없는, 무관한",ex:"The argument was <b>irrelevant</b> to the topic.",exkr:"그 주장은 논제와 관계가 없었다.",stars:1,tip:"irrelevant : irrespective — '관계가 없는'이란 의미를 가진 단어들의 용례 차이를 구별하는 문제로 출제된다. irrelevant to ~와 관계없는(irrelevant는 대상과 관련성이 없다는 뜻이며 전치사 to와 함께 쓴다) / irrespective of ~와 상관없이(irrespective는 어떤 대상에 영향을 주지도 받지도 않는다는 의미이며 전치사 of와 같이 다닌다). Internet conferencing allows communication <b>irrespective of</b> location. 인터넷 회의는 장소와 상관없이 의사소통을 할 수 있게 한다.",deriv:"relevant 관련된"},
  {n:43,en:"constraint",pron:"[kənstréint]",pos:"n",kr:"제한",ex:"Due to time <b>constraints</b>, the policy change was not discussed.",exkr:"시간제한으로 인해, 정책 변경은 논의되지 못했다.",stars:1,tip:"constraint : inhibition — '억제'를 의미하는 단어들의 용례 차이를 구별하는 문제로 출제된다. constraint 제한(하고자 하는 바가 상황에 의해 통제될 때 쓰인다) / inhibition (감정의) 거리낌, 억압(두려움 등의 감정이 행동이나 욕망을 억제할 때 쓰인다). With training, Roy lost all his <b>inhibitions</b> about public speaking. 훈련을 통해, Roy는 대중 연설에 대한 거리낌을 없앴다.",deriv:"constrain v. 제한하다"},
  {n:44,en:"condensed",pron:"[kəndénst]",pos:"adj",kr:"요약한, 응축한, 압축한",ex:"A <b>condensed</b> version of the report was read aloud at the meeting.",exkr:"그 보고서의 요약본은 회의에서 낭독되었다.",stars:1,deriv:"condense v. 요약하다, 압축하다 / condensation n. 요약, 압축"},
  {n:45,en:"endorse",pron:"[미 indɔ́:rs / 영 indɔ́:s]",pos:"v",kr:"(공개적으로) 지지하다, 보증하다",ex:"The businessman publicly <b>endorsed</b> Ms. Kim for mayor.",exkr:"그 사업가는 공개적으로 Ms. Kim을 시장으로 지지했다.",stars:1,deriv:"endorsement n. (공개적인) 지지 / endorser n. 양도인, 배서인"},
  {n:46,en:"punctually",pron:"[pʌ́ŋktʃuəli]",pos:"adv",kr:"제시간에, 늦지 않게",ex:"Some participants failed to arrive <b>punctually</b> for the workshop.",exkr:"몇몇 참가자들은 워크숍에 제시간에 도착하지 못했다.",stars:1,deriv:"punctual adj. 시간을 엄수하는 / punctuality n. 시간 엄수"},
