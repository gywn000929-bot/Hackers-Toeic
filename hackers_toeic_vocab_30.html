// ====================================================
// ✍️ 영작 — 그날 배운 단어의 예문을 한글만 보고 영어로 옮겨 봅니다.
// 인터넷 없이 돌아가야 하므로 채점은 책 안의 모범 예문과 단어 단위로
// 맞춰 보는 방식입니다. 어형(-s, -ed, -ing)이 다른 건 '거의 맞음'으로
// 봐 주고, 빠진 단어와 군더더기를 표시해 줍니다.
// ====================================================
let wrState = { q: [], i: 0, done: false, hint: false, text: '', setN: 0, setSum: 0, scope: null, last: null };
const WR_SET = 10;
let wrToday = loadWrToday();
let wrStat = loadWrStat();

function wrDayStamp() {
  const d = new Date();
  if (d.getHours() < 4) d.setDate(d.getDate() - 1);   // 새벽 4시를 하루 경계로
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function loadWrToday() {
  try {
    const o = JSON.parse(localStorage.getItem('hv_today') || 'null');
    if (o && o.d === wrDayStamp()) return o;
  } catch (e) {}
  return { d: wrDayStamp(), keys: [] };
}
function loadWrStat() {
  try {
    const o = JSON.parse(localStorage.getItem('hv_write') || 'null');
    if (o && o.d === wrDayStamp()) return o;
  } catch (e) {}
  return { d: wrDayStamp(), n: 0, sum: 0 };
}
function wrLearned(key) {                    // 오늘 체크·정답 처리한 단어를 모아 둡니다
  if (wrToday.d !== wrDayStamp()) wrToday = { d: wrDayStamp(), keys: [] };
  if (wrToday.keys.indexOf(key) < 0) {
    wrToday.keys.push(key);
    if (wrToday.keys.length > 400) wrToday.keys.shift();
    try { localStorage.setItem('hv_today', JSON.stringify(wrToday)); } catch (e) {}
  }
}
function wrSaveStat() {
  try { localStorage.setItem('hv_write', JSON.stringify(wrStat)); } catch (e) {}
}

/* ---------- 채점 엔진 ---------- */
function wrTokens(s) {
  let t = String(s || '').replace(/<[^>]+>/g, '').toLowerCase();
  if (t.normalize) t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  t = t.replace(/[‘’ʼ]/g, "'").replace(/[^a-z0-9'\s-]/g, ' ');
  return t.split(/[\s-]+/).filter(Boolean);
}
function wrStem(w) {
  w = w.replace(/'s$/, '').replace(/^'|'$/g, '');
  if (w.length > 4 && /ies$/.test(w)) return w.slice(0, -3) + 'y';
  if (w.length > 4 && /(ches|shes|sses|xes)$/.test(w)) return w.slice(0, -2);
  if (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
  if (w.length > 4 && /ing$/.test(w)) return w.slice(0, -3);
  if (w.length > 4 && /ed$/.test(w)) return w.slice(0, -2);
  return w;
}
function wrSame(a, b) { return a === b || wrStem(a) === wrStem(b); }

function wrAlign(mine, ref) {                // 최장 공통 부분수열로 두 문장을 맞춰 봅니다
  const n = mine.length, m = ref.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = wrSame(mine[i], ref[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (wrSame(mine[i], ref[j])) { ops.push({ t: 'ok', w: mine[i], exact: mine[i] === ref[j] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: 'extra', w: mine[i] }); i++; }
    else { ops.push({ t: 'miss', w: ref[j] }); j++; }
  }
  while (i < n) ops.push({ t: 'extra', w: mine[i++] });
  while (j < m) ops.push({ t: 'miss', w: ref[j++] });
  return { ops, lcs: dp[0][0] };
}

function wrGrade(text, q) {
  const mine = wrTokens(text), ref = wrTokens(q.en);
  const a = wrAlign(mine, ref);
  const score = (mine.length + ref.length) ? Math.round(200 * a.lcs / (mine.length + ref.length)) : 0;
  let used = true;
  if (q.target) {
    used = false;
    const tg = wrTokens(q.target);
    for (const t of tg) { if (mine.some(w => wrSame(w, t))) { used = true; break; } }
  }
  return { score, ops: a.ops, used, empty: !mine.length };
}
function wrLevel(sc) {
  if (sc >= 85) return { t: '모범 예문과 거의 같아요', c: 'var(--green-dot)' };
  if (sc >= 65) return { t: '충분히 통하는 문장이에요', c: 'var(--green-dot)' };
  if (sc >= 40) return { t: '뜻은 전해져요 — 표현을 다듬어 볼까요', c: 'var(--star)' };
  return { t: '모범 예문과 많이 달라요', c: 'var(--red)' };
}

/* ---------- 문제 뽑기 ---------- */
function wrMake(day, w) {
  if (!w.ex || !w.exkr) return null;
  return {
    ko: w.exkr,
    en: String(w.ex).replace(/<[^>]+>/g, ''),
    target: w.en,
    tip: w.tip || '',
    day: day,
    n: w.n
  };
}
function wrPool() {
  const out = [];
  if (wrState.scope === 'today') {
    if (wrToday.d !== wrDayStamp()) wrToday = { d: wrDayStamp(), keys: [] };
    wrToday.keys.forEach(key => {
      const [dn, wn] = key.split('_').map(Number);
      const day = DAYS.find(d => d.num === dn);
      const w = day && day.words.find(x => x.n === wn);
      const q = w && wrMake(dn, w);
      if (q) out.push(q);
    });
  } else if (wrState.scope === 'all') {
    DAYS.forEach(d => d.words.forEach(w => { const q = wrMake(d.num, w); if (q) out.push(q); }));
  } else {
    const day = DAYS.find(d => d.num === Number(wrState.scope));
    if (day) day.words.forEach(w => { const q = wrMake(day.num, w); if (q) out.push(q); });
  }
  return out;
}
function wrShuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ---------- 화면 ---------- */
function showWrite() {
  if (wrState.scope === null) wrState.scope = String(currentDay);
  wrState.q = []; wrState.i = 0; wrState.done = false; wrState.last = null;
  wrState.text = ''; wrState.hint = false; wrState.setN = 0; wrState.setSum = 0;
  renderWriteSetup();
}

function renderWriteSetup() {
  if (wrStat.d !== wrDayStamp()) wrStat = { d: wrDayStamp(), n: 0, sum: 0 };
  const todayN = (wrToday.d === wrDayStamp() ? wrToday.keys.length : 0);
  let opts = `<option value="today"${wrState.scope === 'today' ? ' selected' : ''}>오늘 체크한 단어 (${todayN}개)</option>`;
  DAYS.forEach(d => {
    opts += `<option value="${d.num}"${String(wrState.scope) === String(d.num) ? ' selected' : ''}>` +
            `DAY ${String(d.num).padStart(2, '0')} - ${d.story}</option>`;
  });
  opts += `<option value="all"${wrState.scope === 'all' ? ' selected' : ''}>전체 (30 Days)</option>`;

  document.getElementById('mainContent').innerHTML = `
  <div class="wr-wrap">
    <div class="wr-h1">✍️ 영작 연습</div>
    <div class="wr-sub">한글 해석만 보고 예문을 영어로 써 보세요. 책 속 모범 예문과 단어 단위로 맞춰
      점수를 매기고, 빠진 단어와 군더더기를 표시해 드립니다.</div>
    <div class="wr-setup">
      <label>출제 범위</label>
      <select id="wrScope" onchange="wrPickScope(this.value)">${opts}</select>
      <button class="wr-go" onclick="wrStart()">▶ 시작 (${WR_SET}문장)</button>
    </div>
    <div class="wr-stat">오늘 ${wrStat.n}문장 · ${wrStat.n ? '평균 ' + Math.round(wrStat.sum / wrStat.n) + '점' : '아직 시작 전'}</div>
  </div>`;
}

function wrPickScope(v) { wrState.scope = v; }

function wrStart() {
  const sel = document.getElementById('wrScope');
  if (sel) wrState.scope = sel.value;
  const pool = wrPool();
  if (!pool.length) {
    alert(wrState.scope === 'today'
      ? '오늘 체크한 단어가 아직 없어요.\n학습 모드에서 단어를 ○ 로 체크하거나 퀴즈를 풀면 여기로 모입니다.'
      : '이 범위에는 예문이 있는 단어가 없어요.');
    return;
  }
  wrState.q = wrShuffle(pool).slice(0, WR_SET);
  wrState.i = 0; wrState.done = false; wrState.last = null; wrState.text = ''; wrState.hint = false;
  wrState.setN = 0; wrState.setSum = 0;
  renderWrite();
}

function renderWrite() {
  const mc = document.getElementById('mainContent');

  if (wrState.i >= wrState.q.length) {                       // 세트 요약
    const avg = wrState.setN ? Math.round(wrState.setSum / wrState.setN) : 0;
    mc.innerHTML = `
    <div class="wr-wrap">
      <div class="wr-card wr-center">
        <div class="wr-big" style="color:${wrLevel(avg).c}">${avg}</div>
        <div class="wr-sub" style="margin:4px 0 18px">${wrState.setN}문장 평균 점수</div>
        <button class="wr-go" onclick="wrStart()">🔄 한 세트 더</button>
        <button class="wr-ghost" onclick="renderWriteSetup()">범위 바꾸기</button>
      </div>
    </div>`;
    return;
  }

  const q = wrState.q[wrState.i];
  const r = wrState.last;
  let h = `
  <div class="wr-wrap">
    <div class="wr-card">
      <div class="wr-tag">${wrState.i + 1} / ${wrState.q.length} · DAY ${String(q.day).padStart(2, '0')}</div>
      <div class="wr-ko">${q.ko}</div>
      <div class="wr-hintrow">
        <span class="wr-chip">단어 ${wrTokens(q.en).length}개</span>
        ${wrState.hint
          ? `<span class="wr-chip on">${q.target}</span>`
          : `<button class="wr-chip" onclick="wrHint()">💡 단어 힌트</button>`}
      </div>
      <textarea class="wr-ta" id="wrTa" placeholder="영어로 써 보세요" spellcheck="false"
        ${wrState.done ? 'readonly' : ''}>${wrState.text || ''}</textarea>
      <div class="wr-btns">`;

  h += wrState.done
    ? `<button class="wr-ghost" onclick="wrRetry()">다시 쓰기</button>
       <button class="wr-go" onclick="wrNext()">${wrState.i + 1 >= wrState.q.length ? '결과 보기' : '다음 문장 →'}</button>`
    : `<button class="wr-ghost" onclick="wrReveal()">모범 예문 보기</button>
       <button class="wr-go" onclick="wrCheck()">채점</button>`;
  h += `</div>`;

  if (wrState.done && r) {
    const lv = wrLevel(r.score);
    h += `<div class="wr-res">
      <div class="wr-score"><b style="color:${lv.c}">${r.score}</b><span>점 · ${lv.t}</span>
        <span class="wr-chip"${r.used ? '' : ' style="border-color:var(--red);color:var(--red)"'}>핵심 단어 ${r.used ? '✓' : '✗'}</span>
      </div>`;
    if (!r.empty) {
      const mine = r.ops.map(o =>
        o.t === 'ok' ? `<span class="${o.exact ? 'wr-ok' : 'wr-near'}">${o.w}</span>`
        : o.t === 'extra' ? `<span class="wr-extra">${o.w}</span>` : '').filter(Boolean).join(' ');
      h += `<div class="wr-line"><span class="wr-lab">내가 쓴 문장</span><div class="wr-txt">${mine}</div></div>`;
    }
    h += `<div class="wr-line"><span class="wr-lab">모범 예문</span><div class="wr-txt">${q.en}${spkBtn(q.en, 'sm')}</div></div>`;
    const miss = r.ops.filter(o => o.t === 'miss').map(o => o.w);
    if (miss.length) {
      h += `<div class="wr-line"><span class="wr-lab">빠진 단어</span>
            <div class="wr-txt"><span class="wr-miss">${miss.slice(0, 8).join(', ')}</span></div></div>`;
    }
    if (q.tip) h += `<div class="wr-tip">${String(q.tip).replace(/<[^>]+>/g, '')}</div>`;
    h += `</div>`;
  }

  h += `</div></div>`;
  mc.innerHTML = h;

  const ta = document.getElementById('wrTa');
  if (ta && !wrState.done) {
    ta.focus();
    ta.addEventListener('input', () => { wrState.text = ta.value; });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); wrCheck(); }
    });
  }
}

function wrHint() { wrState.hint = true; renderWrite(); }
function wrRetry() { wrState.done = false; wrState.last = null; wrState.text = ''; renderWrite(); }
function wrNext() { wrState.i++; wrState.done = false; wrState.last = null; wrState.text = ''; wrState.hint = false; renderWrite(); }

function wrCheck() {
  const ta = document.getElementById('wrTa');
  if (!ta) return;
  const txt = ta.value.trim();
  if (!txt) { ta.focus(); return; }
  wrState.text = txt;
  wrState.last = wrGrade(txt, wrState.q[wrState.i]);
  wrState.done = true;
  if (wrStat.d !== wrDayStamp()) wrStat = { d: wrDayStamp(), n: 0, sum: 0 };
  wrStat.n++; wrStat.sum += wrState.last.score;
  wrSaveStat();
  wrState.setN++; wrState.setSum += wrState.last.score;
  renderWrite();
}

function wrReveal() {                        // 채점 없이 모범 예문만 확인
  const ta = document.getElementById('wrTa');
  wrState.text = ta ? ta.value : '';
  wrState.last = wrGrade(wrState.text, wrState.q[wrState.i]);
  wrState.done = true;
  renderWrite();
}

// ====================================================
// 테마 — 홈·매일 영어와 같은 칸에 저장해 세 화면이 함께 바뀝니다.
// ====================================================
const THEME_KEY = 'english-room-theme';

function readTheme() {
  try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; }
}
function applyTheme(t) {
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('#themeRow button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
}
applyTheme(readTheme());
document.getElementById('themeRow').addEventListener('click', e => {
  const b = e.target.closest('button[data-t]');
  if (!b) return;
  try { localStorage.setItem(THEME_KEY, b.dataset.t); } catch (err) {}
  applyTheme(b.dataset.t);
});


// ====================================================
// 발음 듣기 — 기기에 내장된 음성으로 읽어 줍니다.
// 별도 오디오 파일이 없어 인터넷 없이도 동작합니다.
// ====================================================
let ttsVoice = null;

const VOICE_KEY = 'english-room-voice';

function enVoices() {
  if (!window.speechSynthesis) return [];
  return speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
}

/* 기기에 설치된(오프라인) 음성을 먼저 고릅니다.
   엣지의 'Online (Natural)' 음성은 인터넷이 막히면 소리 없이 끝나는 일이 있어
   직접 고르지 않는 한 뒤로 미룹니다. */
function pickVoice() {
  if (!window.speechSynthesis) return;
  const vs = enVoices();
  if (!vs.length) { ttsVoice = null; return; }
  let saved = null;
  try { saved = localStorage.getItem(VOICE_KEY); } catch (e) {}
  const byName = saved && vs.find(v => v.name === saved);
  if (byName) { ttsVoice = byName; return; }
  const local = vs.filter(v => v.localService && !/online/i.test(v.name));
  const us = a => a.find(v => /en[-_]US/i.test(v.lang));
  ttsVoice = us(local) || local[0] || us(vs) || vs[0] || null;
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = () => { pickVoice(); buildVoiceRow(); };
}

/* 서랍에서 음성을 직접 고를 수 있게 — 기기마다 되는 음성이 달라서요. */
function buildVoiceRow() {
  const wrap = document.getElementById('voiceRow');
  if (!wrap) return;
  const vs = enVoices();
  if (!vs.length) { wrap.hidden = true; return; }
  wrap.hidden = false;
  const cur = ttsVoice ? ttsVoice.name : '';
  wrap.querySelector('select').innerHTML = vs.map(v =>
    `<option value="${v.name.replace(/"/g, '&quot;')}"${v.name === cur ? ' selected' : ''}>` +
    `${v.name}${v.localService ? '' : ' (온라인)'}</option>`).join('');
}

function setVoice(name) {
  try { localStorage.setItem(VOICE_KEY, name); } catch (e) {}
  pickVoice();
  const btn = document.querySelector('#voiceRow button');
  if (btn) say(btn);                   // 고르자마자 들어볼 수 있게
}

/* 버튼 마크업 — 카드·예문·퀴즈에서 같은 모양으로 씁니다. */
function spkBtn(text, size) {
  const t = String(text || '').replace(/<[^>]+>/g, '').replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  if (!t) return '';
  return `<button class="spk${size ? ' ' + size : ''}" data-say="${t}" title="발음 듣기"
     aria-label="발음 듣기" onclick="event.stopPropagation();say(this)">
     <svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg>
   </button>`;
}

let toastT = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 2600);
}

let sayWatch = null;

function say(btn, retryPlain) {
  if (!window.speechSynthesis) {
    toast('이 브라우저는 발음 재생을 지원하지 않아요');
    return;
  }
  clearTimeout(sayWatch);
  speechSynthesis.cancel();
  document.querySelectorAll('.spk.play').forEach(b => b.classList.remove('play'));

  const text = btn.dataset.say;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.92; u.pitch = 1;
  if (!ttsVoice) pickVoice();          // 음성 목록이 늦게 오는 브라우저 대비
  if (ttsVoice && !retryPlain) u.voice = ttsVoice;

  let started = false;
  btn.classList.add('play');
  u.onstart = () => { started = true; clearTimeout(sayWatch); };
  u.onend = () => { clearTimeout(sayWatch); btn.classList.remove('play'); };
  /* 기기에 영어 음성이 없으면 소리 없이 끝나므로 이유를 알려줍니다.
     (직전 재생을 끊어서 나는 interrupted·canceled 는 알릴 일이 아닙니다.) */
  u.onerror = (e) => {
    clearTimeout(sayWatch);
    btn.classList.remove('play');
    const err = e && e.error;
    if (err === 'interrupted' || err === 'canceled') return;
    if (!retryPlain) { say(btn, true); return; }      // 기본 음성으로 한 번 더
    toast(enVoices().length
      ? '음성이 재생되지 않았어요. 서랍에서 다른 음성을 골라 보세요'
      : '이 기기에 영어 음성이 없어 재생하지 못했어요');
  };

  speechSynthesis.speak(u);

  /* 엣지의 온라인 음성 등은 오류도 없이 조용히 끝나기도 합니다.
     1초 안에 시작되지 않으면 기본 음성으로 한 번 더 시도합니다. */
  sayWatch = setTimeout(() => {
    if (started) return;
    btn.classList.remove('play');
    if (!retryPlain) { say(btn, true); return; }
    toast(enVoices().length
      ? '음성이 재생되지 않았어요. 기기 음량과 음성 설정을 확인해 주세요'
      : '이 기기에 영어 음성이 없어 재생하지 못했어요');
  }, 1000);
}

// ====================================================
// 앱 껍데기 — DAY 서랍 · 검색 · 모드 · 하단 독
// ====================================================
function openDrawer() {
  buildVoiceRow();
  document.getElementById('drawer').classList.add('open');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('btnDays').classList.add('on');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('btnDays').classList.remove('on');
}
function toggleDrawer() {
  document.getElementById('drawer').classList.contains('open') ? closeDrawer() : openDrawer();
}
function moveDay(step) {
  const i = DAYS.findIndex(d => d.num === currentDay);
  const next = DAYS[Math.min(DAYS.length - 1, Math.max(0, i + step))];
  if (!next || next.num === currentDay) return;
  currentDay = next.num;
  mode = 'study';
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.m === 'study'));
  buildSidebar();
  showDay(currentDay);
  window.scrollTo(0, 0);
}

document.getElementById('btnDays').onclick = toggleDrawer;
document.getElementById('dockDays').onclick = toggleDrawer;
document.getElementById('drawerClose').onclick = closeDrawer;
document.getElementById('scrim').onclick = closeDrawer;
document.getElementById('dockTop').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
document.getElementById('dockPrev').onclick = () => moveDay(-1);
document.getElementById('dockNext').onclick = () => moveDay(1);

document.querySelectorAll('#seg button').forEach(b => {
  b.onclick = () => setMode(b.dataset.m);
});

/* 검색은 아이콘으로 열고 닫습니다 */
document.getElementById('btnSearchToggle').onclick = function () {
  const wrap = document.getElementById('searchWrap');
  const input = document.getElementById('searchInput');
  const open = wrap.classList.toggle('open');
  this.classList.toggle('on', open);
  if (open) setTimeout(() => input.focus(), 120);
  else if (input.value) { input.value = ''; handleSearch(''); }
};

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('drawer').classList.contains('open')) { closeDrawer(); return; }
  const wrap = document.getElementById('searchWrap');
  if (wrap.classList.contains('open')) document.getElementById('btnSearchToggle').click();
});


// ====================================================
// 앱으로 설치 / 오프라인 실행
// ====================================================
// 윈도우 엣지·크롬, 안드로이드 크롬에서만 설치 안내 이벤트가 옵니다.
// (아이폰 사파리는 이 이벤트가 없어 공유 → 홈 화면에 추가로 설치합니다.)
let installEvt = null;

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  installEvt = e;
  document.getElementById('drawerFt').hidden = false;
});

function doInstall() {
  if (!installEvt) return;
  const e = installEvt;
  installEvt = null;
  document.getElementById('drawerFt').hidden = true;
  e.prompt();
}

window.addEventListener('appinstalled', function() {
  installEvt = null;
  document.getElementById('drawerFt').hidden = true;
});

// 한 번 열어두면 인터넷이 끊겨도 열립니다. 파일을 직접 열었을 때는 조용히 넘어갑니다.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function() {});
  });
}


// ====================================================
// INIT
// ====================================================
buildSidebar();
showDay(1);
</script>
