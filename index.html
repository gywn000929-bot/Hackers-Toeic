<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fbfcfe" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151f" media="(prefers-color-scheme: dark)">
<meta name="description" content="매일 영어(OPIc IH 실전 표현 1000)와 해커스 토익 기출 보카를 한 앱에서. 오프라인으로 열립니다.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="영어 공부방">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons-app/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons-app/icon-192.png">
<title>영어 공부방 · 매일 영어 + 토익 보카</title>
<style>
:root {
  --ink:#16233d; --ink-2:#46536c; --ink-3:#7c8698;
  --bg:#fbfcfe; --surface:#ffffff; --surface-2:#f3f6fb;
  --line:#e4e9f2; --line-soft:#eef2f8;
  --word:#2f5fd0; --word-bg:#ecf1fd;
  --phrase:#0f7a72; --phrase-bg:#e6f4f2;
  --sent:#b8792a; --sent-bg:#fbf1e2;
  --star:#e8a317; --ok:#2f9461; --ok-bg:#e8f5ee;
  --shadow: 0 1px 2px rgba(22,35,61,.05), 0 6px 18px -10px rgba(22,35,61,.18);
  --sans: -apple-system, BlinkMacSystemFont, 'Pretendard Variable', Pretendard,
          'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', system-ui, sans-serif;
  --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia,
           'Times New Roman', serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink:#e7ecf5; --ink-2:#a7b2c6; --ink-3:#74809a;
    --bg:#10151f; --surface:#161d2b; --surface-2:#1d2637;
    --line:#29334a; --line-soft:#212a3d;
    --word:#7ea4f5; --word-bg:#1c2947;
    --phrase:#55c3b7; --phrase-bg:#123331;
    --sent:#e0a75d; --sent-bg:#33260f;
    --star:#f0b73f; --ok:#4fbb84; --ok-bg:#123326;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans);
  line-height: 1.6; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
:focus-visible { outline: 2px solid var(--word); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.en { font-family: var(--serif); }

.wrap { max-width: 620px; margin: 0 auto; padding: 22px 18px calc(28px + var(--safe-b)); }

/* 머리말 */
.hd { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.mark {
  width: 42px; height: 42px; border-radius: 12px; flex: 0 0 auto;
  background: var(--ink); position: relative; overflow: hidden;
}
.mark i, .mark b {
  position: absolute; display: block; border-radius: 3px; background: var(--bg);
}
.mark i { width: 20px; height: 15px; left: 7px; top: 9px; opacity: .5; }
.mark b { width: 20px; height: 15px; left: 15px; top: 18px; }
.mark b::after {
  content: ''; position: absolute; left: 3px; right: 3px; bottom: 3px;
  height: 3px; border-radius: 2px; background: var(--word);
}
.hd-t { font-size: 1.06rem; font-weight: 800; letter-spacing: -.4px; }
.hd-s { font-size: .72rem; color: var(--ink-3); margin-top: 1px; }

/* 오늘 요약 */
.today {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 6px; margin-bottom: 18px; display: flex; box-shadow: var(--shadow);
}
.t-c { flex: 1; text-align: center; padding: 0 4px; }
.t-c b { display: block; font-size: 1.3rem; font-weight: 800; line-height: 1.2; }
.t-c span { font-size: .68rem; color: var(--ink-3); font-weight: 700; }
.t-sep { width: 1px; background: var(--line); margin: 2px 0; }

/* 앱 카드 */
.cards { display: flex; flex-direction: column; gap: 14px; }
.card {
  display: block; background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--word); border-radius: 16px; padding: 20px;
  box-shadow: var(--shadow); transition: transform .12s, box-shadow .2s, border-color .2s;
}
.card.toeic { border-left-color: var(--phrase); }
@media (hover: hover) and (pointer: fine) {
  .card:hover { transform: translateY(-2px); border-color: var(--word); }
  .card.toeic:hover { border-color: var(--phrase); }
}
.card:active { transform: scale(.995); }
.c-top { display: flex; align-items: center; gap: 10px; }
.c-ico { font-size: 1.5rem; }
.c-t { font-size: 1.05rem; font-weight: 800; letter-spacing: -.3px; }
.c-s { font-size: .74rem; color: var(--ink-3); margin-top: 2px; }
.c-go { margin-left: auto; color: var(--ink-3); font-size: 1.1rem; }
.c-desc { font-size: .82rem; color: var(--ink-2); margin-top: 12px; line-height: 1.65; }
.c-stat { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.chip {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
  border-radius: 8px; padding: 4px 9px; font-size: .71rem; font-weight: 700;
}
.chip b { color: var(--word); font-variant-numeric: tabular-nums; }
.card.toeic .chip b { color: var(--phrase); }

/* 설치 안내 */
.install {
  display: none; margin-top: 16px; background: var(--word-bg); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px 16px; align-items: center; gap: 12px;
}
.install.on { display: flex; }
.install .txt { flex: 1; font-size: .78rem; color: var(--ink-2); line-height: 1.5; }
.install .txt b { display: block; font-size: .86rem; color: var(--ink); margin-bottom: 2px; }
.install button {
  flex: 0 0 auto; background: var(--word); color: var(--bg); border-radius: 10px;
  padding: 9px 16px; font-size: .8rem; font-weight: 800;
}
.foot { margin-top: 20px; font-size: .72rem; color: var(--ink-3); line-height: 1.7; text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hd">
    <div class="mark" aria-hidden="true"><i></i><b></b></div>
    <div>
      <div class="hd-t">영어 공부방</div>
      <div class="hd-s">매일 영어 · 토익 보카 — 한 앱에서, 인터넷 없이</div>
    </div>
  </header>

  <section class="today" id="today"></section>

  <nav class="cards">
    <a class="card" href="./opic_ih_daily_english.html">
      <div class="c-top">
        <span class="c-ico">🗣️</span>
        <div>
          <div class="c-t">매일 영어</div>
          <div class="c-s">OPIc IH 실전 표현 1000</div>
        </div>
        <span class="c-go">→</span>
      </div>
      <div class="c-desc">일상에서 쓰는 단어·숙어·문장 1000개. 안키식 간격 반복 복습, 퀴즈,
        플래시카드, ✍️ 영작까지.</div>
      <div class="c-stat" id="statOpic"></div>
    </a>

    <a class="card toeic" href="./hackers_toeic_vocab_30.html">
      <div class="c-top">
        <span class="c-ico">📖</span>
        <div>
          <div class="c-t">토익 보카</div>
          <div class="c-s">해커스 토익 기출 보카 · 30일 완성</div>
        </div>
        <span class="c-go">→</span>
      </div>
      <div class="c-desc">DAY 1~30 기출 단어. 예문·출제 팁·파생어와 5가지 퀴즈,
        ✍️ 영작까지.</div>
      <div class="c-stat" id="statToeic"></div>
    </a>
  </nav>

  <div class="install" id="install">
    <div class="txt"><b>앱으로 설치하기</b>바탕화면·홈 화면에 두고 창으로 열 수 있어요.</div>
    <button id="btnInstall">설치</button>
  </div>

  <p class="foot">
    학습 기록은 이 기기에만 저장됩니다.<br>
    한 번 열어두면 인터넷이 없어도 그대로 열립니다.
  </p>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };

  /* 하루 경계는 두 앱과 같게 새벽 4시 */
  function dayStart(ts) {
    var d = new Date(ts);
    if (d.getHours() < 4) d.setDate(d.getDate() - 1);
    d.setHours(4, 0, 0, 0);
    return d.getTime();
  }
  function dayStamp() {
    var d = new Date();
    if (d.getHours() < 4) d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function read(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  }
  function count(o) { var n = 0; for (var k in o) if (o[k]) n++; return n; }

  /* ---------- 매일 영어 ---------- */
  var S = read('opic-ih-1000') || {};
  var today = dayStart(Date.now());
  var opicDone = count(S.done), opicStar = count(S.star);
  var opicStreak = (S.streak && S.streak.n) || 0;
  var opicRev = (S.srsDay && S.srsDay.d === today) ? (S.srsDay.n + S.srsDay.rv) : 0;
  var opicWr = (S.wr && S.wr.d === today) ? S.wr : { n: 0, sum: 0 };

  /* ---------- 토익 보카 ---------- */
  var checked = read('hv_checked') || {};
  var hvToday = read('hv_today');
  var hvWrite = read('hv_write');
  var toeicDone = count(checked);
  var toeicToday = (hvToday && hvToday.d === dayStamp()) ? hvToday.keys.length : 0;
  var toeicWr = (hvWrite && hvWrite.d === dayStamp()) ? hvWrite : { n: 0, sum: 0 };

  var wrN = opicWr.n + toeicWr.n;
  var wrSum = opicWr.sum + toeicWr.sum;

  /* ---------- 오늘 요약 ---------- */
  var cells = [
    ['🔥', opicStreak, '연속 학습일'],
    ['🧠', opicRev, '오늘 복습'],
    ['✍️', wrN, '오늘 영작'],
    ['✓', opicDone + toeicDone, '완료 카드']
  ];
  var h = '';
  for (var i = 0; i < cells.length; i++) {
    if (i) h += '<div class="t-sep"></div>';
    h += '<div class="t-c"><b class="num">' + cells[i][1] + '</b><span>' + cells[i][0] + ' ' + cells[i][2] + '</span></div>';
  }
  $('#today').innerHTML = h;

  /* ---------- 앱별 배지 ---------- */
  function chips(list) {
    var out = '';
    for (var i = 0; i < list.length; i++) {
      out += '<span class="chip">' + list[i][0] + ' <b>' + list[i][1] + '</b>' + (list[i][2] || '') + '</span>';
    }
    return out;
  }
  $('#statOpic').innerHTML = chips([
    ['완료', opicDone, ' / 1000'],
    ['★', opicStar, ''],
    ['오늘 복습', opicRev, '개']
  ]);
  $('#statToeic').innerHTML = chips([
    ['체크한 단어', toeicDone, '개'],
    ['오늘 체크', toeicToday, '개']
  ]);
  if (wrN) {
    $('#statOpic').insertAdjacentHTML('beforeend',
      '<span class="chip">오늘 영작 평균 <b>' + Math.round(wrSum / wrN) + '</b>점</span>');
  }

  /* ---------- 설치 ---------- */
  var installEvt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installEvt = e;
    $('#install').classList.add('on');
  });
  $('#btnInstall').addEventListener('click', function () {
    if (!installEvt) return;
    var e = installEvt; installEvt = null;
    $('#install').classList.remove('on');
    e.prompt();
  });
  window.addEventListener('appinstalled', function () {
    installEvt = null;
    $('#install').classList.remove('on');
  });

  /* ---------- 오프라인 실행 ---------- */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
